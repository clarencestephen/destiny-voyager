  learner_path:
  - '1st: add_clear.'
  - '2nd: runner.'
  plain_language_steps:
  - 1. Place the rally banner near the entry, then enter the multi-level vertical structure (3 floors).
  - 2. On each floor, kill a Conduit Minotaur and step in its pool to get the Arctrician buff.
  - 3. Identify each floor's circuit start node by its chevron arrows, then trace and shoot the nodes
    in order to the end node.
  - 4. There are 2 circuits per floor (sometimes parallel). One player can run circuits while the other
    two suppress adds.
  - 5. Watch for nodes hidden under catwalks - check the UNDERSIDES of walkways if a yellow cable seems
    to dead-end.
  - 6. Clear Goblins, Hydras, and Hobgoblins that shoot from elevation while the runner focuses on nodes.
  - 7. If your Arctrician is about to expire mid-circuit, call 'Need Minotaur - 10s' so a teammate drops
    a fresh pool.
  - 8. On floor 2, avoid the Arc gates (shocking energy barriers) - do not stand in an exposed sightline
    or you take line-of-sight Arc damage.
  - 9. Completing all circuits on a floor powers that floor's grav lift; ride it up to the next floor.
  - '10. OPTIONAL: grab Hidden Chest 1 - in the crane-jump platforming section, reach the second high
    catwalk, jump behind the pillars to a ledge that bridges to another catwalk, and find the chest behind
    the last pillar.'
  - 11. Repeat per floor until you reach the top and the encounter completes.
  defense:
    incoming_damage:
      adds:
      - Arc (Vex line/slap-rifle fire from Goblins, Hobgoblins, and Hydras)
      - Arc gate barriers deal contact/line-of-sight Arc damage if you cross their sightline
      boss: []
    champions:
    - 'Master only: Barrier Hydra -> Anti-Barrier'
    - 'Master only: Unstoppable Minotaur -> Anti-Unstoppable (the Conduit Minotaurs become Unstoppable
      on Master)'
    recommended_defensive_mods:
      elemental:
      - Arc resist helps against the Vex line-rifle volleys and the Arc gates; not mandatory on Normal.
      concussive:
      - Not particularly needed here - incoming damage is projectile/line-rifle, not blast-based.
  damage:
    surges:
    - No boss / no DPS phase - this is a traversal-and-circuits floor climb, so there are no surges to
      set.
    burst_windows: No damage phase; pace is gated by circuit completion powering each grav lift.
    recommended_dps:
    - Not applicable (no boss). Prioritize ranged add-clear that can hit elevated Hydras and Hobgoblins.
