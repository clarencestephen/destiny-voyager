  - 'Hunter (first encounter): same Prismatic Celestial Nighthawk Golden Gun build as the entrance, but
    swap the kinetic to Izanagi''s Burden (a charged shot one-shots the Hydras) and bring a machine gun
    for add-clear (or an Eager''s Edge sword to just speedrun the wires). Boots: double Void weapon surge
