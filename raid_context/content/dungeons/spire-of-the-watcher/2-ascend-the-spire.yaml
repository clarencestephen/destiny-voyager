        weapons: Mid-to-long-range Primary plus a Special for tougher Hydras. Heavy for tanky adds on
          Master. Add Anti-Barrier on Master to break Barrier Hydra shields.
        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: No DPS surge needed. On Master, Anti-Barrier / Anti-Unstoppable plus resilience mods.
  cheese: []
  common_mistakes:
  - Following yellow cable visually under a catwalk and missing the node — check catwalk UNDERSIDES.
  rewards:
    guaranteed:
    - 1× dungeon armor or weapon
    hidden_chest:
      location: 'HIDDEN CHEST 1: Second high catwalk after the crane-jumps in

        ''Begin the Ascent'' platforming section. Jump behind the pillars

        to find a ledge bridging to another catwalk. Chest is behind

        the last pillar.

        '
      rewards:
      - Random roll of an already-obtained dungeon weapon
    potential_drops:
    - Terminus Horizon (machine gun, Arc)
    - Long Arm (scout rifle, Arc)
    - Seventh Seraph Carbine (auto rifle, Kinetic)
    - TM Cogburn armor — Gauntlets + Legguards + Cover
  images:
    overview: ''
    setup: ''
