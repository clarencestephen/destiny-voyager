      and resistance mods.
  - role_id: add_clear
    subclass: Any subclass that can suppress Hydras and Hobgoblins from range (Void for suppression/volatile,
      or Arc for chaining adds).
    weapons: Mid-to-long-range Primary plus a Special for tougher Hydras. Heavy for tanky adds on Master.
      Add Anti-Barrier on Master to break Barrier Hydra shields.
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: No DPS surge needed. On Master, Anti-Barrier / Anti-Unstoppable plus resilience mods.
  - role_id: solo
    subclass: Self-sufficient survivable subclass (Solar for healing or Void for invis/overshield) to
