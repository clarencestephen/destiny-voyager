      does: Keeps Persys in/near core during last-circuit phase.
      loadout:
        subclass: Survivable subclass for tanking Persys's attention near the core (Void for overshield/invis
          or Solar for self-heal).
        weapons: A reliable Primary to keep aggro and tag adds, plus a heavy/special for the shared DPS
          window. Anti-Barrier on Master for the Hydras.
        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: Match surge mods to your DPS element for the burst window. On Master add Anti-Barrier
          / Anti-Unstoppable.
  cheese: []
  common_mistakes:
  - Finishing last yellow circuit BEFORE Persys is in core — soft-resets mechanic. ALWAYS check.
  - Refreshing Arctrician requires NEW Conduit Minotaur — they spawn after Hydras die. If you killed nothing,
    no pool.
  - DPS phase ends fast — bring burst weapons (Whisper, Sleeper, Linear).
  rewards:
    guaranteed:
    - 1× dungeon armor or weapon
    - Final chest (extra roll)
    hidden_chest: null
    potential_drops:
    - '**Hierarchy of Needs** (exotic combat bow, Solar) — per blueberries, drops from Persys chest. YAML''s
      ''quest, not random'' framing reflects the in-game pattern path.'
