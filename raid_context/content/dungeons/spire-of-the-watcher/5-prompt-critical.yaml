    subclass: Survivable subclass for tanking Persys's attention near the core (Void for overshield/invis
      or Solar for self-heal).
    weapons: A reliable Primary to keep aggro and tag adds, plus a heavy/special for the shared DPS window.
      Anti-Barrier on Master for the Hydras.
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: Match surge mods to your DPS element for the burst window. On Master add Anti-Barrier
      / Anti-Unstoppable.
  - role_id: solo
    subclass: Self-sufficient survivable subclass (Solar for self-heal or Void for invis) since you run
