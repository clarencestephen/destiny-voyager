  meta_loadout:
  - 'Hunter (final encounter): Prismatic Celestial Nighthawk Golden Gun build; exotic weapon = 1000 Voices
    (staggers the boss; if you lack it use Thunderlord or any other exotic). Swap abilities to Marksman
    Dodge for faster 1k reloads (skip it if a Titan provides Rally Barricade). Run Supremacy with Kinetic
    Tremors as the kinetic (Kinetic Tremors helps clear the supplicants/goblins the Hydra spawns), or
    just a sniper. Damage-phase boots: triple Solar weapon surge for the 1k. Rotation: out of Well, pop
    Transcendence then Golden Gun (try for the precision hit), back into Well, fire 1k, repeat; dodge
    when low on 1k ammo. Ammo economy: Harmonic Scavenger boots, Heavy Ammo Finder + Heavy Ammo Scout
    helmet, finish Minotaurs for heavy ammo.'
  - 'Warlock (final encounter): start in the Dawnblade Speaker Sight support build with 1000 Voices and
    the No Hesitation healing auto; exotic weapon = 1000 Voices (Thunderlord or another exotic if you
    lack it). Pop Well of Radiance, then loadout-swap to the Sanguine Alchemy build for a x4 weapon surge
    on 1000 Voices during damage; swap back to the support build after each phase. If you can''t loadout-swap
    on console, set boots to double Solar surge instead. Note Ember of Ashes makes every 1k shot proc
    an ignition.'
  - 'Titan (final encounter): Stormkeep / Cuirass of the Falling Star; exotic weapon = 1000 Voices (Thunderlord
    or another weapon if you lack it). Loadout swap for three 1k charges: first loadout runs Recuperation
    + Innervation + Solar Scavenger for heavy ammo; at damage-phase start swap to triple Solar weapon
    surge, pop Rally Barricade, fire 1k, then Thundercrash. Non-swap option: Recuperation + double Solar
    surge.'
