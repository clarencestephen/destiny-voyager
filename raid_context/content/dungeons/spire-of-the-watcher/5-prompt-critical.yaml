  learner_path:
  - '1st: lurer (lowest cognitive load).'
  - '2nd: circuit_runner.'
  - 'Solo: do team clear first.'
  plain_language_steps:
  - '1. Enter the boss room: 4 pillars surround a central door to the reactor core (closed at first).
    Persys (a Vex Wyvern) emerges from the reactor when you start.'
  - 2. At the pull there are 2 Incarcerator Hydras (one on each side). Burst both Hydras down - call 'Hydras
    down - Minotaurs incoming.'
  - 3. Killing the Hydras spawns Conduit Minotaurs; kill those to drop Arctrician pools, and have the
    team pick up the buff.
  - '4. Activate the 5 yellow nodes that open the reactor: 4 are on the inside-facing pillar faces and
    1 is above the main door. When done, call ''REACTOR OPEN - start circuits.'''
  - 5. Move to the outer pillars. There are 4 yellow Arc circuits that start outside the pillars and lead
    INTO the reactor core. Two runners take 2 circuits each.
  - 6. One player acts as the lurer, pulling Persys toward and INTO the reactor core. Call 'Persys [in/out]
    of core' to keep the team updated.
  - '7. CRITICAL: you must lure Persys INSIDE the core BEFORE you complete the last yellow circuit. Finishing
    the last circuit while Persys is outside soft-resets the mechanic.'
  - 8. When the last circuit is ready, call 'Last circuit READY - Persys check?' and only finish once
    Persys is confirmed inside the core.
  - 9. With all circuits done and Persys inside, EVACUATE the core and refresh Arctrician from a fresh
    Conduit Minotaur (you need a new Minotaur for a new pool).
  - 10. Trigger the RED Arc circuit nodes on the inside pillar faces and above the door to start the reactor
    PURGE. Call 'PURGE - DPS core.'
  - 11. The purge forces Persys out and vulnerable; DPS its small radiolarian core (Wyvern weak point)
    during the roughly 15-20 second window.
  - 12. If Persys survives, it overcharges its shields and the cycle restarts from the yellow circuits
    - bring burst weapons and repeat.
  defense:
    incoming_damage:
      adds:
      - Arc (Vex line/slap-rifle fire from the Incarcerator Hydras and Conduit Minotaurs)
      boss:
      - Persys slap-rifle barrage (Vex Wyvern line-rifle volleys), most dangerous in tight spaces near
        the pillars and reactor
    champions:
    - 'Master only: Barrier Hydra -> Anti-Barrier (the two Incarcerator Hydras at pull)'
    - 'Master only: Unstoppable Minotaur -> Anti-Unstoppable (the Conduit Minotaurs)'
    recommended_defensive_mods:
      elemental:
      - Arc resist helps against Persys's slap-rifle barrage and the Hydra/Minotaur fire. Falling into
        the reactor's bottomless pit is a major non-elemental death - mind your footing.
      concussive:
      - Concussive Dampener can reduce the Wyvern slap-rifle barrage damage in the tight pillar spaces,
        though spacing and cover matter more.
  damage:
    surges:
    - No forced elemental burn. Persys has no specific elemental surge - bring your strongest burst element
      and match surge mods to your DPS weapon.
    - Solar (triple Solar weapon surge for 1000 Voices on damage; Warlock Sanguine Alchemy gives 1000
      Voices a x4 weapon surge; double Solar surge as the console/no-swap fallback)
    burst_windows: After the reactor purge forces Persys out, the small radiolarian core is vulnerable
      for roughly a 15-20 second DPS window.
    recommended_dps:
    - Whisper of the Worm or other heavy precision for the small weak point
    - Sleeper Simulant or other Linear Fusion Rifles
    - Sniper Rifles for the precise core hit
    - Rockets for burst if the core is held steady
    - Witherhoard for chip damage during the circuit-running (especially solo)
    - 1000 Voices (Solar exotic linear fusion) — main boss DPS; staggers the boss
    - Thunderlord (or any other exotic weapon) — fallback if you don't have 1000 Voices
    - Supremacy with Kinetic Tremors — Hunter, to also clear the supplicants/goblins the Hydra spawns
      during DPS
