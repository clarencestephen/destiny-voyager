  damage:
    surges: []
    burst_windows: A fairly long but high-risk outdoor damage phase, broken up by the orange-wave wipe
      mechanic (survive via bunker, then via the floor doors). You must keep moving to dodge lightning,
      so damage comes in bursts between repositions. The shield must first be removed by two Lower Stacks
      purges before any boss damage is possible.
    recommended_dps:
    - Burst Supers — Hunter Golden Gun and Titan Thundercrash named for fast high damage
    - Explosives you don't need to aim precisely — rockets and grenade launchers, best used close-ish
      to limit misses (closer = more risk)
    - Machine guns — Fixed Odds and Xenophage named for landing precision damage without committing to
      many shots and for clearing puppets
    - Rocket sidearms — Aberrant Action named (kills puppets in 4-5 shots, still damages the boss, pairs
      with Heal Clip for survival)
    - Sniper rifles — Supremacy and Cloud Strike named as god-tier; bring your best sniper
    - Anarchy — named for ticking the boss and copies simultaneously
    - 'Prioritize survivability: weapons/abilities usable in brief bursts or fire-and-forget so you can
      keep moving'
