  common_mistakes:
  - Killing the wrong boss copy in a purge room, which drops the purge timer to ~5 seconds and almost
    always wipes the team — let only the Scanner player kill the correct copy.
  - Standing still to aim during the outdoor phase and getting killed by lightning instead of staying
    mobile.
  - Crossing forcefields with augments equipped and losing them, then not knowing to re-grab them in the
    entry room on the active purge side.
  - Dunking the purge core without the whole team inside the bunker.
  - 'Forgetting the wipe-mechanic difference: first wave is survived in the bunker, the second wave must
    be survived by jumping into the floor doors.'
  - Trying to kill radioactive puppets while their radiation fields are up (they're invulnerable) instead
    of suppressing them first.
  - Rushing the Lower Stacks pathways and dying to mines/tripmines.
  - Not depositing/saving Suppressor between sections when it's the augment most worth keeping.
