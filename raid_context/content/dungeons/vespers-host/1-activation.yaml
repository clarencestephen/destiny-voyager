  common_mistakes:
  - Operator shooting a wrong panel, which causes instant death.
  - Letting the augment kill-timer run out instead of depositing it in a station.
  - Trying to dunk a core before destroying the newly-spawned Brig, which still shields the bins.
  - Carrying a nuclear core too long and dying at Radiation x10 instead of handing off or dropping it
    briefly.
  - Leaving a dropped core on the ground too long so it disappears and must be re-fetched.
  - Not depositing Scanner/Operator before leaving a room, forcing you to re-acquire augments from enemies
    later.
  - Lacking the damage to drop the larger final Brig boss in time.
