encounter:
  order: 2
  slug: infiltration
  name: Infiltration (Nuclear Core Traversal)
  abstract: 'A traversal puzzle through powered hallways while avoiding the giant Servitor Raneiks Unified.
    You gather nuclear cores from Fallen Captains and deposit them into numbered bins (1 through 5/6)
    in order. Doors are unpowered: you gain Power Reserves by deactivating forcefields/consoles and closing
    doors, and spend them to open doors. The video notes this section gives no rewards on its own; it
    sets up the Raneiks fight.'
  setup: You load in with your route blocked by a barrier. Toggling a Fallen console/power off lets you
    through and grants Power Reserves (shown left of screen). Raneiks floats around the hallways. The
    first bin (No. 1) is through the door to your right when you first see Raneiks.
  plain_language_steps:
  - 1. Toggle off the first barrier/console to pass through; this gives your team a tick of Power Reserves
    (shown on the left of your screen).
  - '2. Manage Power Reserves: deactivating a forcefield or closing a door behind you adds a point; opening
    a door spends one. Close doors behind you so you have power to open the next ones, and you can bank
    multiple points to open several doors at once.'
  - 3. Avoid Raneiks Unified, the giant Servitor floating the halls. Its standard fire hits hard, but
    the real threat is the purple Integration beam that tethers you and starts a death timer; break line
    of sight (keep cover between you and Raneiks) to interrupt it.
  - 4. Kill the Fallen Captains that spawn (usually near the bins) to get nuclear cores. Captains respawn,
    so you're not rushed — play safe.
  - 5. Deposit cores into the numbered bins in order. The No. 1 bin is through the door to your right
    when you first see Raneiks; deactivate the nearby forcefield for the power to open it. Filling the
    first three bins opens a large metal door near the No. 3 bin into the second half.
  - 6. Repeat with bins 4 and 5 to complete the puzzle. (One source counts bins 1 through 6.)
  - 7. After dunking the fifth core, run down the last hallway to a big hole in the floor that drops you
    away from the boss and toward the Raneiks fight.
  mechanics:
  - 'Power Reserves: deactivate forcefields/consoles or close doors to gain points; opening doors spends
    points. You must power-down somewhere to power-up elsewhere. Banking points lets you open several
    doors at once and circle back through reopened paths.'
  - 'Raneiks Unified roams the halls. Integration: a purple tether beam that starts a death timer; interrupt
    by breaking line of sight.'
  - Nuclear cores drop from Fallen Captains (which respawn near the bins) and carry their own timers;
    deposit them into numbered bins in order (1 through 5/6).
  - Route is non-fixed and changes based on where Raneiks is — take back routes through extra doors to
    avoid the boss when it blocks the direct path.
  - Filling the first three bins opens a large metal door near the No. 3 bin to the second half of the
    puzzle.
