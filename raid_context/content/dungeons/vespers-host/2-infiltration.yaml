  common_mistakes:
  - Running out of Power Reserves by opening doors without first closing/deactivating others to bank power.
  - Taking the direct route straight into Raneiks instead of routing around it when it blocks the path.
  - Standing in line of sight of Raneiks and letting the Integration tether timer run to zero instead
    of breaking LoS with cover.
  - Depositing cores in the wrong order instead of 1, 2, 3, then 4 and 5.
  - Rushing — Captains respawn, so panicking over core timers is unnecessary; play safe.
