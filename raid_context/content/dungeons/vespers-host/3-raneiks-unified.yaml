  common_mistakes:
  - Getting too close when planting the Suppressor hologram and getting nuked by Raneiks instead of staying
    behind cover.
  - Misreading the very subtle glow — confusing a Servitor firing Void attacks for a glowing one.
  - Recording duplicate numbers across the two rounds instead of four unique numbers.
  - Using precision/single-target weapons or long-reload guns and wasting the short damage window.
  - Reloading during the brief damage phase instead of dumping AoE continuously.
  - Failing to prioritize the seeking Exploder Shanks, which rush in and kill the team.
  - Carrying the Operator augment around early and dying to its timer instead of depositing it in the
    center station.
