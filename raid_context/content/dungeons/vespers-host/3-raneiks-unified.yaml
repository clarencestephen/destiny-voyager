encounter:
  order: 3
  slug: raneiks-unified
  name: Raneiks Unified (Boss Fight)
  abstract: A Servitor boss fight where Raneiks Unified is actually many small Servitors fused into one.
    You use the Suppressor augment to break it apart twice to read four glowing Servitor numbers (0-9),
    shoot the matching numbered panels with Operator, then Suppress Raneiks a third time to expose the
    small Servitors for a very short AoE damage window. This is add-heavy boss damage — you damage many
    small targets, not one big one.
  setup: A large room with numbered panels (0-9) in the wall and a station in the center. Raneiks sits
    in a big hole at the top of the room, periodically dropping small explosive Servitor shells. The Operator
    augment appears early (deposit it in the center station for later). Killing a Machine Priest's Assistant
    ('Raneiks defends itself') teleports you to an outside arena behind Raneiks where the Suppressor (blue)
    augment appears on a Tracer Shank.
  plain_language_steps:
  - 1. Clear the room of Fallen (Vandals, Dregs, Captains) while avoiding the explosive Servitor shells
    Raneiks drops (shoot them to destroy them). Grab the Operator augment when it appears and deposit
    it in the center station for later.
  - 2. Keep killing until an elite Machine Priest's Assistant appears; focus it down. When it dies ('Raneiks
    defends itself') you teleport to the outside arena.
  - 3. In the outside arena, prioritize the seeking Exploder Shanks, then clear the rest while using cover
    against Raneiks' explosives. When all Shanks die, a Tracer Shank with the Suppressor augment appears
    near Raneiks.
  - 4. Kill the Tracer Shank, grab Suppressor, and from behind cover plant the hologram (feet planted)
    near Raneiks, then shoot it to explode it. You can be further back than you think — getting too close
    lets Raneiks nuke you. Watch for the close-range eye beam and the Integration tether.
  - 5. The blast breaks Raneiks into 10 small numbered Servitors (0-9). Two of them glow slightly brighter
    than the rest. Note their two numbers (write them in chat).
  - 6. Run back through the passageway (or the safer hallway to its left) before the Servitors reconstitute.
    The forcefield strips Suppressor, which you don't need right now.
  - 7. Repeat the whole loop a second time to get two MORE numbers. The second pair must be different
    from the first — you need four unique numbers total.
  - 8. With all four numbers, grab Operator and shoot the four matching numbered panels while the team
    clears adds.
  - 9. With four panels shot, Raneiks comes down to fight you (other enemies vanish) and a Tracer Shank
    with Suppressor spawns in the center. Kill it, grab Suppressor, and use cover (the big glass panels)
    to plant and explode the hologram on Raneiks.
  - 10. Raneiks breaks into the small Servitors, now vulnerable — dump fast AoE damage for the short window
    (about 10-15 seconds) before it reconstitutes and goes immune.
  - 11. Each damage phase resets the panel numbers, so repeated numbers between phases are fine. After
    three or four rounds Raneiks goes down, leaving a reward chest in the center. The very final phase
    takes longer because the Servitors split into more Servitors as they die.
  mechanics:
  - 'Suppressor augment (blue): pick up from a Tracer Shank; hit grenade with feet planted to spawn a
    blue hologram, then shoot it (you, teammates, enemies, or a timer can trigger it) for a radius explosion.
    Catching Raneiks in it causes its cohesion to fail and it splits into smaller Servitors.'
  - Raneiks is composed of ~10 small Servitors. When suppressed and split, two glow slightly brighter
    than the rest; read their numbers (0-9). The glow is very subtle — wrong Servitors firing Void attacks
    can look like they're glowing.
  - You must read two phases (four total unique numbers) before the damage phase; second-round numbers
    must differ from the first.
  - Operator shoots the four numbered panels matching the four glowing-Servitor numbers to set up the
    damage phase.
  - During damage, suppress Raneiks one more time to expose the small Servitors; they are then vulnerable
    to AoE. No single Servitor takes enough damage to die individually — you damage the group.
  - 'Raneiks threats: explosive Servitor shells dropped into the room, explosives in the outside arena,
    a close-range eye beam doing massive sustained damage, and the Integration tether that starts a death
    timer.'
  - Machine Priest's Assistant is the elite that, when killed, teleports the team to the outside arena
    ('Raneiks defends itself').
  - Damage window is only about 10-15 seconds; the final phase is longer because dying Servitors split
    into more Servitors.
