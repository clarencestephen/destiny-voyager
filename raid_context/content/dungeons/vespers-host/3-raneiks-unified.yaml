    burst_windows: Very short damage phase — about 10-15 seconds after suppressing the split Raneiks.
      The final phase runs longer because the dying Servitors split into more Servitors.
    recommended_dps:
    - Heavy grenade launchers / explosive weapons — AoE to hit multiple Servitors at once; accuracy doesn't
      matter, dump damage fast
    - Hunter Supers that hit several enemies at once — Storm and Squall named
    - Thundercrash — named as high, fast burst damage
    - Nova Bomb — named for fast AoE damage
    - Parasite (Exotic grenade launcher) — named for fast high damage
    - Powerful swords — swings hit multiple Servitors and you don't need to target a specific one
    - Avoid precision/single-target weapons and anything with a long reload (reloading wastes the short
      window)
