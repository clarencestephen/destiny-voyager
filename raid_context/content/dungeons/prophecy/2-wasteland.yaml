  learner_path:
  - Just play.
  plain_language_steps:
  - 1. This is a sparrow transition section across a wasteland built from fragments of Io, Titan, Mercury,
    and Mars; summon your sparrow.
  - 2. Find the first Blight cluster (a group of distinct dark orbs sitting in a flat area), guarded by
    Taken.
  - 3. Group up and burst all the Blights in the cluster; clearing the whole cluster spawns a Taken probe.
  - 4. The probe dashes toward the next cluster; follow it on your sparrow.
  - 5. Watch for patrolling Ultra Taken Minotaurs; they are huge and easy to see, so just ride past them
    and do not engage.
  - 6. Destroy the second Blight cluster the same way and follow the new probe.
  - 7. Destroy the third Blight cluster to trigger 'The Way is Open' and unlock the next area.
  - 8. Regroup at the opened path and continue into the Hexahedron.
