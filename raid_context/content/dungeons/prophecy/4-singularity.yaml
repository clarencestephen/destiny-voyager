  - 1. This is a sparrow race down a long fabric/cloth road through a starry void toward a massive octahedron;
    summon your sparrow.
  - 2. Keep moving forward and ride fast; do not stop to fight enemies.
  - 3. Strafe to dodge incoming fire from Taken Vandals and Ravenous Knights positioned on platforms along
