  - 4. Watch for crossing roads and twisting sections; pick the correct path and stay on the surface.
  - 5. Do not fall off the road; a fall is a long-drop death that resets the section.
  - 6. Ride all the way to the octahedron at the end of the road, which pulls you into the next chamber
    (Kell Echo).
