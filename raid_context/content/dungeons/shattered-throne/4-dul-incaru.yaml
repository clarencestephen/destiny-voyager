    champions: []
    recommended_defensive_mods:
      elemental:
      - Void Resist helps against Psion blasts, Knight fire, and Dûl Incaru's Void damage on Master-tier
        difficulty
      concussive:
      - No mandatory Concussive Dampener use; the chamber is enclosed with low ledge-death risk
  damage:
    surges:
    - DPS phase opens after picking up all 3 Darkblade orbs; Dûl Incaru is a Hive Wizard with no fixed
      elemental shield, so no specific surge element is required (bring your strongest single-target burst)
    burst_windows: One ~45-second damage window after grabbing all 3 orbs (3 stacks = max multiplier);
      dump coordinated Supers into her face for a potential one-shot.
    recommended_dps:
    - Single-target Super setups (Golden Gun with Celestial Nighthawk plus Star-Eater Scales, or Thundercrash
      with Cuirass of the Falling Star) for a one-shot
    - High single-target heavies (Sword such as Lament, or Whisper/Sleeper-type Linear Fusion) for solo
      or backup DPS
