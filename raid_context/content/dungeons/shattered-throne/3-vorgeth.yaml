    hidden_chest: ''
  learner_path:
  - '1st: wizard_killer (no Mark management to learn).'
  - '2nd: runner.'
  - 'Quest run: do separately from a clear run.'
  plain_language_steps:
  - 1. Place the rally banner and walk into the round arena. Vorgeth, the Boundless Hunger (a Taken Ogre)
    sits in the center, immune. The four Keeper of Petitions Wizards in perimeter alcoves engage immediately.
  - 2. Locate the central deposit pillars near Vorgeth and the purple cleanse pedestal at the room edge
    before you start; know where both are.
  - 3. Kill a Keeper of Petitions Wizard; an orb drops at its feet.
  - 4. Have your runner pick up the orb. Each orb gives Petitioner's Mark, a 45-second timer that stacks
    up to three times.
  - 5. Call your stack count out loud. Picking up a FOURTH orb gives Petitioner's Burden, whose timer
    counts down to death if it hits zero.
  - 6. Deposit your stacks at the central pillars to clear the Mark/Burden and advance. If your Burden
    timer goes red, step on the cleanse pedestal.
  - 7. Repeat until all four Wizard orbs have been deposited. Watch for Vorgeth's eye blast and shoot
    down the Axion Dart swarms so they do not cluster on you.
  - 8. Once all four orbs are deposited, Vorgeth becomes vulnerable and a DPS window opens (Axion Darts
    intensify).
  - 9. Stack up at center, drop a Well or Bubble, and burst Vorgeth while shooting incoming Axion Darts.
  - 10. If he survives, the Wizards respawn and you repeat the cycle.
  - '11. Optional Wish-Ender quest: do NOT kill Vorgeth first. Cleanse the Vorgeth sigil to spawn Fleeting
    Shade, drop an orb at the marked statue to spawn Xavoth, and defeat Xavoth before killing Vorgeth,
    or the quest is voided.'
  defense:
    incoming_damage:
      adds:
      - Keeper of Petitions Wizards deal Void/Arc caster bolts and poison clouds
      - Axion Darts deal Void tracking-projectile cluster damage
      boss:
      - Vorgeth (Taken Ogre) deals a Void eye-blast beam
    champions: []
    recommended_defensive_mods:
      elemental:
      - Void Resist helps against Vorgeth's eye blast and Wizard/Axion Dart Void damage on Master-tier
        difficulty
      concussive:
      - No mandatory Concussive Dampener use; arena is enclosed with low ledge-death risk, though it can
        soften Vorgeth's blast pressure if desired
  damage:
    surges:
    - DPS phase opens once all 4 Wizard orbs are deposited; Vorgeth is a Taken Ogre with no fixed elemental
      shield, so no specific surge element is required (bring your strongest burst)
    burst_windows: One ~limited damage window after depositing all 4 orbs; stack center under a Well or
      Bubble and burst while shooting down Axion Darts.
    recommended_dps:
    - Burst heavy such as rocket launchers, Linear Fusion Rifles, or a Sword for an Ogre-sized target
    - Super damage stacked during the window (Well of Radiance for a stationary platform)
