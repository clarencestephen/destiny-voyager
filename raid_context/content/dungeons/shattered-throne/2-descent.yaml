  - role_id: follow
    subclass: Any subclass with good mobility for catwalk crossings
    weapons: Add-clear primary plus a sniper to help with remaining Ogres and Hobgoblins
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: No surge mods needed (no DPS phase); prioritize mobility and resilience mods
  - role_id: solo
    subclass: Sustain subclass (Void for Devour or Solar for Restoration) to survive the barrier and Ogres
      alone
    weapons: Sniper rifle held for Ogres from cover, plus an add-clear primary
    exotic_armor: ''
    armor_stats:
    - Health
    - Class
    surges_mods: No surge mods needed (no DPS phase); run survivability, mobility, and ammo mods
