  learner_path:
  - '1st: deepsight_caller (no diving stress).'
  - '2nd: diver.'
  - 'Solo: only after 3-player clear.'
  plain_language_steps:
  - 1. Place your rally banner at the underwater entry. Note the three Thrall statues (left/middle/right)
    and the oxygen bubble pockets along the route. Do not touch the Acolytes yet — engaging them starts
    the encounter.
  - 2. Engage the Acolytes to begin. Clear the ambient Hive and the spawned Keeper of the Deep (an Ogre-class
    enemy). When the Keeper dies it drops a Deepsight illusion.
  - 3. Use Deepsight at the entry wall. It reveals three symbols. Call all three symbols out loud.
  - 4. Dive underwater and find the Hive runes that match those three symbols. Activate the three matching
    runes in any order. Activating a WRONG underwater rune kills you instantly.
  - 5. Watch your oxygen/pressure gauge while diving. Oxygen bubbles are SHARED — one teammate hitting
    a bubble refreshes all three of you. Ecthar's underwater attacks drain pressure fast, so surface or
    refresh before it empties.
  - 6. Once all three correct runes are active, three Lightbearer Wizards spawn above water. Kill each
    Wizard and CRUSH its Ghost. That gives three Vestiges, one per player.
  - 7. Deposit each Vestige at one of the three statues. Here any statue is valid until it is charged,
    so call which statue (Left/Middle/Right) you are taking to avoid doubling up.
  - 8. With all three statues charged, Ecthar arrives along with a Wellkeeper Knight.
  - 9. Kill the Wellkeeper immediately. It drops a Piercing Light well on the ground.
  - 10. Everyone stand in the Piercing Light well to break Ecthar's Void shield, opening roughly a 15-20
    second damage window.
  - 11. Burst Ecthar during that window. If he survives, he re-shields and the whole cycle repeats.
  defense:
    incoming_damage:
      adds:
      - Solar damage from Acolyte projectiles
      - Arc damage from Lucent Hive Knights and Wellkeeper Knight melee/boomer
      - Solar/Arc eye blast from the Keeper of the Deep (Ogre-class)
      - Lightbearer Wizard poison/Arc bolts above water
      boss:
      - 'Void (Ecthar wields a Void shield and Void-aligned Hive Knight attacks: cleaver swings and ranged
        boomer/blast)'
    champions: []
    recommended_defensive_mods:
      elemental:
      - No Champion or elemental burn modifiers (no Master version).
      - Ecthar deals heavy Void/melee damage — prioritize the Health stat and keep a class-ability heal
        or overshield up; Void resist is the most relevant if running resist mods.
      concussive:
      - Concussive Dampener is useful against Ecthar's heavy melee/blast and the Keeper of the Deep's
        eye blast during the shield-break stack.
  damage:
    surges:
    - DPS phase is against Ecthar after his shield breaks. No forced element — match your strongest burst
      weapon. Ecthar's own shield is Void, so a Void-shield-matching trace/special can speed the break,
      but the actual shield break comes from standing in the Piercing Light well, not from a matched surge.
    - Solar
    burst_windows: 'One ~15-20s window per cycle: kill the Wellkeeper, stack in the Piercing Light well
      to drop the shield, then unload before Ecthar re-shields.'
    recommended_dps:
    - 'Heavy burst: Linear Fusion Rifle, Sleeper Simulant, or Whisper of the Worm (from a Well)'
    - Witherhoard for chip and sustain pressure between windows
    - Well of Radiance or a damage-boost super to maximize the short window
    - Lord of Wolves
    - Thunderlord
    - Winterbite
    - Thundercrash
    - Tractor Cannon
