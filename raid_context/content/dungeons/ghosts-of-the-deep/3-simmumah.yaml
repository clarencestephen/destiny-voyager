  plain_language_steps:
  - 1. Place your rally banner at the cove entry. Oryx's half-buried corpse dominates the arena and Šimmumah
    ur-Nokru floats above it. Crush the unclaimed Ghost above Oryx to begin.
  - 2. Vorlog (a Risen Hive enemy that respawns when killed) and ambient Lucent Hive spawn. Clear ambient
    Hive until a Deepsight illusion appears mid-arena.
  - 3. Use Deepsight. It reveals three orbs above Oryx's body parts (head, left/right hand, left/right
    foot). Call out which orb positions appeared.
  - 4. Pick an orb to work. Kill Vorlog while STANDING UNDER that chosen orb position — this lures Šimmumah
    down to that body part. Killing Vorlog away from an orb is wasted.
  - 5. When Šimmumah lands, a ring and a symbol appear. Move around on the ground until your viewing angle
    makes the ring overlap the symbol — that alignment reveals a rune above the body part.
  - 6. Read the revealed rune, then go to the matching methane pocket (a concealed room) and fight the
    Lightbearer Hive inside (a Knight, Acolyte, or Wizard).
  - 7. Kill that Lightbearer and CRUSH its Ghost to get a Vestige carrying that rune.
  - 8. Carry the Vestige back and deposit it at the matching Deepsight-revealed orb. Depositing at the
    WRONG orb kills you instantly, so confirm first.
  - 9. Repeat the lure-align-pocket-crush-deposit cycle for the other two orbs (three orbs total). Pre-assigning
    one body-part orb per player keeps it organized.
  - 10. Once all three orbs are deposited, Šimmumah's shield drops, opening roughly a 20-25 second damage
    window.
  - 11. Stack mid-arena under a Well or Bubble and burst Šimmumah. Do not waste the first seconds reloading.
    If she survives, she re-shields and the cycle repeats.
  defense:
    incoming_damage:
      adds:
      - Arc damage from Lucent Hive Knights (melee and boomer)
      - Solar damage from Acolyte projectiles in the methane pockets
      - Hive Wizard poison/Arc bolts
      - Vorlog (Risen) rapid melee/ranged attacks, dangerous to stationary aligners
      boss:
      - Šimmumah's Necrocharger explosions (close-range burst)
      - Hive Wizard ranged bolts (poison/Arc-aligned)
    champions: []
    recommended_defensive_mods:
      elemental:
      - No Champion or burn modifiers (no Master version).
      - Mixed Arc/Solar/Wizard-bolt incoming plus Šimmumah's Necrocharger blasts — prioritize the Health
        stat and keep a heal/overshield up; no single resist element dominates.
      concussive:
      - Concussive Dampener helps survive Šimmumah's Necrocharger explosions at close range and Hive boomer
        splash while aligning.
  damage:
    surges:
    - DPS phase is against Šimmumah (a Hive Wizard) after the third deposit. No forced damage type — match
      your strongest burst. Her shield drops from the mechanic, not from a matched-element break, so pick
      the highest-damage option.
    - Arc
    burst_windows: 'One ~20-25s window per cycle: after the third orb deposit, stack mid under Well/Bubble
      and unload immediately before she re-shields.'
    recommended_dps:
    - 'Heavy burst: Whisper of the Worm, Sleeper Simulant, or a Linear Fusion Rifle from a Well of Radiance'
    - A damage-boost super or Bubble (Ward of Dawn + Weapons of Light) to amplify the short window
    - Witherhoard for pre-stacked chip before the window opens
    - Queenbreaker
    - Thunderlord
    - Golden Gun (Celestial Nighthawk)
    - Thundercrash
    - Divinity
