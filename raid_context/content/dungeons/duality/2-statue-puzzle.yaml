  cheese: []
  common_mistakes:
  - Pressing a switch on the already-correct statue = misaligns it. Confirm before pressing.
  rewards:
    guaranteed: []
    hidden_chest:
      location: 'HIDDEN CHEST 1: After statue puzzle resolved, look for a slightly

        ajar door in the Waking realm (alcove off the main puzzle room).

        Walk in. Chest contains a random roll of an already-collected

        dungeon item.

        '
      rewards:
      - Random roll of any dungeon weapon already obtained
    potential_drops: []
  images:
    overview: ''
    hidden_chest: ''
  learner_path:
  - Just play.
  plain_language_steps:
  - 1. Enter the wide circular room with the central bell and four gladiator statues, each facing a different
    direction.
  - 2. Note that one statue is already correctly aligned and points to the center — do not touch that
    one.
  - 3. Shoot the central bell to shift into the Nightmare realm. The switches at the base of each statue
    glow and become usable only in the Nightmare.
  - 4. Press a switch to rotate its statue 90 degrees. Each press is one quarter-turn.
  - 5. Shift back to the Waking realm (stay inside the bell circle on the shift) and check which statues
    now point to the center.
  - '6. Repeat: shift to Nightmare, turn the statues that are still wrong, shift back, and verify in the
    Waking realm after each set of turns. Rotation counts vary per attempt, so always confirm.'
  - 7. When all four statues face the center, the bell area unlocks in the Waking realm and the next door
    opens.
  - '8. Before moving on, grab Hidden Chest 1: look for a slightly ajar door in an alcove off the main
    puzzle room in the Waking realm and walk in.'
