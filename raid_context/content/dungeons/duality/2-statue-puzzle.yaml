encounter:
  order: 2
  slug: statue-puzzle
  name: Statue Puzzle (4 gladiator statues)
  difficulty: easy
  estimated_time: 5-10 min
  abstract: 'Mid-dungeon platforming + puzzle. 4 gladiator statues around a

    central bell. All must point to the middle to unlock the next door.

    Use switches at the base of each (visible only in Nightmare) to

    rotate 90° each press. Hidden chest 1 is here.

    '
  setup: "WHAT YOU SEE:\n- Wide circular room with central bell.\n- 4 gladiator statues facing different\
    \ directions.\n- One statue already correctly aligned (facing center).\n- Switches at the base of\
    \ statues (Nightmare-visible only).\n\nPLATFORM MECHANICS:\n- Shift Nightmare → switches glow.\n-\
    \ Press switch = statue rotates 90°. Each statue needs:\n  • 1 statue: already correct (0 turns)\n\
    \  • 2 statues: 2 turns each\n  • 1 statue: 3 turns\n  (exact rotation count varies per attempt —\
    \ verify in Waking after each turn)\n- Once all 4 facing center → bell area unlocks in Waking.\n"
  callouts:
  - when: Statue alignment confirmed in Waking
    from: checker
    to: team
    say: '"Statue [N/S/E/W] correct."'
    why: Tracks alignment progress.
