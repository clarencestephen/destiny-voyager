  meta_loadout:
  - 'Titan (general build): Sentinel with Ward of Dawn super (void chosen over a high-damage super for
    ad-clear; Thundercrash + Cuirass of the Falling Star is the alternative if you want pure damage).'
  - 'Titan abilities: Scatter grenade (vortex got unintentionally nerfed), Controlled Demolition aspect
    (ad-clear + healing), Bastion aspect; fragments Echo of Undermining (grenades apply Weaken), Echo
    of Leeching (health regen), Echo of Instability (volatile rounds after a grenade kill).'
  - 'Titan exotic armor: Heart of Inmost Light (run roughly 100 Health to keep class ability up constantly).'
  - 'Titan/general weapons: Fallen Guillotine sword (Relentless Strikes + Whirlwind Blade) as main boss
    DPS, paired with Font of Might (+25% sword damage from a void elemental well); Funnel Web SMG (Subsistence
    + Adrenaline Junkie, benefits from volatile rounds); Wither Hoard grenade launcher for ad-clear and
    background DoT during sword DPS.'
  - 'Sunbreaker alternative (Titan): Sol Invictus for constant sunspots plus throwing hammers; run the
    Lament sword (solar) with Font of Might if on this subclass.'
  - 'Hunter (damage route): Blade Barrage Gunslinger with Knock ''Em Down aspect plus Star-Eater Scales
    (orb pickups escalate super damage); if all three are Hunters this can nearly instantly burst the
    boss.'
  - 'Hunter (survivable route): Void Nightstalker with Moebius Quiver super (huge damage + Weaken debuff);
    combine with Orpheus Rig for an extra tether shot. Same sword/SMG/grenade-launcher weapons as the
    Titan.'
  - 'Warlock: Void with Cataclysm super (powerful debuff void grenades) plus Child of the Old Gods and
    a weakening grenade to keep a debuff up across each part of the phase; OR Dawnblade with Well of Radiance
    (active for one third of the boss fight).'
  - 'Recommended mods: Lucent Blade (sword damage boost while Charged with Light) plus an Elemental Charge
    mod to become Charged with Light.'
