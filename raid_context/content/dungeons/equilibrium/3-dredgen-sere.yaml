  learner_path:
  - '1st: compeller. Watch tier-build pacing.'
  - '2nd: dps_anchor + Heirloom-quest progress.'
  - 'Solo: only after multi-player Heirloom acquisition.'
  plain_language_steps:
  - 1. Place the rally banner outside the arena, then walk in to start. A 45-second 'Lure of the Dark'
    timer begins immediately, so be ready to move fast.
  - 2. During those 45 seconds, all three players collect Darkness wells to build the Gathering Shadow
    resource all the way to Shadow Master (the third tier). You need Master to Compel later.
  - 3. While building, also kill the Nameless Apprentices that spawn — killing them is what later enables
    destroying the Taken orbs in the normal arena.
  - '4. When the timer expires, the team is pulled into the Ascendant version of the arena. Spread out:
    there are five Blistered Shadows (Sere clones) to find.'
  - 5. With Shadow Master active, use the Renegade ability to Compel each Blistered Shadow. Each Compel
    grants +1 'Lure of the Dark' stack and permits destroying one matching Taken orb back in the normal
    arena. Don't waste the Renegade ability on adds here.
  - 6. One Blistered Shadow is elevated. Have a player hit the Darkness-corrupted device to spawn ghost
    platforms so someone can reach it — don't forget this one, it counts toward the five.
  - 7. Once all five are Compelled (five stacks), exit the Ascendant back to the normal arena.
  - 8. In the normal arena, finish off any remaining Nameless Apprentices, then destroy all five Taken
    orbs hovering in the center.
  - 9. With the orbs gone and Compels done, Sere's shield drops and the DPS phase opens. Stack up and
    burst him down, dumping Supers.
  - 10. If Sere uses his lightning hand attack during DPS, shoot his hands to stop the lightning and briefly
    stun him.
  - 11. When DPS ends, Arc energy floods the center of the arena. SPRINT to the edges immediately or you'll
    be melted.
  - '12. If Sere survives, the cycle repeats: build to Master, get pulled into the Ascendant, Compel,
    destroy orbs, DPS, evade — until he''s dead.'
