  name: Dredgen Sere (final boss)
  difficulty: hard
  estimated_time: 30-45 min
  abstract: 'Final boss. First HUMAN boss in any D2 dungeon. 45s Lure of the

    Dark setup → pulled into Ascendant realm → Compel 5 Blistered

    Shadows with Shadow Master → return to normal arena → destroy 5

    Taken orbs → DPS. End-of-DPS hazard: Arc fills the center, sprint

    to edges.

    '
  setup: "WHAT YOU SEE:\n- Throne-world arena with Sere center.\n- 5 Taken orbs hovering in arena center.\n\
    - Taken wells (Darkness pools) scattered for Shadow building.\n- Nameless Apprentices spawn throughout.\n\
    - Lure of the Dark timer at top of screen (45s).\n- Ascendant version of arena (when pulled): same\
    \ shape, hostile Taken.\n  - 5 Blistered Shadows (Sere clones) in the Ascendant realm.\n  - 1 Blistered\
    \ Shadow elevated; requires Darkness-corrupted device → ghost platforms.\n\nPLATFORM MECHANICS:\n\
    - Lure of the Dark timer starts immediately. 45s window:\n  • Collect Darkness wells → build to SHADOW\
    \ MASTER (3-tier progression)\n  • Kill Nameless Apprentices (enables Taken orb destruction later)\n\
    - Timer expires → pulled into Ascendant.\n- In Ascendant: find all 5 Blistered Shadows. Compel each\
    \ with Renegade ability + Shadow Master.\n- Each Compel = +1 Lure of the Dark stack + permits 1 Taken\
    \ orb destruction back in normal arena.\n- Elevated Shadow: hit the Darkness-corrupted device to spawn\
    \ ghost platforms → access.\n- Exit Ascendant with 5 Lure of the Dark stacks.\n- Normal arena: finish\
    \ remaining Apprentices. Destroy all 5 Taken orbs.\n- DPS phase opens.\n- During DPS: if Sere uses\
    \ lightning hand attack, SHOOT his hands to stun briefly.\n- DPS ends: Arc energy fills the center.\
    \ SPRINT to edges immediately or melt.\n- Cycle repeats: hunt → Ascendant → Compel → orbs → DPS →\
    \ evade → repeat.\n\nSTART STATE: rally banner outside arena. Walk in to start. 45s timer begins immediately.\n"
  callouts:
  - when: Lure of the Dark timer started
    from: all
    to: team
    say: '"45 — building Master."'
    why: Setup phase clarity.
  - when: Shadow tier reached
