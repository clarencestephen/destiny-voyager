        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: Ability-regen and resist mods to maintain add-clear; element-agnostic surges.
  cheese: []
  common_mistakes:
  - Killing Apprentice with gunfire instead of array-baiting — array stays up, barrier locked.
  - Wasting Renegade ability on trash adds — save for shielded enemies / panels.
  rewards:
    guaranteed:
    - 1× dungeon armor or weapon
    hidden_chest: null
    potential_drops:
    - Zealous Ideal (auto rifle, Solar)
    - Voltaic Shade (scout rifle, Arc)
    - Equilibrium / Sage Protector armor — Legs + Arms + Chest
  images:
    overview: ''
    setup: ''
    callouts: ''
  learner_path:
  - '1st: shadow_clear (lowest cognitive load).'
  - '2nd: baiter.'
  plain_language_steps:
  - 1. Place the rally banner near the arena entry, then fight through the open Praxic Temple grounds,
    clearing the Renegade Cabal patrols. Watch the marked drop pod landing zones — standing in one when
    a pod lands is an instant kill.
  - 2. Pass through the waterfall and tunnel transition, then walk up to the Harvester ship in the center
    of the arena and interact with it to begin the encounter.
  - 3. As the fight starts, all three players step into the Taken wells (the Darkness pools on the ground)
    to build the Gathering Shadow resource. Keep stacking until you reach Shadow Novice — a 45-second
    timer appears.
  - 4. Find the red Nameless Apprentices wandering the arena. Do NOT shoot them down — instead lead (bait)
    one toward an Arc array at a side position so it charges and detonates ON the array.
  - 5. The moment the Apprentice explodes on the array, activate that array. A correct activation destroys
    the array and opens the red barrier door blocking progress.
  - 6. Repeat the bait-and-activate cycle for the other arrays. Six Apprentices spawn over the fight,
    which works out to roughly three array activations.
  - 7. When you reach Shadow Novice, press the Renegade ability to deploy your Shadow form (about 15 seconds).
    Use it to break enemy shields rather than wasting it on basic trash.
  - 8. Use the sparrows in the side rooms to farm Taken wells quickly if your Shadow meter runs low.
  - 9. Once the barriers are open, defeat the Behemoth Walkers (the large Cabal mech enemies). Burst them
    down and avoid being point-blank when they explode.
  - 10. With all Behemoth Walkers down, the phase ends. Interact with the ship again to board it and advance
    to the next area.
  defense:
    incoming_damage:
      adds:
      - Renegade Cabal small-arms (Solar/kinetic slug fire) from patrols and ambient adds
      - Behemoth Walker (Cabal mech) heavy fire and a lethal point-blank explosion on death
      - Nameless Apprentice detonation — chained damage if it explodes near you instead of on an array
      - Cabal drop pods — instant-kill on landing in the marked zone
      boss: []
    champions: []
    recommended_defensive_mods:
      elemental:
      - No boss attack element to resist here; general damage reduction (Resist mods / class DR) helps
        against dense Renegade Cabal and Behemoth Walker fire
      - 'Chest: Solar Resistance + Void Resistance (per Boosting-Ground''s first-encounter chest setup)
        against Renegade Cabal small-arms and Goliath/Behemoth Walker fire'
      - Arc surge optional only as flavor for the Arc-array/fuse theme; not required for defense
      concussive:
      - Concussive Dampener is reasonable to soften Behemoth Walker explosions and grouped Cabal AoE,
        though no source-confirmed concussive threat is called out for this encounter
      - Concussive Dampener on chest to soften Goliath/Behemoth Walker missile barrage and point-blank
        death explosion, plus grouped Cabal drop-pod/AoE
  damage:
    surges:
    - No dedicated boss DPS phase. Damage is spent bursting Behemoth Walkers; any surge works. Their associated
      Arc array/fuse theme means Arc weapons are convenient but not required.
    - No dedicated boss DPS phase; any surge works. Warlock boots run Double Kinetic Weapon Surge (~17%)
      for Praxic Blade; Hunter runs Double Kinetic Weapon Surge + Kinetic Scavenger this encounter.
    burst_windows: Short add-burst windows on each Behemoth Walker as barriers open — no extended damage
      gate.
    recommended_dps:
    - High-uptime primary or special for add-clear
    - Burst special weapon (shotgun / fusion) for fast Behemoth Walker kills
    - Any reliable kinetic/energy primary for Nameless Apprentice baiting and trash
    - High-uptime primary plus a burst special for fast Goliath/Behemoth Walker kills
    - Microcosm (Exotic Trace Rifle) with Kinetic Synthesis artifact perk for safe infinite-ammo ranged
      damage on Walkers (Hunter)
    - Titan Super (Hammer of Sol / Throwing Hammer at high Wormgod stacks one-shots Walkers); Warlock
      Song of Flame for near-invincible chip; Hunter Shadowshot Deadfall weaken + Threaded Spike sever
      on Walkers
    - Mida Retrograde or any solid primary for Nameless Apprentice baiting
