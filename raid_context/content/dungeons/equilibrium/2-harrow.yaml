          or Eager Edge sword for quick outer-room rotation between Taken wells and panels.
        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: Ability-regen and Arc resist; burst-DPS surge for shield-down.
  cheese: []
  common_mistakes:
  - Sprinting through center mid-build = insta-death.
  - Renegade-meleeing too late on Harrow's rise — narrow window.
  - Wasting Apprentice tier on standard add-clear — save for panels.
  rewards:
