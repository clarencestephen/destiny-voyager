    overview: ''
    setup: ''
    callouts: ''
    damage_phase: ''
    hidden_chest: ''
  learner_path:
  - '1st: shadow_runner. Watch baiter routes.'
  - '2nd: baiter.'
  plain_language_steps:
  - 1. Coming out of the post-Harvester traversal, shoot the fuse above the door, then drop through the
    hatch into Harrow's arena. You'll see four U-shaped outer rooms wrapped around a central area, with
    Harrow (a large Renegade Cabal) in the middle.
  - 2. The center is an instant-kill zone controlled by Harrow. During the build phase, only rotate through
    the OUTER rooms — never cross the middle.
  - 3. Step into the Taken wells to build Gathering Shadow, this time pushing one tier higher than the
    opener — up to Shadow Apprentice.
  - 4. In each outer room, find the glowing Taken panel on a wall or ceiling. With Shadow Apprentice active,
    press the Renegade ability at the panel to activate it. Save the Apprentice tier for panels, not for
    trash add-clear.
  - 5. Keep activating panels in sequence (call out each one as it's done) while a teammate suppresses
    the ambient Renegade Cabal, until the 'Emergency subsystems activate' text appears on screen.
  - '6. When that text shows, switch to the center phase: two Arc fuses become visible at the sides of
    the central arena. Shoot both fuses to open two holes in the floor.'
  - 7. Bait Harrow into a hole. Each hole-trip strips one-third of his shield. To speed it up, use your
    Taken (Renegade) melee the instant Harrow jumps back up out of a hole.
  - 8. Repeat for three hole-baits total — or use two holes plus destroying the Arc generator on the far
    left — to fully strip Harrow's shield.
  - 9. With the shield down, stack up and burst Harrow during the DPS window.
  - 10. For his Final Stand, follow Harrow through the destroyed gate, clear the Cabal Centurions and
    turrets, then finish him off. Avoid his charge explosion — never take it without cover.
  defense:
    incoming_damage:
      adds:
      - Renegade Cabal Centurions (small-arms / slug fire) and emplaced turrets during Final Stand
      - Arc damage from the central fuses/holes mechanic and the Arc generator area
      boss:
      - Arc (Harrow's central insta-kill field and Arc-fuse mechanic)
      - Harrow charge explosion (heavy AoE; treat as a one-shot without cover)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Arc resistance is the most relevant given Harrow's center field, Arc fuses, and the Arc generator;
        the insta-kill center is not survivable by resist, so positioning matters more than any mod
      - 'Chest: Double Void Resistance for this encounter (per all three class chest setups in Boosting-Ground),
        against Harrow''s blades and Renegade Cabal'
      - Arc Resistance is also relevant given the central Arc-fuse/hole mechanic and Arc generator area;
        the insta-kill center is positional, not resistable
      concussive:
      - Concussive Dampener helps against Harrow's charge explosion and grouped Centurion/turret fire
        during Final Stand
      - Melee Damage Resistance on chest (Harrow is a dual-blade melee Gladiator; his swings and Centurion
        melees can one-shot)
      - Concussive Dampener helps against Harrow's charge/teleport explosion and grouped Scorpius-turret/Centurion
        fire during Final Stand
  damage:
    surges:
    - Harrow has a real DPS phase once his shield is fully stripped. Element is not source-confirmed,
      so use your highest-uptime burst; Arc surge is a sensible default given the encounter's Arc theme.
    - Harrow has a real ~30s DPS window after his shield is fully stripped; element not source-confirmed,
      so use highest-uptime burst (Arc surge is a sensible default given the Arc-fuse theme). Warlock/Hunter
      run Double Solar Weapon Surge + Solar Scavenger on boots for encounters 2-3.
    burst_windows: Short, repeated DPS window after each full shield-strip (3 hole-baits, or 2 holes plus
      the Arc generator), then a Final Stand finish through the gate.
    recommended_dps:
    - Burst-DPS special/heavy for the short window (Linear Fusion Rifles, Rocket Launchers)
    - Roaming or burst Supers to dump on shield-down (e.g., Thundercrash, Golden Gun, Needlestorm)
    - Sword or shotgun for safe close-range damage when positioned with cover
    - Praxic Blade (Exotic Sword) combos in Song of Flame (Warlock)
    - Wolfsbane (Exotic Axe) with Attrition Orbs catalyst, Nano-Assault Light-Light-Heavy combo (Hunter)
    - Tractor Cannon debuff + Throwing Hammer spam, or Thundercrash (Titan)
    - Parasite, Legend of Acrius, or any high-burst special/heavy (Linear Fusion / Rocket) per Grindout
    - Roaming/burst Supers dumped on shield-down (Thundercrash, Golden Gun, Needlestorm)
