    - 1× dungeon armor or weapon
    hidden_chest:
      location: 'SECRET CHEST 1: Post-Harvester traversal (between encounters 1

        and 2). After clearing the middle room with the Arc-fuse puzzle,

        look toward the back-right side of the room. Chest is on a

        platform near the back, on the right.

        '
      rewards:
      - Random roll of already-obtained dungeon weapon
    potential_drops:
    - Bitter End (machine gun, Arc)
    - Voltaic Shade (scout rifle, Arc)
    - Conspiracy Honed (sniper rifle, Stasis)
    - Equilibrium / Sage Protector armor — Class Item + Arms + Helmet
