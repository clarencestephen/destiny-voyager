  meta_loadout:
  - 'Warlock (Prismatic, Getaway Artist): Song of Flame for the DPS window (heavy damage resistance makes
    Harrow nearly harmless); eat Storm grenade for Arc Soul before Harrow exits the floor trap, then swap
    to regular grenade (Z); pop Transcendence, Arcane Needle + Void grenade for Weaken, then Praxic Blade
    Light-Light-Light-Heavy combo. Exotic: Getaway Artist (Wolfsbane swap viable here).'
  - 'Hunter (Prismatic, Fortune''s Favor): Shadowshot Deadfall; on DPS pull Wolfsbane (Attrition Orbs
    catalyst), hold-reload for Nano-Assault, Light-Light-Heavy combo (with Swordstorm Combo artifact perk);
    orbs refresh overshield via Facet of Purpose for the Fortune''s Favor +15% loop. Stylish Executioner
    invis for safe mechanics.'
  - 'Titan (Solar, Wormgod Caress): prime Wormgod to 4-5 stacks + Roaring Flames x3 before DPS; Tractor
    Cannon boop, then rapid Throwing Hammers from a corner to limit knockback; Healing grenade if low.
    Race alt: Prismatic Cuirass + Thundercrash on shield-down.'
  - 'All classes: defeat Harrow''s Decree teleport explosion with Praxic Blade block (most reliable),
    line-of-sight cover, or Shadow Force Pulse interrupt; switches/floor-trap mechanics require Shadow
    Apprentice (tier 2).'
