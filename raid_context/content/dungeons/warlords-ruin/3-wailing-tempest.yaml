  learner_path:
  - '1st clear: cleanser. Most-instructive role — touches every mechanic.'
  - '2nd: carrier — practice pillar pathing without burning unused ones.'
  - '3rd: solo to internalize cold-recovery timing.'
  plain_language_steps:
  - 1. Enter the castle bailey and shoot the central Taken blight to engage the Locus of Wailing Grief,
    the massive Taken Ogre at the far end.
  - 2. Imminent Wish starts and Broken Knights begin spawning at the left and right ends of the arena.
  - 3. Drop the Locus's shield by shooting the Blighted Eyes it summons as fast as possible.
  - 4. Engage the Broken Knights but WAIT for their swing animation (or kill) — the corrupted totem only
    drops when they swing or die, not before.
  - 5. Stand in each dropped totem ~5 seconds to cleanse it (blight vanishes + blue glow = done), calling
    left or right so cleansers do not overlap.
  - 6. Watch your Biting Cold stacks from the snowstorm — at 10 stacks you freeze and die.
  - 7. When your stacks hit ~7, sprint to a lit Shelter From The Storm torch on the BACK wall (away from
    the boss) to clear all stacks in 5 seconds, then return.
  - 8. Pick up Solar Charges that drop in the center of the arena after cleansing and carry each to one
    of the 4 center pillars; hold to ignite it.
  - 9. Call out which pillar you are lighting (N/S/E/W) so two carriers do not race the same one, and
    never step on an unused pillar — it burns for the phase.
  - 10. When the FOURTH pillar is lit, the Locus's shield drops and Naeem's Wish Empowerment grants —
    everyone stack on that last-lit pillar for both Shelter and the buff.
  - 11. Burst the Locus during the window while staying on the pillar to avoid freezing mid-DPS; avoid
    its point-blank melee which one-shots.
  - 12. If you do not finish it, the Locus reshields and the cycle repeats from the eye-pop step.
  defense:
    incoming_damage:
      adds:
      - Solar (Scorn Broken Knights wield fire scepters)
      - Kinetic/physical (Scorn add fire)
      boss:
      - Void (Locus is a Taken Ogre — its eye beam and slam are Void)
      - 'Note: Biting Cold is an environmental freeze (snowstorm), not a weapon element'
    champions: []
    recommended_defensive_mods:
      elemental:
      - Void resist mods help against the Locus Ogre's beam/slam
      - Solar resist helps against the Broken Knights' fire scepters
      - There is no in-game Stasis/freeze resist mod — manage Biting Cold via Shelter torches, not mods
      concussive:
      - Concussive Dampener helps mitigate the Locus Ogre's blast/slam knockback at mid range if you keep
        getting pushed off position
  damage:
    surges:
    - No fixed DPS-phase element is enforced — bring your strongest burst Heavy regardless of element
      and match surge mods to it
    burst_windows: Naeem's Wish Empowerment + Shelter window opens when all 4 pillars are lit and the
      Locus shield drops; stack on the last-lit pillar and burst before it reshields.
    recommended_dps:
    - High-burst Heavy (rocket / Heavy GL / Linear Fusion)
    - Sustained-DPS Heavy (e.g. Sleeper-style Linear) for solo multi-cycle
    - Damage-over-time Special to chip during cold-recovery sprints
    - Tractor Cannon (30% debuff so the rest of the team can destroy the boss; team plan is to run Tractor
      instead of Tether)
    - Rockets with Explosive Light, buffed by Argent Ordnance (charged-with-light setup for ~15% per rocket
      and orbs)
    - Golden Gun via Celestial Nighthawk for a high single-hit boss shot
    - Gathering Storm (Arc tether super) thrown on the boss for jolt pick-damage during team DPS
