  - name: 'Speed: stacked DPS'
    learner_friendly: false
    summary: 'All 3 cleanse simultaneously through 1-2 cycles → ignite all 4

      pillars before Locus reshields → maximum-duration buff → 1-phase.

      '
    best_for: Experienced teams with burst DPS.
    roles:
    - id: cleanser
      count: 3
      does: Each owns 1-2 totems per cycle. Self-manage cold.
      loadout:
        subclass: ''
        weapons: Add-clearing Primary/Special for Broken Knights + burst Heavy for the pillar-down window
        exotic_armor: ''
        armor_stats: *id001
        surges_mods: Surge mods matched to your Heavy element; Void resist for the Locus, Solar resist
          for Broken Knights
  - name: Solo
    learner_friendly: false
    summary: 'Slow + methodical. Cleanse one totem at a time, return to back-wall

      torch between each. Light 1-2 pillars per Imminent Wish window.

      Expect 3-4 cycles to DPS.

      '
    best_for: Soloists.
    roles:
    - id: cleanser
      count: 1
      does: All mechanics yourself. Bring sustained DPS (Whisper, Sleeper).
      notes:
      - Witherhoard for damage-over-time during cold-recovery sprints.
      loadout:
        subclass: ''
        weapons: Add-clearing Primary/Special for Broken Knights + burst Heavy for the pillar-down window
        exotic_armor: ''
        armor_stats: *id001
        surges_mods: Surge mods matched to your Heavy element; Void resist for the Locus, Solar resist
          for Broken Knights
  cheese: []
  common_mistakes:
  - Killing Broken Knights too fast — totem only drops on their swing OR on death. Wait for the swing.
  - Running to find Shelter From The Storm in the FRONT of the arena — torches are all on the back wall.
  - Burning a pillar by accident during the cleanse phase (walking through it on the way to a totem) —
    only step on pillars when you're carrying a charge.
  - Doing DPS away from the lit pillar = no Shelter = freeze mid-DPS.
