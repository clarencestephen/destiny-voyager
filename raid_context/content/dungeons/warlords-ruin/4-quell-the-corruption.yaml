    damage_phase: ''
    hidden_chest: ''
  learner_path:
  - '1st clear: cleanser on Floor 1-2. Don''t volunteer for hex until you''ve seen a cycle.'
  - '2nd: hex_runner — learn drinker spawn pattern.'
  - '3rd: own a Floor 3 platform direction.'
  - 'Solo: only attempt after a 3-player clear; the mechanic load compounds fast solo.'
  plain_language_steps:
  - 1. Enter the mountain summit and shoot the central Taken blight to engage Hefnd's Vengeance, the Blighted
    Chimaera (Taken hydra) hovering in the center.
  - 2. Stay out of its Void Eversion AoE, which activates immediately and pulses around the boss.
  - 3. When Imminent Wish starts, Broken Knights spawn at the left and right ends — locate the 2-3 Corrupted
    Hex-Drinker Wraiths skulking the perimeter on pull.
  - 4. Wait for Broken Knights to swing (or kill them) so they drop totems, then stand in each totem ~5
    seconds to cleanse it (blight gone + blue glow = done).
  - 5. If you get the Hex of Vengeful Corruption (red icon, 15-second timer), call your direction and
    sprint to a Hex-Drinker, then melee it to pass the hex.
  - 6. Never send two hexed players to the same Hex-Drinker — the second person gets re-hexed and can
    die; the drinkers melee the hex back, so do not linger.
  - 7. Once all totems are cleansed and all hexes resolved, Naeem's Wish Empowerment grants — burst the
    Chimaera (aim for 30-50% per phase).
  - 8. Climb the ruins to Floor 2 and repeat the same totem/hex/DPS loop on a smaller, tighter footprint.
  - 9. On Floor 3 (final stand area), stand on an active triangle platform to hold Naeem's Wish, and shoot
    nearby Blighted Eyes to extend its duration.
  - 10. When the Chimaera teleports between platforms, call the new platform (N/S/E) and move onto it
    before your buff drops.
  - 11. At the final stand the team is sent back to Floor 1 with an INFINITE buff — stay close but out
    of the Void Eversion AoE and burn the Chimaera down without panicking.
  - '12. Optional: grab the third Buried Bloodline bone fragment behind a fallen pillar on the right of
    the summit before collecting the Ahamkara bone.'
  defense:
    incoming_damage:
      adds:
      - Solar (Scorn Broken Knights wield fire scepters)
      - Physical/melee (Corrupted Hex-Drinker Wraiths apply/return the Hex via melee; immune to gunfire)
      - Kinetic/physical (Scorn add fire)
      boss:
      - Void (Chimaera's Void Eversion AoE)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Void resist mods help survive the Chimaera's Void Eversion AoE
      - Solar resist helps against the Broken Knights' fire scepters
      - There is no resist mod for the Hex of Vengeful Corruption — it must be passed to a Hex-Drinker
        by melee, not mitigated
      concussive:
      - Concussive Dampener can soften the Chimaera's Void Eversion blast and Broken Knight knockback
        if you are getting pushed near ledges on Floors 2/3
  damage:
    surges:
    - No fixed DPS-phase element is enforced — bring your strongest burst Heavy and match armor surge
      mods to it; final stand gives an infinite buff so sustained options also work
    burst_windows: 'Floors 1-2: Naeem''s Wish opens after all totems are cleansed and all hexes resolved.
      Floor 3: buff held by standing on active platforms (extend with Blighted Eyes). Final stand: infinite
      buff back on Floor 1 — burn to zero.'
    recommended_dps:
    - High-burst Heavy (rocket / Heavy GL / Linear Fusion) for the timed Floor 1-2 windows
    - Sustained-DPS weapon (Linear Fusion / sustained Heavy) for the infinite final-stand window
    - Devour/sustain weapon (this dungeon's exotic sidearm) for solo survivability
    - Tractor Cannon (30% debuff so the rest of the team can destroy the boss; team plan is to run Tractor
      instead of Tether)
    - Rockets with Explosive Light, buffed by Argent Ordnance (charged-with-light setup for ~15% per rocket
      and orbs)
    - Golden Gun via Celestial Nighthawk for a high single-hit boss shot
    - Gathering Storm (Arc tether super) thrown on the boss for jolt pick-damage during team DPS
