  meta_loadout:
  - 'General team (whole-dungeon, source is not encounter-specific): bring two builds per class.'
  - 'Warlock A: Solar Sunbracers, Heat Rises (keep melee for snap-melee / grenade spam, unlimited Restoration,
    easy add-clear); weapons include Sunshot and the hand cannon.'
  - 'Warlock B: Solar Well of Radiance with Phoenix Protocol (chain Wells via Rays of Precision ignitions,
    Combustion fragment, Eruption, Ember of Wonder); use a Solar primary like Sunshot or the hand cannon;
    Mantle of Battle Harmony is an alternative exotic for a x4 (25%) weapon surge while you hold your
    Well; Apotheosis Veil is a swap exotic to spam grenades for ~8s before popping Well.'
  - 'Hunter A: Solar Golden Gun with Celestial Nighthawk for boss DPS (swap exotics before super: Foetracer,
    Athrys''s Embrace, Star-Eaters, Shards of Galanor, or Assassin''s Cowl); Blade Barrage is an option.'
  - 'Hunter B: Arc Gathering Storm (throw the super to jolt the boss for pick damage); also viable as
    an Arc melee punch build with Assassin''s Cowl / Liar''s Handshake / Star-Eaters; clyde plans to run
    Hunter the whole dungeon for damage.'
  - 'Titan A: Solar Burning Maul (bonk) with Synthoceps, Worm Gods, or Pyrogale Gauntlets (Pyrogale for
    the burning-maul super throw); one-two-punch combo of Hammer / shotgun / melee with Roaring Flames
    x3; Sunshot dominates add-clear; unlimited Restoration.'
  - 'Titan B: Strand Banner of War with Synthoceps or Worm Gods (one-two-punch, hold Banner of War x4
    ~30s); Flint Striker for radiant off a Solar weapon.'
