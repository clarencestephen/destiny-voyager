    damage_phase: ''
  learner_path:
  - '1st clear: cleanser (3-player team).'
  - '2nd clear: solo Rathil''s mechanic on master rotators to internalize timing.'
  plain_language_steps:
  - 1. Walk into the open ridge arena and shoot Rathil (the large Broken Knight with the fire scepter)
    in the center to start the fight.
  - 2. After his first damage threshold, the Imminent Wish timer fires automatically and the room flashes
    red — get ready, cages are coming.
  - 3. When you are teleported into a spike (gibbet) cage, look UP and OUT to find the 3 Blighted Eyes
    floating around your own cage.
  - 4. Shoot all 3 of YOUR cage's eyes before the cage timer runs out, then drop back down to the arena
    floor.
  - 5. Call out which direction you are going (N/S/E/W) and run to one of the dormant Taken Ether Totems
    on the perimeter.
  - 6. Stand still inside a totem for about 5 seconds to cleanse it — it is done when the central Taken
    blight vanishes and a blue glow appears.
  - 7. Spread out so two people are not cleansing the same totem; each cleanse you complete lengthens
    the upcoming damage window.
  - 8. When the Imminent Wish countdown hits zero with at least one totem cleansed, you receive Naeem's
    Wish Empowerment — listen for the 'DAMAGE' call.
  - 9. Stack mid-arena and burst Rathil with everything you have while the buff is active (its length
    equals number of totems cleansed times ~5s).
  - 10. Stay clear of Rathil's fire AoE on the ground during DPS — pillar position does not matter here,
    but his fire does.
  - 11. When the buff ends, Rathil retreats; survive the Scorn adds and wait for the next Imminent Wish
    cast.
  - 12. Repeat the cage-cleanse-damage loop until Rathil dies.
  defense:
    incoming_damage:
      adds:
      - Solar (Scorn Broken Knights wield fire scepters)
      - Kinetic/physical (Scorn fodder melee and ranged)
      boss:
      - Solar (Rathil's fire scepter AoE)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Solar resist helps against Rathil's fire AoE and Broken Knight scepters
      - Run Solar resistance armor mods if you keep taking chip damage near the boss
      concussive:
      - Concussive Dampener is optional here; it reduces Rathil's fire AoE knock/blast damage if you are
        getting shoved out of position
  damage:
    surges:
    - No fixed DPS-phase element is enforced — bring your best burst weapon regardless of element; match
      armor surge mods to whatever DPS weapon you carry
    burst_windows: Short Naeem's Wish Empowerment window (~15-30s) that opens when Imminent Wish hits
      0 with at least one totem cleansed; its length scales with totems cleansed.
    recommended_dps:
    - High-burst Heavy (rocket / Heavy GL / Linear Fusion)
    - Sniper-archetype Special for precision burst
    - Damage-over-time setup to chip during cleanse phase
