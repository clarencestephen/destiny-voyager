    - DPS phase opens after the fire trap fires and Kerrev's shield drops. No single canon DPS element
      is fixed by the guide, so match your surge mods to your chosen burst weapon. Note Finality's Auger
      (the dungeon's Solar Linear Fusion) excels here, which favors a Solar surge if you run it.
    burst_windows: Roughly a 15-20 second window after the fire trap ignites and the shield drops - pre-position
      and pre-load your heavy to maximize it before Kerrev re-shields.
    recommended_dps:
    - 'Burst heavy: Whisper of the Worm, Sleeper Simulant, or a Linear Fusion Rifle (the guide''s named
      picks for the short window)'
    - Finality's Auger (Solar Linear Fusion) if obtained from this dungeon - called out as ideal here
    - Burst Supers timed to the moment the shield drops
