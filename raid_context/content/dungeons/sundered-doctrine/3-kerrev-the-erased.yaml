  - '1st: tether_breaker. Most action, least mental load.'
  - '2nd: lens_handler.'
  - '3rd: symbol_caller (hardest — must know symbols).'
  plain_language_steps:
  - 1. Drop your rally banner, then approach Kerrev (a Dread Subjugator) in the center of the large vault
    chamber. Strand tethers connecting the pyramid spikes to the pedestals appear immediately.
  - 2. Spot the Strand tethers protecting the pedestals and call out their directions; you cannot lens
    a tethered pedestal until its tether is destroyed.
  - 3. Kill an Unwritten Attendant to gain the Unwritten Empowerment buff (lasts 7 seconds). Call 'EMPOWERED
    - 7 seconds - tethers'.
  - 4. While empowered, sprint to your assigned Strand tether and destroy it. Be ready for the Threadlings
    that counter-attack when a tether breaks.
  - 5. As a team, commit to ONE side of the central dial - either the TRUTH side or the LIE side. Do not
    mix contributions from both sides.
  - '6. Kill a Truthspeaker to reveal a TRUTH-side symbol, and have the caller name it (for example ''TRUTH
    symbol: Worm'').'
  - 7. Kill a Lens Bearer to get a lens, then place it on the pedestal pillar connecting to the side wheel
    that shows your chosen side's target symbol; call 'Lensing [direction] wheel - [Truth/Lie] side'.
  - 8. Shoot the Pyramid switches above center to route the light beam to that wheel, exactly like the
    first encounter. Wrong routing breaks the lenses and spawns a Tormentor.
  - 9. Light enough symbols on your chosen dial side, then interact with the pillar near the dial. Call
    'FIRE TRAP - cover' because the whole room ignites.
  - 10. Immediately take cover from the fire trap AoE - standing in it is lethal.
  - 11. Once the fire trap fires, Kerrev's shield drops, opening roughly a 15-20 second DPS window. Call
    'DPS - Kerrev' and burst the boss.
  - 12. After the window, Kerrev re-shields and the encounter cycles. Repeat until the boss dies; if you
    have found all three Pyramid codes this run, the vault door behind Kerrev opens for the bonus chest.
  defense:
    incoming_damage:
      adds:
      - 'Dread adds: Unwritten Attendants (Strand) - killing them grants Unwritten Empowerment'
      - Threadlings (Strand) released when you break a Kerrev Strand tether - counter-attack swarm
      - Truthspeaker Grim (Hive/Dread) spawning periodically - Arc/Solar ranged pressure
      - Lens Bearer Subjugator (Dread) - close-range Stasis/Strand pressure
      - Tormentor (Dread) spawns on a wrong-routing mistake - heavy melee and suppression
      boss:
      - Strand (Kerrev's pedestal tethers and Subjugator-grade Strand abilities)
      - Solar (the dial fire-trap AoE that ignites the room before the DPS window)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Resist Strand against Kerrev's tethers, Threadling counter-swarms, and Subjugator abilities
      - Resist Solar to survive splash from the fire-trap ignition if you are caught out of cover
      concussive:
      - Concussive Dampener helps against Tormentor slams, Subjugator burst, and the Threadling explosion
        pressure when breaking tethers
  damage:
