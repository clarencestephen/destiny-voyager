        exotic_armor: ''
        armor_stats: &id002
        - Weapons
        - Class
        surges_mods: Match surge to your DPS heavy. Lift/movement and Strand-resist mods; survivability
          for Subjugator and Tormentor overlap.
    - id: tether_breaker
      count: 1
      does: Attendant kill + tether destruction; backup add clear.
      loadout:
        subclass: A high add-clear subclass to chain Unwritten Attendant kills and handle Threadling counter-swarms
          (Strand or Solar builds work well)
        weapons: Fast-killing primary and add-clear special to drop Attendants and Threadlings; burst
          heavy for the shield-down window
        exotic_armor: ''
        armor_stats: &id003
        - Grenade
        - Health
        surges_mods: Match surge to your DPS heavy. Strand-resist mods are key here due to tether Threadlings;
          add-clear and ability-regen mods.
  - name: Solo
    learner_friendly: false
    summary: 'All roles. Expect 4-5 phases. Bring sustain + a wide-mag DPS

      option (Finality''s Auger if obtained — it''s a beast for this).

      '
    roles:
    - id: solo
      count: 1
      does: Methodical. Don't engage tethers without Empowerment.
      loadout:
        subclass: A self-sustaining subclass with strong survivability and add-clear (healing Solar or
          Void invisibility) for methodical multi-phase play
        weapons: Wide-magazine burst DPS - Finality's Auger if obtained - plus sustain weapons and an
          add-clear primary
        exotic_armor: ''
        armor_stats: &id004
        - Health
        - Class
        surges_mods: Match surge to your DPS option (Solar for Finality's Auger). Strand and Solar resist
          plus recovery mods; never touch tethers without Empowerment.
  cheese: []
  common_mistakes:
  - Hitting Strand tethers WITHOUT Unwritten Empowerment — does nothing, wastes time.
  - Mixing Truth + Lie lit symbols — dial doesn't fire fire-trap correctly.
  - Not taking cover during fire trap = death.
  - DPS window short — bring burst weapons (Whisper, Sleeper).
