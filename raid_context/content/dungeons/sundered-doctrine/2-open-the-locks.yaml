  learner_path:
  - '1st: knowledge_runner.'
  - '2nd: caller.'
  plain_language_steps:
  - 1. Drop your rally banner, then walk past the flag to start the fight against the Zoetic Lockset (a
    Hive boss) in the center of the room.
  - '2. Note the layout: four symbol wheels in a row, a four-section Lockout Progression buff bar at the
    top of your screen, deposit pillars next to each wheel, and Pyramid switches above center.'
  - '3. Watch the Lockout buff: it lights the wheels left-to-right over time, and the currently lit wheel
    is the only one you can rotate right now. Call out ''Lockout [N], wheel [N] active''.'
  - 4. Kill Preceptor Wizards to drop knowledge shards. Stacks build as Heightened (1), Brimming (2),
    or Overflowing (3), which rotate the wheel light by 1, 2, or 3 spaces.
  - 5. Carry knowledge to the pillar of the CURRENTLY LIT wheel and deposit it to rotate that wheel's
    light onto the symbol you want. Depositing on an unlit wheel wastes the shard.
  - 6. When the buff fills and the cycle resets, the RIGHTMOST wheel's currently lit symbol LOCKS IN and
    triggers its effect.
  - '7. Learn the locked-symbol effects: Hive spawns Ogres, Remember spawns Wizards, Commune makes the
    Lockset fire Resonant Sun projectiles, Stop halts enemy spawns, and Kill begins the DPS phase.'
  - 8. On the first cycle, aim to lock STOP on the rightmost wheel to halt the add waves and relieve pressure.
  - 9. On the next cycle, set up KILL on the rightmost wheel before the buff fills so the damage phase
    opens; call 'KILL - DAMAGE' when it locks.
  - 10. Burst the Lockset hard during the window. Note its shell closes periodically and pauses damage,
    so time your Supers and heavy around the open shell.
  - 11. Remember DPS length is inversely tied to how many symbols you locked before Kill, so locking too
    many bad symbols first shortens your damage window.
  - 12. After damage, the encounter cycles. Repeat until the boss dies, then carry the Boss CORE drop
    to the bowl near the loot chest to open the next area.
  defense:
    incoming_damage:
      adds:
      - Hive Ogres (spawned when 'Hive' symbol locks) - heavy Arc/Solar eye-beam and stomp pressure
      - Hive Wizards (spawned when 'Remember' locks, plus the Preceptor Wizards you farm for knowledge)
        - Arc/poison ranged attacks
      - Resonant Sun projectiles fired by the Lockset itself when 'Commune' locks - tracking AoE damage
      boss:
      - Zoetic Lockset Resonant Sun projectiles (when Commune is locked) - tracking ranged damage that
        piles up if untracked
    champions: []
    recommended_defensive_mods:
      elemental:
      - Resist Arc/Solar against Hive Ogres and Wizards on Master tier
      - General damage-resist while depositing knowledge near the Lockset
      concussive:
      - Concussive Dampener helps blunt Ogre stomps and the Lockset's Resonant Sun projectile barrage
        if Commune gets locked
  damage:
    surges:
    - DPS phase opens only when the 'Kill' symbol is locked on the rightmost wheel. No single canon DPS
      element is fixed by the guide, so match your surge mods to your chosen burst weapon's element.
    burst_windows: When 'Kill' locks in, burst the Lockset until its shell closes (damage pauses), then
      resume when it reopens; window length shrinks the more symbols you locked beforehand.
    recommended_dps:
    - 'Sustained heavy: Whisper of the Worm, Sleeper Simulant, or any Linear Fusion Rifle (the guide names
      these for the short window)'
    - Roaming or burst Supers timed to the open-shell window
    - Witherhoard to chip the Lockset between cycles, especially when soloing
