        weapons: Carry-forward loadout; sparrow for the mine race.
        exotic_armor: ''
        armor_stats:
        - Weapons
        - Health
        surges_mods: No surge requirement; favor traversal and resist mods.
  cheese:
  - title: Skip rolling barrel
    detail: 'Stay flush against either side wall of the staircase from the bottom.

      The barrel doesn''t roll over wall-flush positions in most spots —

      alcoves still safer, but flush works in a pinch.

      '
  common_mistakes:
  - Sprinting the jumping puzzle — every section punishes haste.
