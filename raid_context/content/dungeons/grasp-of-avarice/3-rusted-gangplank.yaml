  name: Rusted Gangplank (spike-trap jumping puzzle)
  kind: jumping-puzzle
  difficulty: medium
  estimated_time: 6-12 min
  abstract: 'Spike-trap jumping puzzle through Wilhelm-7''s booby-trapped facility: pressure-plate traps,
    falling panels, a 4-door lever room, and a rolling-barrel staircase.'
  setup: 'JUMPING PUZZLE:

    - Pressure plates = spike traps. Jump OVER them, don''t step.

    - Falling-panel platforms — land on LEFT panel (right one blocks console once it falls).

    - Multi-door lever room: doors flip in a sequence (open #3 → #1 → #2 → #4 via Scorch Cannon).

    - Rolling barrel staircase: hide in side alcoves as it rolls past.

    '
  callouts:
  - when: Pressure plate identified
    from: first to see
    to: team
    say: '"Trap ahead — jump."'
    why: Saves a wipe if anyone's distracted.
  - when: Lever in 4-door room hit
    from: self
    to: team
    say: '"3 OPEN — head 3."'
    why: Coordinates door sequence.
  wipe_triggers:
  - Stepping on a pressure plate = instant death.
  - Falling off the platform climb = long respawn (no mid-section checkpoint).
  permutations:
