    armor_stats: *id001
    surges_mods: No surge requirement; favor traversal and resist mods.
  - role_id: follower
    subclass: Mobile subclass for clean jumps; wait at safe points and advance only on the leader's call.
    weapons: Carry-forward loadout; sparrow for the mine race.
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: No surge requirement; favor traversal and resist mods.
