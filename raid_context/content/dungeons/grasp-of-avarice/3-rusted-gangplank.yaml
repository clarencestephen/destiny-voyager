  learner_path:
  - '1st time: follow leader, look at the layout for the next run.'
  - '2nd: lead the puzzle for someone else.'
  plain_language_steps:
  - 1. A spike-trap jumping puzzle through Wilhelm-7's booby-trapped facility. Go slow — every section
    punishes haste.
  - 2. Watch for pressure plates that trigger spike traps. Jump OVER them, never step on them (the cue
    is dust + a wall mechanism). Stepping on one is an instant kill.
  - 3. The lead player calls out each trap so distracted teammates don't wipe.
  - 4. On falling-panel platforms, land on the LEFT panel; the right one blocks the console once it falls.
  - 5. In the multi-door lever room, open the doors in sequence with a Scorch Cannon and call each door
    as you trigger it.
  - 6. On the rolling-barrel staircase, hide in the side alcoves as the barrel rolls past.
  - '7. Optional (Gjallarhorn Catalyst): in the 4-door lever room, look up at a vertical metal strut for
    a small chest platform reachable by a jump from a high beam (Catalyst fragment 2 of 3, no-checkpoint
    run).'
