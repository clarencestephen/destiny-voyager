    champions: []
    recommended_defensive_mods:
      elemental:
      - Arc resistance helps against the dense Fallen adds and the hard-hitting lieutenants. Break line
        of sight on Avarokk's grenade barrage rather than tanking it.
      concussive:
      - 'Optional: Concussive Dampener can reduce splash from Avarokk''s grenade barrage and Fallen explosives
        if you cannot break sightline.'
  damage:
    surges:
    - No fixed elemental requirement; match surges to your strongest burst heavy. The window after 60
      stacks is short, so prioritize raw burst over element.
    burst_windows: Opens at 60 cumulative deposited stacks; Avarokk retreats to the front and is vulnerable
      for a short window before resetting (expect to threshold rather than one-phase on learning runs).
    recommended_dps:
    - 'Burst DPS for the short window: heavy Rocket Launcher, Grenade Launcher, or Linear Fusion Rifle;
      Sword if you can safely close; Witherhoard for chip during deposit runs. Well of Radiance plus Bubble
      for a stationary front-of-room damage stack.'
