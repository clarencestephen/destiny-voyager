  plain_language_steps:
  - 1. Place the rally banner outside the door, then walk to the central engram inside the sphere interior
    to start the fight and summon Captain Avarokk plus his two lieutenants, R-M80 and Grisprax.
  - 2. Immediately focus-fire the lieutenants. They deal very high damage and can one-shot from melee
    range, so call their positions and burst them first.
  - 3. Each lieutenant drops about 10 Cursed Engrams on death (20 total); pick those up first, since they
    spawn near the deposit point.
  - 4. Pick up a Scorch Cannon dropped from Vandal spawns.
  - 5. Aim the cannon at one of the 3 Fallen batteries around the perimeter, hold the trigger to charge
    fully, then release to rain engrams from the ceiling near that battery.
  - 6. The cannoneer calls which battery is raining so gatherers run that direction.
  - 7. Gather the falling engrams, but manage your Burdened timer tightly (engram density is variable
    and this fight is unforgiving); bank around 10 stacks, then deposit at the Icon of Excess in the room
    center.
  - 8. Keep cycling batteries and depositing until the team reaches 60 cumulative deposited stacks.
  - 9. At 60, Avarokk retreats to the front of the room and becomes vulnerable.
  - 10. Stack up at the front of the room, drop a Well and Bubble, and burst Avarokk during the damage
    window; range matters because he moves forward.
  - 11. If he survives, the lieutenants respawn and the cycle resets; repeat the gather-deposit-DPS loop
    until he dies.
  - 12. Avoid Avarokk's grenade barrage by breaking line of sight when you are not actively depositing
    or damaging.
