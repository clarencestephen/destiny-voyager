        exotic_armor: ''
        armor_stats: *id001
        surges_mods: No mandatory surge; prioritize resilience and ability-uptime mods over weapon surges
          for the cannoneer.
    - id: gatherer
      count: 1
      does: Sprint between rain zones. Deposit.
      loadout:
        subclass: Add-clear plus self-healing subclass; the every-10-stacks instant Super recharge supports
          frequent Super use for lieutenant burst and survival.
        weapons: Burst heavy for the damage window plus an add-clear primary; Witherhoard to chip Avarokk
          during deposit runs.
        exotic_armor: ''
        armor_stats: *id002
        surges_mods: Heavy surge matched to your burst weapon's element; otherwise resilience and ability
