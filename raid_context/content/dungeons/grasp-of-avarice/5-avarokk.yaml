        weapons: Witherhoard to chip Avarokk during deposit runs, plus a burst heavy for the window; add-clear
          primary for lieutenants and Vandals.
        exotic_armor: ''
        armor_stats: &id003
        - Health
        - Class
        surges_mods: Heavy surge matched to your burst weapon; lean on survivability and ability mods
