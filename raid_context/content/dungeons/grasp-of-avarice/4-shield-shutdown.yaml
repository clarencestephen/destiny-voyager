    burst_windows: No boss burst window; progress is gated by depositing 20 per Servitor and breaking
      all 4 cores with launched bodies.
    recommended_dps:
    - Add-clear primary to clear Fallen quickly and a way to drop the unshielded Servitor fast; no heavy
      boss-DPS weapon is required.
