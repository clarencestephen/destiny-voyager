  learner_path:
  - '1st clear: gatherer (Hive room dive).'
  - '2nd: cannoneer.'
  plain_language_steps:
  - 1. Place the rally banner on the spawn-side ledge and gear up; Phry'zhia (a Hive Ogre) sits invincible
    in the center of the rectangular arena.
  - 2. Drop down to engage. Phry'zhia activates an eye laser, so use cover and avoid standing in her exposed
    sightline.
  - 3. Kill the Fallen that spawn carrying Scorch Cannons and pick up a cannon.
  - 4. Aim the Scorch Cannon at a side-room door battery, hold the trigger to charge fully, then release
    to open the door (it stays open about 30 seconds).
  - 5. Push into the opened side room (Left or Right), kill the Hive inside, and gather the Cursed Engrams
    they drop.
  - '6. Manage your Burdened timer: bank around 8-10 stacks, then deposit at the Icon of Excess near the
    spawn-side gap.'
  - 7. The cannoneer holds the cannon and opens the other side room next while gatherers swap rooms.
  - 8. Keep gathering and depositing until the team reaches 40 cumulative deposited stacks.
  - 9. At 40, Phry'zhia 'succumbs to temptation' and becomes damageable for roughly 20-25 seconds.
  - 10. Stack on the Icon spot (or the right-side elevated ledge for safer line-of-sight), drop a Well
    or Bubble, and burst her down.
  - 11. If she survives, she returns to invincibility; reset the gather-deposit loop and repeat the damage
    phase.
  defense:
    incoming_damage:
      adds:
      - Arc (Hive Thrall waves and Acolyte fire)
      - Void (Hive Knight boomers/projectiles)
      - Arc (Fallen Vandal/Dreg shots and Scorch Cannon Fallen)
      boss:
      - Void (Phry'zhia Hive Ogre eye-laser blast)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Consider Void resistance for the Ogre eye laser; break line of sight rather than tanking it. Arc
        resistance helps against dense Thrall and Fallen add fire.
      concussive:
      - 'Optional: Concussive Dampener can soften the Ogre''s eye-laser splash if you are caught in the
        open, but breaking sightline is the primary defense.'
  damage:
    surges:
    - No fixed elemental requirement; Phry'zhia takes increased damage while vulnerable. Match surges
      to your strongest burst weapon.
    burst_windows: About a 20-25 second window after 40 stacks are deposited; she returns to invincibility
      if not defeated.
    recommended_dps:
    - 'Burst DPS (the window is short): heavy Grenade Launcher or Rocket, Linear Fusion Rifle, or Sword
      for an aggressive close perch; Witherhoard for sustained chip during deposit runs.'
