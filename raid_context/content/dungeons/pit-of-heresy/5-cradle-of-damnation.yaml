  learner_path:
  - '1st: add_clear (study the swordbearer + aura rhythm).'
  - '2nd: swordbearer (input mastery).'
  - 'Solo: viable but requires confident sword discipline.'
  plain_language_steps:
  - 1. Place the rally banner at the entry, then walk to the central crystal to engage Zulmak, Instrument
    of Torment.
  - 2. Disciples of the Broken Blade spawn in the 3 perimeter alcoves, and Accursed Swordbearers spawn
    for each cycle.
  - 3. Have a spotter call out which alcove holds which Disciple (Might, Omen, or Oracle) so the swordbearer
    knows the input order.
  - '4. Kill an Accursed Swordbearer to get a relic Hive Cleaver, then kill a Disciple with the correct
    input: Light for Might (Knight), Heavy for Omen (Wizard), Block/deflect for Oracle (Shrieker).'
  - 5. Each killed Disciple drops a Void Orb; carry it and dunk it at the central crystal.
  - 6. Keep your add-clear players holding Zulmak's attention and killing ambient Hive while the swordbearer
    works the Disciples.
  - 7. Dunk all 3 Void Orbs at the crystal to make Zulmak vulnerable and spawn a green damage aura around
    the crystal.
  - 8. Stand inside the green aura to deal damage to Zulmak; damage does not register if you fire from
    outside it.
  - 9. Drop your Well or Bubble and burst Zulmak, but watch him closely.
  - 10. The instant Zulmak kneels to charge his slam, leave the aura immediately; standing in it during
    the slam is a one-shot.
  - 11. When the aura ends, the Disciples respawn; repeat the sword cycle and dunk to open the next damage
    window.
  - 12. Continue cycling damage windows until Zulmak is defeated, then open the final chest.
  defense:
    incoming_damage:
      adds:
      - Arc (Hive Knight melee, including Might Disciple)
      - Arc (Hive Wizard projectiles, Omen Disciple)
      - Arc (ambient Hive and Boomer fire)
      boss:
      - Arc (Zulmak melee and charged ground slam; the slam one-shots anyone in the green aura)
    champions: []
    recommended_defensive_mods:
      elemental:
      - Arc Resist is the primary pick against Zulmak and the Hive adds
      - Stack Health-affecting resist for the DPS aura window where Zulmak's basic attacks still hit
      concussive:
      - Concussive Dampener can reduce knockback from Zulmak's slam splash and Boomer fire near the crystal
  damage:
    surges:
    - Arc helps for Zulmak burst if you bring Arc weapons, but no specific elemental burn is required.
      The kill happens in the green aura damage window after 3 Void Orbs are dunked.
    burst_windows: Roughly a 20-second damage window opens each time the third Void Orb is dunked and
      the green aura appears; burst Zulmak hard, then exit the aura the instant he kneels.
    recommended_dps:
    - Burst-damage swords such as Lament or Falling Guillotine
    - Well of Radiance or a damage-boosting Super to maximize the aura window
    - Heavy burst options (linear fusion or rocket) that can be fired from inside the aura
