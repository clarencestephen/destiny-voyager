      prior encounters.'
    - 'Note: **Xenophage** (exotic LMG) is the SEPARATE ''The Journey'' quest, NOT a final-chest RNG drop
      here.'
    - Hymn of Desecration quest weapons (Apostate / Blasphemer / Heretic) drop here only after the quest
      is complete.
