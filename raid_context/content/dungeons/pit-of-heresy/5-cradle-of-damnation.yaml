        surges_mods: Arc weapon surge optional; favor Health and Super for the DPS window
  - name: 'Speed: 3-sword (parallel)'
    learner_friendly: false
    summary: Each player takes a Disciple simultaneously. All 3 swords pulled at once.
    best_for: Experienced teams, 1-phase attempts.
    roles:
    - id: swordbearer
      count: 3
      does: Each owns one Disciple. Sync dunks at crystal.
      loadout:
        subclass: Any; ability-uptime/survivability kit to weather Disciple alcoves
        weapons: Relic Hive Cleaver for Disciple kills; a burst DPS sword (Lament or Falling Guillotine)
          for the aura window; strong primary for adds
        exotic_armor: ''
        armor_stats: *id001
        surges_mods: Arc weapon surge optional for the DPS window; no surge is mandatory
  - name: Solo
    learner_friendly: false
    summary: All 3 Disciples + DPS yourself. Bring sword for DPS (Lament / Falling Guillotine).
    roles:
    - id: solo
      count: 1
      does: Methodical. Don't rush input order. Witherhoard the Disciples for chip.
      loadout:
        subclass: Any; survivable kit; Well of Radiance is popular for the DPS window
        weapons: Relic Hive Cleaver for Disciples; a burst DPS sword (Lament or Falling Guillotine) for
          the aura; Witherhoard for chip on the Disciples
        exotic_armor: ''
        armor_stats: &id003
        - Health
        - Class
        surges_mods: Arc weapon surge optional; no surge is mandatory
  cheese: []
  common_mistakes:
  - Standing in aura when Zulmak kneels = instant death.
  - Wrong input on a Disciple = wasted cycle, more adds spawn.
  - Not getting clear of the central crystal between phases — Zulmak's basic attacks still hit.
  - Trying to DPS from OUTSIDE the aura — damage doesn't register.
  rewards:
