  meta_loadout:
  - Bring a Rampage bow for this totem encounter (one-headshot acolyte kills); the guide used Subtle Calamity
    (Rampage / Archer's Tempo). Le Monarch also works if you have it.
  - Keep a machine gun (the guide used Hammerhead, Arc LMG) on hand for when you fall behind and adds
    must die immediately.
  - 'Titan: top tree Sentinel — melee kills heal you, charged melee grants overshield, and Ward of Dawn
    enables a safer orb strategy and acts as a get-out-of-jail card.'
  - 'Warlock: Devour and healing rift for healing on kills; Nova Bomb as a one-time ''this needs to die
    now'' button.'
  - 'Hunter: invisibility dodge plus Tether to shut down thrall after a dunk; spec for Class (Class) and
    class-ability cooldown.'
  - 'Stats: spec heavily for Class (Class), and the guide also specced class-ability cooldown on Hunter.'
