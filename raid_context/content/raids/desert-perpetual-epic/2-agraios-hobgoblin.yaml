  common_mistakes:
  - Standing in the Variable Elimination laser instead of using cover.
  - Failing to shoot the containment field out from inside the room — it can't be shot out from there,
    so add-clear must enter the rooms; it can also miss and travel outside.
  - Not shooting simultaneously (3,2,1) on the two inside eyes when the containment field releases.
  - Stopping damage between shield breaks instead of continuing through them.
