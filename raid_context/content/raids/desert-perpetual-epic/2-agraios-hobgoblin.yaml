  slug: agraios-hobgoblin
  name: Agraios (Hobgoblin)
  abstract: 'Second suggested encounter, located South/Behind. Directive: Seek & Grasp. The EPIC mod added
    here is the Elimination laser (Variable Elimination from the Hobgoblin). The end goal is the same
    as the base mechanic but with extra steps: additional key sets of eyes appear outside (one on the
    building, one on a pillar before the building), cyclops sit in side rooms, and both inside and outside
    teams must step on plates together. The DPS phase is significantly longer and the boss now has four
    shields instead of two, with two guardians teleported to left/right rooms to shoot eyes on the shields.'
  setup: This is the second boss-order pick; its Elimination-laser EPIC mechanic and main mechanic add
    onto the encounters chosen after it. Because the Hobgoblin's Variable Elimination laser is dangerous,
    use cover. The general round flow (align capsule, Banishment, rooms) repeats from the previous area.
    Damage is not hard to achieve here.
  plain_language_steps:
  - 1. Align to the matching capsule and run the same round setup as before (Banishment order and rooms
    stay the same).
  - '2. Work both the inside room and the outside eyes: step on the plate together on both sides now.
    There are additional key sets of eyes outside — right on the building, left on the pillar before reaching
    the building — and cyclops sit in the side rooms.'
  - 3. On each side, the inside player calls out the two eyes lit up on the key; the outside player shoots
    both; one comes back glowing to the inside player, who calls it out to the inside player on the other
    side.
  - 4. That inside player shoots the called eye, and vice versa for the other side.
  - 5. Both inside guardians shoot at the same time (count 3, 2, 1, shoot), because the Hydra releases
    a containment field inside that can't be shot out of — both add-clear go into the rooms to shoot them
    out. Sometimes the field misses and travels outside.
  - 6. Shoot the triangle the same as in the base mechanic.
  - '7. Damage phase: it is significantly longer here. The boss now has four shields instead of two, and
    damage can be done continuously through the breaks between shields.'
  - 8. During DPS, two randomly chosen guardians get teleported to the left/right rooms; while in the
    beam, shoot all six eyes plus the center on the shield (just like you would have done outside), then
    get teleported back to damage.
  - 9. Back at damage, the boss has two shields with a beam — shoot the center eye on both while in their
    respective beams to take away all shields.
  - 10. There are a lot of adds in the boss/DPS rooms, but they don't seem to respawn; the first two to
    teleport can focus solely on adds if wanted.
  mechanics:
  - 'Directive: Seek & Grasp.'
  - 'EPIC mod: Elimination laser / Variable Elimination from the Hobgoblin — use cover.'
  - 'Extra eye sets: additional key eyes outside, right on the building and left on the pillar before
    the building; cyclops in side rooms.'
  - 'Plates: step on the plate together on both sides (inside room and outside eyes).'
  - 'Eye relay: inside calls lit eyes on the key, outside shoots them, one returns glowing to inside,
    who calls it across; inside players shoot, then both inside shoot simultaneously (3,2,1) because the
    Hydra releases a containment field inside that can''t be shot out of (add-clear go into the rooms
    to clear it; it can sometimes travel outside).'
  - Triangle shot is the same as the base mechanic.
  - 'Four shields: boss has four shields instead of two; DPS can continue through the breaks between shields.'
  - 'Shield eye mechanic: two random guardians teleported to L/R rooms shoot all six eyes plus center
    on the shield, return to damage, then shoot the center eye on both remaining shielded beams to strip
    all shields.'
