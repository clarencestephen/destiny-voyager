encounter:
  order: 3
  slug: iatros-wyvern
  name: Iatros (Wyvern)
  abstract: 'Third suggested encounter, located East/Right. Directive: Evolve & Judge. The EPIC mod added
    here is Diastole + Suspend. The boss comes down at the beginning of the damage phase and chooses various
    (sometimes the same) perches, so long-range weapons are required and a runner runs the ring almost
    the whole DPS. The final stand uses six guardians on three plates and ''Temporality Fractures'' damage
    buff: the center boss is immune while low-HP headless copies appear in the arena corners, each assigned
    to a plate pair, and only after the copies die can the center boss be damaged.'
  setup: This is the third boss-order pick; its Diastole + Suspend EPIC mechanic stacks onto Koregos.
    Because Suspend removes abilities, the ring runner must make sure they don't get suspended (don't
    use a grenade to create a detain bubble while suspended). Toward the end of DPS, save supers for the
    final stand. Fanatics spawn just before and during damage.
  plain_language_steps:
  - 1. Run the usual ring/sand and eye mechanics for this encounter.
  - '2. Watch chat: ''Looses track of variables'' means the boss is coming down soon.'
  - 3. The boss comes down at the beginning of the damage phase, so long-range weapons are required. It
    chooses various (and sometimes the same) perch to hang out on; the runner is basically running the
    whole DPS and Tractor is only useful for a short time.
  - 4. The ring runner must make sure they don't get suspended if that mod is on — Suspend removes abilities,
    so don't use a grenade (to create a detain bubble) at that time.
  - 5. Fanatics spawn just before and during damage; deal with them while damaging.
  - 6. Toward the end of DPS, save supers for the final stand.
  - 7. As soon as the boss goes into final stand, two guardians stand on each of the three plates.
  - 8. Chat reads 'Temporality Fractures', giving a damage buff. The boss in the center is immune. In
    the arena corners, copies of the boss appear at ground level — all low HP (but the amount is deceiving)
    and headless/named.
  - 9. Each plate pair kills the copy they are assigned. If you take too long, a copy might go temporarily
    immune and be coy.
  - 10. Once all copies are dead, chat reads 'Agraios final script activates' — now damage the center
    boss and kill it. There are 4 bosses plus 1 unnamed copy, which is the one to shoot during damage;
    watch for the orange teleport dust.
