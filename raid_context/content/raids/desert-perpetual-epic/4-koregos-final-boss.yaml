  rewards:
  - After raid completion, a statue drops the Atlas & Almanac quest
  common_mistakes:
  - Aligning a capsule too early before reading the capsules, wasting ammo and time.
  - Letting the 'Worldline Stability' timer (~5 min) run out, which is a wipe.
  - Killing imps in the first round when you shouldn't — imp death spawns the Wyvern in the main room;
    only kill imps when sand is needed.
  - Using a grenade for a detain bubble while suspended, or not hopping on the 3rd Diastole beat and getting
    detained/suspended.
  - Letting the final hit on a mini boss come from the same guardian — it must be three separate guardians
    as it overwrites the current alignment buff; prefer recovering via the room/plate.
  - During Round 3 DPS, buffed shooting the inner crystal or non-buffed shooting the outer — the phase
    ends immediately if the crystal pairing is wrong.
  - Walking off when entering the final portal by going too fast.
  - Using Phoenix Dive when the floor disappears at the end of the DPS phase.
  - Not jumping off at the end of the Final Stand, which kills you.
