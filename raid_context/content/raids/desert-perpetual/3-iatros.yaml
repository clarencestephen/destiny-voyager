  learner_path:
  - '1st: floater.'
  - '2nd: builder.'
  - '3rd: climber.'
  plain_language_steps:
  - 1. After the banner, engage Iatros (a Vex Hobgoblin) along with the six Time's Burden Minotaurs present
    at the start.
  - 2. Each player kills one Minotaur, picks up its Chronon (Cinnabar = red, Antimony = white), jumps
    through the hoop in front of Iatros, and deposits it.
  - 3. With six Chronons in the hoop, the Diamond Oracle beneath it becomes visible — shoot it to start
    the prep phase.
  - 4. Everyone gains the Diastole buff (a pulse counter that fires on the fourth cube break); the Climber
    needs Absolute Temporality from a plate, and the three Builders position at the three pillars (spawn,
    middle, boss-spawn).
  - 5. Each pillar has three cubes; a Builder shoots the BOTTOM cube exactly when the Diastole pulse hits
    the fourth sequence pip to create platforms.
  - 6. The Climber jumps onto the freshly created platforms and interacts with the first cube, which unlocks
    the MIDDLE cube for the Builder to shoot on the next Diastole pulse.
  - 7. Bottom platforms vanish as the middle ones spawn (time jumps) — the Climber keeps ascending and
    interacts with the second cube to unlock the TOP cube, shot on the same Diastole timing.
  - 8. The Climber interacts with the third cube to open the DPS phase.
  - 9. Throughout, two floaters hunt the randomly spawning Time's Burdens and dunk Chronons into the Hourglass;
    if it empties, a 12-second Neomutation wipe timer begins.
  - 10. In the DPS phase Iatros is vulnerable — burst it down while dodging the dangerous Warp Lance and
    Ground Slam attacks.
  - 11. Repeat the three ascent-and-DPS phases until Iatros dies.
