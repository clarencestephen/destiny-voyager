        armor_stats: &id003
        - Health
        - Class
        surges_mods: Surges matched to your heavy; ammo-finder/reserves to sustain Time's Burden clears
          and Hourglass refills.
  cheese: []
  common_mistakes:
  - Diastole mistiming — Climber falls.
  - Forgetting to refill Hourglass during DPS = Neomutation mid-burst.
  - Climber damaged during cube interaction = progress reset.
  rewards:
    guaranteed:
    - 1× raid weapon or armor
    hidden_chest: null
