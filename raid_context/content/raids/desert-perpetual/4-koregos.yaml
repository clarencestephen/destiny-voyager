  difficulty: hard
  estimated_time: 30-50 min
  abstract: 'Final boss. Mega Hydra. 6-min Digitization wipe timer. Constant

    stunners take down Koregos''s 4 arms (Arc beam interrupt). 3-team

    Temporality cycle: Absolute sees Chronon color in Hoop, Constant

    sees Mine colors, Cyclical sees TRUE mines (3 of 6 are real). Dunk

    6 Chronons in Hoop → diamond → Koregos exposes head. 4-arm cube

    puzzle (Constant+Cyclical see, Absolute interacts). Head DPS with

    Arc beams + final stand with shrinking time + Decoherence wipe at

    death.

    '
  setup: "WHAT YOU SEE:\n- Wide circular arena with central pit.\n- Koregos hovers center, then teleports\
    \ to corners.\n- 3 plates: Constant (L), Absolute (M), Cyclical (R) from spawn perspective.\n- 6 \"\
    sea-mine\" devices around arena.\n- Hoop-mounted Hourglass over central pit.\n- 4 Tetrad pillar pools\
    \ (Temporal Oculus refresh).\n\nPLATFORM MECHANICS:\n- Approach to engage. 6-min Digitization timer\
    \ starts.\n- Split: STUNNER team (Constant + add-clear) + MECHANIC team (1 Constant + 1 Absolute +\
    \ 1 or 2 Cyclical).\n- Mechanic loop:\n  • Kill ambient + Coryphaeus Hydras → 3 plates active.\n \
    \ • Pick Temporalities.\n  • Stand in Temporal Oculus pool → get Oculus buff.\n  • Absolute: sees\
    \ Chronon color needed in Hoop (Cinnabar/Antimony/Cobalt).\n  • Constant: sees which mines hold that\
    \ color (dust aura).\n  • Cyclical: sees TRUE mines (digital aura). 3 of 6 are real.\n  • Cross-talk:\
    \ Absolute calls color → Constant marks colored mines (e.g., Trace Rifle ping) → Cyclical confirms\
    \ TRUE.\n  • Absolute destroys TRUE mines = Chronons drop.\n  • Cyclical picks Chronon, dunks in Hoop.\
    \ DOUBLE-DUNK strategy = 2 Cyclicals dunk near-simultaneously.\n- Wrong dunk = instant death.\n- 6\
    \ Chronons in Hoop → diamond Oracle visible → shoot to advance.\n- Koregos teleports up. 4-arm cube\
    \ puzzle phase:\n  • 2 cubes for Constant + Cyclical (each sees 2 of 3) per arm.\n  • Absolute interacts\
    \ with the cube BOTH see common.\n  • Constant: from Koregos perspective, calls cube positions (e.g.,\
    \ \"middle + left\").\n  • Cyclical: from Koregos perspective, calls cube positions.\n  • Absolute\
    \ interacts with the common position.\n  • Optional: Constant/Cyclical STAND on the absent-cube position\
    \ (the one only they see). Shows Absolute the common.\n- All 4 arms = head exposed.\n- DPS phase:\
    \ shoot head (3-eye sets). Arc beam diamond fires 2 beams in changing paths — dodge.\n- 1 player can\
    \ extend phase: matches dusty aura around local Hoop with Chronon around Koregos. Dunk = extension.\n\
    - 3 damage extension checks per phase.\n- Final stand: spinning head, beams more erratic. Decoherence\
    \ Imminent debuff at boss death — get FAR from Koregos or wipe.\n\nSTART STATE: rally banner. Interact\
    \ cube in middle to start.\n"
  callouts:
  - when: Stunner ready
    from: stunner
    to: team
    say: '"STUN — arms down!"'
    why: Refresh Constant timers.
  - when: Absolute color
