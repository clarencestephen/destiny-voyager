  meta_loadout:
  - 'Koregos is the only encounter the source gives bespoke swaps for (referred to as "corgos"/"cordos"/"Coros").
    Key team change: an Arc Titan is NOT needed on the final boss, so the Titan main swaps to a Prismatic
    Titan for Koregos; a Hunter takes the Tractor Cannon role to extend the damage phase.'
  - 'Titan (Koregos-specific): Prismatic Titan, standard Consecration build — Knockout + Consecration
    aspects, Cuirass of the Falling Star (Thundercrash). Fragments: Facet of Balance, Facet of Dawn, Facet
    of Protection, Facet of Courage (Courage adds 10% Thundercrash damage vs darkness-debuffed enemies).
    Source notes the Titan does not need to be on Arc for this boss.'
  - 'Warlock (support): Solar Warlock, Well of Radiance, Boots of the Assembler; Healing Rift / Celestial
    Fire / Healing Grenade; Icarus Dash + Helion (Icarus Dash called out for dodging the giant laser here);
    200 Super / 160 Weapons; Mint Retrograde + Geartight Apex.'
  - 'Hunter (Koregos role): Prismatic Hunter on the Tractor Cannon role to extend the damage phase; keeps
    Inmost Light for high ability regen, Grapple to reach awkwardly-spawning Chronons, and spams smoke
    bombs to maintain ~30% damage resist. Sever DR plus dust-field/Threaded Spike stacking makes surviving
    under the beam highly reliable. Mint Retrograde + Tractor Cannon.'
  - 'Hunter alternate Koregos DPS ("chicken" rotation): Parasite + Mint Retrograde (requires a holster
    mod).'
