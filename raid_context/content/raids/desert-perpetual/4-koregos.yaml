  plain_language_steps:
  - 1. After the banner, interact with the middle cube to start; the moment you engage Koregos (a Mega
    Hydra) the 6-minute Digitization wipe timer begins.
  - 2. Split into a STUNNER team (Constant players plus add-clear) and a MECHANIC team (one Constant,
    one Absolute, and one or two Cyclical players).
  - 3. Clear ambient Vex and Coryphaeus Hydras to activate the three plates (Constant left, Absolute middle,
    Cyclical right), then pick up your Temporalities.
  - '4. Stand in a Temporal Oculus pool to gain the Oculus buff: Absolute sees which Chronon color the
    Hoop wants (Cinnabar/Antimony/Cobalt), Constant sees which mines hold that color (dust aura), and
    Cyclical sees the TRUE mines (digital aura) — only three of six are real.'
  - '5. Cross-talk it out: Absolute calls the color, Constant marks the colored mines (e.g., a Trace Rifle
    ping), and Cyclical confirms which marked mines are TRUE; Absolute then destroys the true mines to
    drop Chronons.'
  - 6. Cyclical picks up a Chronon and dunks it in the Hoop — a wrong-color dunk is an instant death;
    the double-dunk strategy has two Cyclicals dunk near-simultaneously.
  - 7. Meanwhile the stunner team uses Arc-beam interrupts to take down Koregos's four arms, which also
    refreshes Constant timers.
  - 8. Once six Chronons are in the Hoop, the diamond Oracle appears — shoot it to advance and Koregos
    teleports up for the four-arm cube puzzle.
  - 9. For each arm there are cubes that Constant and Cyclical each partially see; both call their cube
    positions from Koregos's perspective, and Absolute interacts with the cube position both have in common
    (optionally standing on the absent-cube position to reveal the common one).
  - '10. Completing all four arms exposes the head for DPS: shoot the head''s three-eye sets while dodging
    the Arc beam diamond that fires two beams along changing paths.'
  - 11. Extend the phase by matching the dusty aura around the local Hoop with the Chronon around Koregos
    and dunking (three extension checks per phase).
  - 12. In the final stand the head spins and beams get more erratic; when Koregos dies the Decoherence
    Imminent debuff triggers, so get FAR from the body or the fireteam wipes.
