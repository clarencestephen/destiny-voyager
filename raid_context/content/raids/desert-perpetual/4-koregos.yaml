    say: '"HEAD — DPS! Watch beams!"'
    why: Burst + dodge.
  - when: Final stand
    from: any
    to: team
    say: '"DECOHERENCE — RUN!"'
    why: Avoid death explosion.
  wipe_triggers:
  - Digitization 6-min timer.
  - Wrong Chronon dunked = instant Cyclical death.
  - Wrong cube interacted by Absolute = encounter reset.
  - Arc beam direct hit.
  - Decoherence Imminent at boss death.
  damage_phase_triggers:
  - 6 Chronons dunked + 4 cube-arm puzzles done → head exposed → DPS.
  - Damage extension via Chronon-color match around Koregos.
  parallel_timeline:
  - phase: Pull
    all: Engage. 3 plates.
  - phase: Temporality + mine cycle
