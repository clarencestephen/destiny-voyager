    cyclical: Calls 2 cubes from Koregos POV.
    absolute: Interacts common cube.
  - phase: DPS head
    all: Burst + dodge beams. Damage extension Chronon dunks.
  - phase: Final stand
    all: Burn + Decoherence escape.
