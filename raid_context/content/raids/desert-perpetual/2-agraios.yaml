  plain_language_steps:
  - 1. After the banner, engage Agraios (a Vex Hobgoblin) and its three proxies (Made Constant, Made Absolute,
    Made Cyclical); Agraios takes one of four Vex platforms and the proxies occupy the others.
  - 2. Clear ambient Vex and the Ultra Hydra that spawns mid-encounter — this triggers five Time's Burden
    Minotaurs to spawn in the corners, which drop Cobalt Chronons.
  - 3. Five Guardians each grab one Cobalt Chronon and run it through one of the five rings (numbered
    1-5 clockwise from spawn) to charge it; each player charges only one ring.
  - 4. Three Coryphaeus Wyverns then spawn and the three central plates activate (Constant left, Absolute
    middle, Cyclical right) — three players step them to take long-lasting Temporality debuffs.
  - 5. One proxy starts sniping, applying Variable Elimination (a 10-second instant-kill timer); break
    line of sight behind cover to reset it to 10 seconds.
  - 6. The plate players read the sniping proxy's title (Made Constant/Cyclical/Absolute) and call it;
    the player whose Temporality matches runs to that proxy's platform and interacts with the Vex receptacle.
  - 7. That player gains the Alignment Charge buff with five small boxes beneath them; the other two plate
    players see two of the five rings glowing blue (the rest flash red) and call those numbers.
  - 8. Non-plate players Chronon-charge the called blue rings, then the Alignment player runs through
    the charged rings to fill all five boxes.
  - 9. At max Alignment Charge the grenade slot becomes a Vex-gate icon; a goader draws proxy aggro and
    counts down, and at about four seconds the Alignment player detonates the Detainment Bubble so the
    ricochet kills the proxy.
  - 10. Killing the proxy exposes Agraios for a roughly 25-30 second DPS phase.
  - 11. During DPS the Alignment buff returns — redo the ring run and ricochet detain for the second and
    third proxies to extend damage (three ricochet detains per phase). Repeat until Agraios dies.
