  name: Agraios, Inherent
  difficulty: hard
  estimated_time: 25-35 min
  abstract: 'Vex Hobgoblin boss with 3 proxies (Made Constant/Cyclical/Absolute).

    5 rings to charge with Cobalt Chronons (from Time''s Burden Minotaurs).

    3 plates grant Temporality. Sniping proxy: matching-Temporality

    player runs to proxy platform, interacts with Vex device → builds

    Alignment Charge → ricochet detainment bubble to kill proxy →

    Agraios exposed → DPS.

    '
  setup: "WHAT YOU SEE:\n- Central arena with 5 rings (number 1-5 clockwise from spawn).\n- 3 plates inside\
    \ the ring circle (Constant L, Absolute M, Cyclical R).\n- Agraios + 3 proxies (Made Constant, Made\
    \ Absolute, Made Cyclical) on 4 Vex platforms.\n- Time's Burden Minotaurs spawn in corners.\n- Ultra\
    \ Hydra spawns mid-encounter.\n- Coryphaeus Wyverns spawn around arena after Ultra Hydra dies.\n\n\
    PLATFORM MECHANICS:\n- Approach to engage.\n- Agraios teleports to 1 of 4 platforms; 3 proxies (Made\
    \ X) occupy the others.\n- Kill ambient + Ultra Hydra → 5 Time's Burden Minotaurs spawn in corners\
    \ → Cobalt Chronons drop.\n- 5 Guardians take 1 Chronon each, run through ring 1-5 to charge. Each\
    \ charges only 1 ring.\n- 3 Coryphaeus Wyverns spawn → 3 plates activate.\n- 3 plate players step\
    \ → take Constant/Absolute/Cyclical Temporality (longer-lasting than encounter 1).\n- One proxy starts\
    \ SNIPING (Variable Elimination debuff: 10s, instant kill at 0 even if hidden afterwards).\n  Cover\
    \ breaks LoS + resets timer to 10s.\n- Plate players ID the SNIPING proxy's title (Made Constant/Cyclical/Absolute)\
    \ and call it.\n- Player with matching Temporality runs to proxy platform → interacts with Vex receptacle.\n\
    - That player now has ALIGNMENT CHARGE buff + 5 small boxes beneath.\n- Other 2 plate players see\
    \ 2 RINGS glowing BLUE (out of 5; others flash red).\n- Call blue rings to non-plate players → they\
    \ Chronon-charge those blue rings.\n- Alignment player runs through CHARGED rings to fill the 5 boxes.\n\
    - Max Alignment Charge → grenade ability replaces with Vex-gate icon.\n- One player draws proxy aggro,\
    \ counts down. At ~4s: Alignment player detonates Detainment Bubble = ricochet = proxy dies.\n- Agraios\
    \ exposed → DPS phase.\n- During DPS, Alignment buff returns → re-do ring run + detain ricochet for\
    \ second/third proxy kill = extended DPS.\n- 3 ricochet detains per damage phase.\n\nSTART STATE:\
    \ rally banner. Approach to engage.\n"
