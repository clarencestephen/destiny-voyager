  plain_language_steps:
  - 1. Place your rally banner, then drop onto the central Vex platform and clear the incoming Vex waves.
  - 2. With the platform clear, head to the main purple spire that rises toward the selection altar.
  - 3. Ascend the spire, dealing with any Vex that path your route up.
