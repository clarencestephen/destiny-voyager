  - 6. On a first run, pick Epoptes first to learn the two-Temporality (Constant/Cyclical) Lens system
    before tackling the others.
  - 7. You must clear any of Epoptes, Agraios, and Iatros (in any order) before Koregos unlocks; choose
    your next boss whenever you return here.
