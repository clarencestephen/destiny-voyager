  common_mistakes:
  - Aligning the capsule too early before reading the capsules, which wastes ammo and time.
  - Not entering portals at the same time during Banishment — they can lock out.
  - Trying to break the crystal from below the line-of-sight level instead of on roughly the same level,
    losing the 'Destroy Temporal Locus' prompt.
  - Picking the wrong encounter order — this boss's main mechanic plus the Detain-traps EPIC mechanic
    stack onto later encounters.
