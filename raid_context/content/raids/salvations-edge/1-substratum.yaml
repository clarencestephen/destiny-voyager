    - No boss DPS phase in Substratum. Completion is depositing all resonance into the central chest three
      times in a row, not a damage check.
    burst_windows: No damage phase; the only burst priority is deleting the Threshold Sentinel (Tormentor)
      fast when it spawns mid so the side doors reopen.
    recommended_dps:
