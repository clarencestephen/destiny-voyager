      - Sol Divisive Vex (Hydras as Keeper of the Monolith, Minotaurs as Devotee of the Witness, Goblins,
        Supplicants) deal Void/Vex bolt damage
      - Dread faction enemies (Weavers, Subjugator)
      boss: []
    champions:
