    count: 1
    does: 'Owns the left Resonant Conductor: shoots its core to arm it, then locks it down at the right
      moment (the ''kill'' in comms). Holds up to 3 Pyramidal Resonance stacks. Run Anti-Overload for
      the Devotee Minotaur.'
  - role: Left-side Plate-runner
    count: 1
    does: Steps onto the left connecting plate exactly when the charge arrives (shrinking aura) and steps
      off after it bounces. Keeps the 'send' cycle flowing between plates on the left side.
  - role: Left-side Add-clear
    count: 1
    does: 'Holds the left room: kills the Gatekeeper Hydra (opens next room), Overload Minotaur, Subjugator,
      and lesser Vex/Dread. Collects resonance stacks and calls out where the next room opens. In the
      Aztecross run, the ad-clear pair freeing up the plate players was called ''massive''.'
  - role: Right-side Conductor
    count: 1
    does: 'Mirror of the left Conductor: arms and locks the right Resonant Conductor, holds up to 3 resonance
      stacks, runs Anti-Overload.'
  - role: Right-side Plate-runner
    count: 1
    does: 'Mirror of the left Plate-runner: times steps on the right plate to keep the charge bouncing.'
  - role: Right-side Add-clear
    count: 1
    does: 'Mirror of the left Add-clear: kills the Gatekeeper/Overload/Subjugator on the right, collects
      stacks, locates the next room, and supports the Tormentor nuke mid.'
  needs_clarification:
  - 'Enemy terminology: the Aztecross VOD says ''Gatekeeper'' for the door-opening Hydra, while the authored
    YAML calls it ''Keeper of the Monolith.'' These appear to be the same enemy but the exact in-game
    name should be confirmed.'
  - 'Exact resonance economy: how many resonance stacks are required per deposit, and exactly how much
    the deposit extends the Final Shape Looming timer, is not settled. The VOD explicitly says ''we don''t
    know how many we might need... we don''t really know'' — do not assume a fixed number.'
  - 'Precise conductor/plate wiring: the authored YAML describes arming the conductor by shooting its
