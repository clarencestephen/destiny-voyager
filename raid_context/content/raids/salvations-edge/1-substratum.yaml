  mechanics:
  - Substratum is the first encounter of Salvation's Edge (a 6-player raid). There is NO boss DPS phase
    — you win by depositing Pyramidal Resonance into the central chest across three successive rounds
    before the 'Final Shape Looming' wipe timer expires.
  - 'Layout: a large central room with a chest in the middle, flanked by two opposing side doors that
    lead into peripheral rooms. As rooms are cleared, new sub-rooms open in varying locations the team
    must locate (callouts in the Aztecross VOD reference ''top'', ''window'', ''basement'', and ''right
    side'' rooms — the open room''s position changes, so someone has to find it each time).'
  - 'Pull/start: one player picks up the central Pyramidal Resonance and dunks it into the central chest.
    This opens both side doors and starts the Final Shape Looming wipe timer.'
  - 'Enemy waves are Sol Divisive Vex plus Dread. Key priority enemies appear repeatedly: a ''Gatekeeper''
    Hydra (authored file calls it Keeper of the Monolith) whose death opens the next room/door (''door''s
    open, we''re good''); an Overload Minotaur (Devotee of the Witness) that needs Anti-Overload; later
    a Subjugator (Dread) spawns in a room.'
  - Threshold Sentinel (Tormentor) periodically spawns in the centre. When it does, the team converges
    mid and nukes it ('everyone middle, nuke Tormentor'). The Aztecross team used Tractor Cannon plus
    Supers to delete it. The authored file notes side doors close while the Tormentor is up, so don't
    get caught in a doorway.
  - Pyramidal Resonance 'stacks' (called 'stacks' / a buff on your buff bar in the VOD) form in the middle
    and in rooms. Each player can hold up to 3 (3x). Stacks have a timer; holding too many or letting
    a stack expire kills you. The team continually picks up fresh stacks to 'refresh' and extend their
    hold.
  - 'The ''send / kill'' loop is the core mechanic: players bounce a charge (referred to as ''sending'')
    between plates/rooms and call ''kill'' when the cycle is ready to be completed (''sending'', ''kill
    on the way'', ''send back to me one more time, then we kill''). The authored file frames this as:
    arm a Resonant Conductor obelisk by shooting its core, then step on the connected plate when the charge
    arrives to lock the conductor (consuming a resonance stack). Both conductors must be locked.'
  - 'On a missed bounce there is a grace window; a repeated miss escalates (authored file: a Subjugator
    spawns and locks plates). The VOD confirms a Subjugator appears and must be killed.'
  - When both conductors are locked / the cycle completes, everyone converges on the central chest and
    deposits resonance, which refreshes/extends the Final Shape Looming timer ('make sure it actually
    goes in, keep an eye on your buff meter'). Repeat the full loop a total of three times to finish;
    stairs to the next area then unfurl.
  - 'Hazard: a Witness Hand above the arena casts Resonant Outburst — a triangular floor AoE that kills
    low-Health players (''careful, don''t be under the hands''). Stay out of it, especially at low Health.'
  strategies:
  - name: Standard 3-3 split (Conductor / Plate-runner / Add-clear per side)
    summary: Two teams of three, one per side door. Each side runs one Conductor, one Plate-runner, and
      one Add-clear. Both conductors get locked each round, then everyone dumps resonance at the central
      chest. Repeat three times.
    steps:
    - Split 3-3, lock roles out loud before pulling.
    - Dunk the central resonance to open doors and start the timer.
    - 'Each team clears its side: Gatekeeper Hydra first (opens next room), then Overload Minotaur.'
    - Converge mid to nuke the Threshold Sentinel (Tormentor) whenever it spawns.
    - Arm the conductor (shoot its core), bounce charges via plates, collect up to 3 resonance stacks
      each.
    - Lock both conductors, converge on the chest, deposit resonance, confirm it registers.
    - Repeat the full loop until three successful deposits.
    best_for: First-timers and general/normal clears; the default and most-documented approach.
    source_support: 'Cross-referenced: this is the structure in the authored Substratum YAML, and the
      Aztecross VOD matches it — a dedicated ad-clear pair, plate players, gatekeeper opening rooms, overload
      kills, Tormentor nuked mid, 3x stacks, and depositing/refreshing.'
  - name: Resonance-heavy / overflow hold for timer extension
    summary: Rather than depositing the minimum, players aggressively top off to 3 stacks each before
      locking, maximizing the wipe-timer extension when everything is deposited. Useful when the Final
      Shape Looming timer runs hot.
    steps:
    - Run the standard 3-3 split.
    - Before locking conductors, have collectors top everyone toward 3x stacks (without exceeding 3, which
      kills you).
    - Lock both conductors, then deposit the larger resonance pool at the chest for a bigger timer refresh.
    - Repeat, banking time each round.
    best_for: Harder difficulties (Master/Contest) or any run where the wipe timer is tight.
    source_support: Authored YAML lists this as a permutation. The VOD partially supports it ('we're going
      to have Max time on this next phase', 'we don't know how many we might need... keep doing normal'),
      but the Aztecross team explicitly chose NOT to over-collect on normal — so treat this as situational,
      not default.
  - name: 4-2 with designated Tormentor killers
    summary: Two players sit mid as dedicated Threshold Sentinel killers and resonance runners; they don't
      do plate/conductor work. The other four split 2-2 to handle conductors and plates.
    steps:
    - Assign 2 dedicated mid players (Tormentor killers / resonance runners) and 4 side players (2 per
      side).
    - Side pairs share conductor + plate duty on their side.
    - Mid pair instantly deletes the Tormentor when it spawns and ferries resonance to the chest.
    - Lock both conductors, deposit, repeat.
    best_for: Teams that struggle with Tormentor timing or want a cleaner mid burn on harder difficulties.
    source_support: Listed in the authored YAML as a permutation. NOT directly shown in the Aztecross
      VOD (they ran the standard split), so verify before relying on it.
  role_breakdown:
