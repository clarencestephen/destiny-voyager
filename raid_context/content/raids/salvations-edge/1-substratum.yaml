  learner_path:
  - '1st clear: add-clear. Learn resonance shapes without conductor/plate pressure.'
  - '2nd clear: plate-runner.'
  - '3rd+: conductor.'
  plain_language_steps:
  - 1. Pre-pull, split into two teams of three. On each side assign one Conductor player, one Plate-runner,
    and one Add-clear. Lock these roles out loud before pulling.
  - 2. Everyone walks into the large central room. One player picks up the central Pyramidal Resonance
    (triangle) and dunks it into the central chest. This opens the two side doors and starts the Final
    Shape Looming wipe timer.
  - 3. Push into your assigned peripheral room. Walk forward slowly and take cover. Supplicants spawn
    at the back of each room, so rushing in dies.
  - '4. Clear the Sol Divisive Vex and Dread waves. Priority kills: the Keeper of the Monolith (Hydra),
    which opens the next sub-room, then the Devotee of the Witness (Overload Minotaur), which needs Anti-Overload.'
  - 5. When the Threshold Sentinel (Tormentor) spawns in the centre, the side doors close. Leave the side
    room immediately and converge to the centre, then burn the Tormentor down. Anyone caught in a closing
    door dies.
  - 6. Once you find the glowing circuit plates and the Resonant Conductor obelisk, the Conductor player
    stands a few steps away and shoots the conductor's core once to arm it.
  - 7. The Plate-runner steps onto the connected plate at the exact moment the charge enters (look for
    the shrinking circular aura), then steps off after it bounces. Repeat to keep charges flowing.
  - 8. While bouncing charges, pick up Pyramidal Resonance shapes by walking onto them. Never hold more
    than 3 stacks, and don't let a stack's timer expire on you.
  - 9. With the conductor armed, the Conductor player stands on the plate when the next charge arrives
    to lock it down, consuming one resonance stack. Do this on both sides.
  - 10. With both conductors locked, everyone converges on the central chest and deposits their resonance.
    This extends the Final Shape Looming timer.
  - 11. Avoid standing under the Witness Hand's Resonant Outburst (triangular floor AoE) the whole time,
    especially at low Health.
  - 12. Repeat the full loop two more times. After the third successful deposit, the stairs to the next
    area unfurl.
  defense:
