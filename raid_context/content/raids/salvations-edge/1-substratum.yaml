  learner_path:
  - '1st clear: add-clear. Learn resonance shapes without conductor/plate pressure.'
  - '2nd clear: plate-runner.'
  - '3rd+: conductor.'
  plain_language_steps:
  - Before pulling, split into two teams of three, one for each side door. On each side, assign a Conductor
    player, a Plate-runner, and an Add-clear player. Salvation's Edge is comms-heavy, so say roles out
    loud and lock them in.
  - Everyone walks into the large central room. One player grabs the central Pyramidal Resonance (triangle)
    and dunks it into the central chest. This opens both side doors and starts the Final Shape Looming
    wipe timer.
  - Push into your assigned side room. Walk in carefully and take cover — enemies spawn toward the back,
    so rushing in gets you killed.
  - 'Clear the Sol Divisive Vex and Dread. Priority targets: the Gatekeeper Hydra (its death opens the
    next room — in the VOD ''door''s open, we''re good''), then the Overload Minotaur (Devotee of the
    Witness), which needs Anti-Overload.'
  - After a room is cleared, a new sub-room opens somewhere — its position varies (top, window, basement,
    or to one side). Call out where it opened so your team finds it fast.
  - When the Threshold Sentinel (Tormentor) spawns in the centre, everyone converges mid and burns it
    down fast ('everyone middle, nuke Tormentor'). Don't get caught in a closing side door.
  - Find the glowing circuit plates and the Resonant Conductor obelisk. The Conductor player stands a
    few steps back and shoots the conductor's core once to arm it.
  - The Plate-runner steps onto the connected plate the instant the charge arrives (watch for the shrinking
    aura), then steps off after it bounces. Keep bouncing the charge between plates — this is the 'sending'
    you hear in comms.
  - While the charge bounces, pick up Pyramidal Resonance stacks by walking onto them. Never hold more
    than 3 (3x), and don't let a stack's timer run out on you. Grab fresh ones to refresh.
  - With the conductor armed, lock it down (in the VOD this is the 'kill' / 'send back, then we kill'
    moment). Do this on both sides so both conductors are locked.
  - Everyone converges on the central chest and deposits resonance. Confirm it actually goes in (watch
    your buff bar). This refreshes/extends the wipe timer.
  - Repeat the whole loop two more times. The whole fight, stay out of the Witness Hand's triangular floor
    AoE, especially at low Health. After the third successful deposit, the stairs to the next area open.
