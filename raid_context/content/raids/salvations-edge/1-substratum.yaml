# raid_context/content/raids/salvations-edge/1-substratum.yaml
# Schema v3 (atomic). v2 mechanics + Phase-2 verified additions. EoF stat names.
# Blank loadout fields = unverified (no guessing).
activity:
  slug: salvations-edge
  name: Salvation's Edge
  activity_type: raid
  fireteam_size: 6
encounter:
  order: 1
  slug: substratum
  name: Substratum
  difficulty: medium
  estimated_time: 10-15 min
  abstract: 'First encounter. Two teams of three clear side rooms of Sol

    Divisive Vex + Dread. After two waves, find circuit plates +

    conductors and bounce charges between them while picking up

    Pyramidal Resonance. Lock down both conductors → deposit

    resonance in central chest → repeat 2 more times.

    '
  setup: "WHAT YOU SEE\n- Large central room with a chest spawn in the middle.\n- Two doors on opposite\
    \ sides leading to peripheral rooms.\n- Inside peripheral rooms (after they open): glowing floor\n\
    \  plates and a Resonant Conductor (obelisk with glowing core).\n- Above the central area: a fluxing\
    \ **WITNESS HAND** (orange-\n  triangular). It casts Resonant Outburst — a triangular AoE\n  on the\
    \ floor that will kill low-Health players.\n- Top of screen: **Final Shape Looming** wipe timer.\n\
    \nPLATFORM MECHANICS\n- Plates: stand on them only when a charge enters (visible\n  shrinking circular\
    \ aura). Step off after the charge bounces.\n- Conductors: stand a few steps AWAY, shoot the centre\
    \ once\n  to ARM. Then the next charge that arrives at YOUR plate while\n  you stand on it will lock\
    \ down the conductor — consumes 1\n  resonance stack.\n- Resonance stacks: pick up shapes by walking\
    \ onto them. Max 3.\n  Each has a timer; expiring = death.\n\nSTART STATE\n- Encounter starts when\
    \ one player picks up the central\n  Pyramidal Resonance and DUNKS it into the central chest.\n  Two\
    \ side doors open + Final Shape Looming starts.\n"
  callouts:
  - when: Pre-pull
    say: '3-3 split. Left team = [names], right team = [names]. Per side: Conductor = [name], Plate =
      [name], Add-clear = [name].'
    why: Salvation's Edge is the most comms-heavy raid; locking roles before pulling prevents chaos once
      the timer starts.
  - when: Right after the central resonance is dunked
    say: Doors open — go go go, walk in and cover.
    why: Doors open and the wipe timer starts; enemies spawn toward the back of each room, so rushing
      in dies.
  - when: Gatekeeper Hydra appears
    say: Gatekeeper [side] — killing now / door's open.
    why: Killing the Gatekeeper opens the next room. Top priority; the VOD repeatedly calls 'gatekeeper
      dead, door's open, we're good.'
  - when: A new sub-room opens
    say: Room open [top / window / basement / right side].
    why: The open room's position varies each time; the team wastes time if nobody calls where it is ('it
      open top, I found it').
  - when: Overload Minotaur spawns
    say: Overload [side] — on me.
    why: Needs Anti-Overload; make sure the player with the anti-champ mod is on it ('overload on me,
      stay up').
  - when: Threshold Sentinel (Tormentor) spawns mid
    say: Tormentor mid — everyone middle, nuke.
    why: The whole team converges to delete it fast (Tractor + Supers in the VOD); side doors close, so
      don't get caught in a doorway.
  - when: Bouncing charges between plates
    say: Sending / sending back — kill on the way.
    why: This is the core send loop; the plate-runner and conductor coordinate each bounce and announce
      when the cycle is ready to complete ('send back to me one more time, then we kill').
  - when: Picking up / managing stacks
    say: Refresh — I need one, I'm at [N]x.
    why: Players hold max 3; they call their current count so collectors top them off without anyone exceeding
      3 (which kills you) or letting a timer expire.
  - when: Both conductors locked
    say: Both locked — chest mid, deposit, make sure it goes in.
    why: Everyone converges to dump resonance and refresh the timer; confirm it registers by watching
      the buff bar ('make sure it actually goes in').
  - when: Standing under the Witness Hand
    say: Careful — don't be under the hands.
    why: The Resonant Outburst triangular floor AoE kills low-Health players (direct VOD line).
  wipe_triggers:
  - Final Shape Looming timer hits 0 → wipe.
  - Holding 4+ resonance stacks → instant death.
  - Resonance stack timer expires on you → death.
  - Standing in Resonant Outburst (triangular floor AoE) at low Health.
  - Caught in a closing side door when the Threshold Sentinel spawns.
  damage_phase_triggers:
  - No boss DPS in this encounter — completion = depositing all resonance into the central chest 3 times
    in a row.
  parallel_timeline:
  - phase: Pull
    all: Walk into centre. One player picks up the central Pyramidal Resonance + dunks into the chest.
      Doors open + Final Shape Looming starts.
  - phase: Side-room clear (rounds 1-2)
    left_team_3: 'Enter left side. Kill Sol Divisive Vex + Dread. Priority: Hydra (Keeper) → Overload
      Minotaur (Devotee).'
    right_team_3: Mirror on right.
    all_periodically: Don't stand under the Witness Hand (triangular AoE on floor). Avoid the swirling
      indicator.
  - phase: Threshold Sentinel in centre
    all: Side doors close. Converge to centre fast (caught in doors = death). Burn the Tormentor.
  - phase: Plates + conductors discovered
    left_team_3: Conductor player arms the conductor. Plate player bounces charges. Third player handles
      ads + picks up resonance shapes spawning in the side room.
    right_team_3: Mirror.
  - phase: Charges bouncing, resonance collecting
    all: Each plate-runner steps on at the visible aura shrink. Each conductor player picks up max 3 Pyramidal
      Resonance. Subjugator spawns on 2nd missed bounce — kill it immediately.
  - phase: Lock both conductors
    conductor_each_side: Stand on plate when the charge arrives WHILE conductor is armed → 1 stack consumed,
      conductor locks.
  - phase: Deposit at central chest
    all: Converge to chest. Anyone with resonance interacts to dump. Final Shape Looming extends back
      up. Avoid the Witness's Resonant Gaze attack while dumping.
  - phase: Repeat 2 more times
    all: Same flow. After 3rd successful round, encounter ends and stairs unfurl into the next area.
