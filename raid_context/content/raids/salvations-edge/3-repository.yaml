    - No boss DPS phase in Repository. Completion is three successive room lockdowns plus killing the
      Unstoppable Incendior, not a damage check.
    burst_windows: No damage phase; burst priority is the per-side Threshold Sentinel (conductor player
      should land the killing blow for Stolen Favor) and the post-lockdown Unstoppable Incendior.
    recommended_dps:
