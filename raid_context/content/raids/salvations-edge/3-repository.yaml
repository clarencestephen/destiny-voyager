    overview: ''
    setup: ''
    callouts: ''
    damage_phase: ''
  learner_path:
  - '1st clear: any side-pair.'
  - '2nd: Shape Courier (mechanic-light, intent-heavy).'
  - '3rd+: conductor player in any side-pair.'
  plain_language_steps:
  - 1. This encounter is three sequential rooms with overlapping circuit wiring. Keep the same three pairs
    across all rooms and assign a conductor player per side.
  - 2. At the start of each room, read the wire rotation out loud. Room 1 is straight (left to left, mid
    to mid, right to right). Room 2 swaps left and mid. Room 3 rotates everything (left to mid, mid to
    right, right to left).
  - 3. Pull the room. Each pair burns their side's Threshold Sentinel (Tormentor). Pre-assign the conductor
    player on each side to land the KILLING BLOW so they gain Stolen Favor.
  - 4. After the Sentinel dies, Honored Scorpius turrets activate on elevated platforms. Drop them quickly
    with a sniper or heavy, since they fire constantly.
  - '5. The conductor player with Stolen Favor reads their conductor''s required shape and calls it out:
    TRIANGLE (Pyramidal), CIRCLE (Spherical), or CUBE (Hexahedral).'
  - '6. Remember the FIXED shape spawn rule: Hexahedral (cube) only spawns on the RIGHT, Spherical (circle)
    only in the MIDDLE, Pyramidal (triangle) only on the LEFT.'
  - 7. If a conductor needs a shape that doesn't spawn on its side, call a ferry, for example 'Right needs
    cube, grab a triangle from left for me.' Someone walks the shape across.
  - 8. Plate-runners bounce charges between the plates connected by that room's wire rotation. Step on
    at the shrinking aura, step off after the bounce.
  - 9. Collect the correct shape LAST to override any wrong pickups, then arm and lock all three conductors.
    Wrong shape in a conductor is an instant wipe.
  - 10. After the lockdowns, an Unstoppable Incendior spawns. Stun and burn it with Anti-Unstoppable.
  - 11. Dump remaining resonance into the central chest to extend the Final Shape Looming timer and open
    the door to the next room.
  - 12. Repeat for rooms 2 and 3 with their new wire rotations. Clearing room 3 completes the encounter.
  defense:
    incoming_damage:
      adds:
      - Sol Divisive Vex and Dread forces in the rooms
      - Honored Scorpius turrets lay down constant ranged fire from elevated platforms
      boss: []
    champions:
    - Unstoppable Incendior -> Anti-Unstoppable
    recommended_defensive_mods:
      elemental:
      - Resist Solar from the Incendior's fire; prioritize Health for the Witness Hand's wall beam (Wrathful
        Disarray variant)
      concussive:
      - Concussive Dampener helps against the Threshold Sentinel (Tormentor) per side and the Incendior's
        explosive output
  damage:
    surges:
    - No boss DPS phase in Repository. Completion is three successive room lockdowns plus killing the
      Unstoppable Incendior, not a damage check.
    burst_windows: No damage phase; burst priority is the per-side Threshold Sentinel (conductor player
      should land the killing blow for Stolen Favor) and the post-lockdown Unstoppable Incendior.
    recommended_dps:
    - Anti-Unstoppable special or heavy for the Incendior
    - Sniper or heavy to drop Honored Scorpius turrets quickly; burst special for the Tormentors
