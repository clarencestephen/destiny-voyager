  learner_path:
  - '1st clear: any side-pair.'
  - '2nd: Shape Courier (mechanic-light, intent-heavy).'
  - '3rd+: conductor player in any side-pair.'
  plain_language_steps:
  - '1. Know what you''re doing: this is the 3rd encounter of Salvation''s Edge. There is no boss and
    no DPS phase. You clear a symbol-and-conductor puzzle in three rooms in a row to win.'
  - '2. Split into three pairs: one pair per lane (LEFT, MIDDLE, RIGHT). Keep the same pairs across all
    three rooms so callouts stay consistent.'
  - '3. Start the room. Each pair handles its lane: kill that side''s Tormentor, drop the Honored Scorpius
    turrets fast (they never stop shooting), and clear Subjugators as they appear.'
  - 4. Begin the lane sequence with an 'initial' dunk, counted down out loud ('initials in three, two,
    one'). This starts the timer/charge for that lane.
  - '5. Read what shape your conductor needs: TRIANGLE, CIRCLE, or SQUARE (the square is also called ''cube''
    or ''box'').'
  - 6. Collect the matching shape and dunk it into your conductor. There are extra shapes available (the
    team counts about seven symbols with 'always an extra dunk'), so if you lose your shape you can grab
    a replacement.
  - '7. If your lane needs a shape that isn''t sitting in your lane, call a ferry: someone carries the
    right shape over to you. Constantly call out where cubes/triangles/circles are and who is holding
    what.'
  - 8. Grab and dunk your correct shape LAST so a wrong pickup gets overridden. Wrong shape into a conductor
    is an instant wipe.
  - 9. When the Unstoppable champion shows up, stun and kill it fast with your Anti-Unstoppable option.
  - 10. Once all three lanes are locked, the room is cleared and you advance. Repeat the same loop for
    rooms 2 and 3. Finishing room 3 completes the encounter.
  defense:
    incoming_damage:
      adds:
      - Sol Divisive Vex and Dread forces in the rooms
      - Honored Scorpius turrets lay down constant ranged fire from elevated platforms
      boss: []
    champions:
    - Unstoppable Incendior -> Anti-Unstoppable
    recommended_defensive_mods:
      elemental:
      - Resist Solar from the Incendior's fire; prioritize Health for the Witness Hand's wall beam (Wrathful
        Disarray variant)
      concussive:
      - Concussive Dampener helps against the Threshold Sentinel (Tormentor) per side and the Incendior's
        explosive output
  damage:
