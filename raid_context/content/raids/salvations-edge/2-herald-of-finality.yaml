# raid_context/content/raids/salvations-edge/2-herald-of-finality.yaml
# Schema v3 (atomic). v2 mechanics + Phase-2 verified additions. EoF stat names.
# Blank loadout fields = unverified (no guessing).
activity:
  slug: salvations-edge
  name: Salvation's Edge
  activity_type: raid
  fireteam_size: 6
encounter:
  order: 2
  slug: herald-of-finality
  name: Herald of Finality
  difficulty: hard
  estimated_time: 20-30 min
  abstract: 'Boss fight in a triple-circuit arena. 3 teams of 2 across

    left / middle / right sides. Each side has a Trammel

    (Demise / Conflict / Time) — kill yours. Herald summons one

    player from each side to centre via Called to Reckoning;

    they get Stolen Favor from shooting Herald''s head spot

    (after blights around the arena are destroyed). Locks

    conductors with a NEW twist: triangle (Pyramidal) OR circle

    (Spherical) — wrong shape = wipe. Deposit resonance → damage

    phase → repeat.

    '
  setup: "WHAT YOU SEE\n- Triangular arena split into 3 sides: LEFT, MIDDLE, RIGHT.\n- Each side has its\
    \ own circuit plate + Resonant Conductor.\n- Central blight in the middle of the arena — destroy to\
    \ start.\n- Side blights spawn around the arena edges during Called to\n  Reckoning — must be destroyed\
    \ to drop Herald's head shield.\n- **Trammel of Demise** = LEFT side enemy. **Trammel of Conflict**\n\
    \  = MIDDLE. **Trammel of Time** = RIGHT.\n- Witness Hand: floor-based version this time. Resonant\
    \ Seekers\n  (circular swarm) launch at floor targets.\n\nPLATFORM MECHANICS\n- Plates and conductors:\
    \ same as Substratum.\n- NEW — conductor shape requirement: each conductor displays\n  EITHER a triangle\
    \ (needs Pyramidal Resonance) OR a circle\n  (needs Spherical Resonance). Check before locking.\n\
    - Resonance OVERRIDE: the LAST shape you picked up is the one\n  you'll deposit. Pick up the correct\
    \ shape last. Earlier\n  wrong shapes are overridden.\n\nSTART STATE\n- Encounter starts when central\
    \ blight is destroyed → Herald\n  spawns → Final Shape Looming starts.\n"
  callouts:
  - when: Pre-pull, assigning sides
    say: Left pair = [names], middle pair = [names], right pair = [names].
    why: Locks in the 2-2-2 split before the fight; everyone knows their side and which major they own.
  - when: Your side's major / Trammel dies
    say: '[Side] major down.'
    why: First major kill triggers Called to Reckoning; the team needs to know summons are incoming.
  - when: You get Called to Reckoning (pulled to center)
    say: Called - coming to center.
    why: Tells your partner you're leaving the side so they cover the plate/add work.
  - when: Blights appear around the arena edges
    say: Blight [middle/left/right] - break it!
    why: The Herald's head stays shielded until all surrounding blights die; calling positions kills them
      fast. The video flags 'not knowing where blights are' as a top failure point.
  - when: You earn Stolen Favor and read your conductor
    say: '[Side] wants TRIANGLE / wants CIRCLE.'
    why: Only the Stolen Favor holder can see the shape; the pair must grab the matching resonance. Wrong
      shape = wipe.
  - when: Splitting shape collection
    say: I got circle, you grab triangles.
    why: Keeps pickups organized; the locking player must ensure their LAST pickup is the correct shape
      (override rule).
  - when: Sending the first plate pulse
    say: Sending it down - be in place.
    why: The video notes the FIRST pulse reaches the plate faster than later ones; the catcher must already
      be positioned or it fizzles and spawns another major.
  - when: About to lock a conductor with a suspect shape
    say: WAIT - don't dunk!
    why: Last-chance call before an instant-wipe wrong-shape lock; the player can walk to the correct
      shape spawn to override.
  - when: All three conductors locked
    say: All locked - deposit at the back box.
    why: Box spawns under the Witness's hands at the very back; everyone deposits to extend the timer
      and clear leftover resonance.
  - when: DPS window opens
    say: Edges glowing - DPS, use supers.
    why: Arena edges glow when the Herald is damageable; coordinate burst and debuffs.
  - when: Herald hits Final Stand
    say: FINAL STAND - ~30 seconds, ignore everything, dump on Herald.
    why: He goes briefly immune then gives ~30s; the only goal is finishing him before the timer ends.
  wipe_triggers:
  - WRONG shape resonance in a conductor → instant wipe.
  - Final Shape Looming timer expires.
  - Called team killed by Herald in centre → 'celebrate your failure' → wipe.
  - Final Stand timer expires.
  - Standing in Resonant Seekers (floor swarm) without dodging.
  damage_phase_triggers:
  - All 3 conductors locked + all resonance deposited at the vista chest → arena edges glow → Herald damageable.
  parallel_timeline:
  - phase: Pull
    all: Move to assigned side (left / mid / right). Destroy the central blight.
  - phase: Trammel + add wave
    left_pair: Kill Ravenous Taken Knights, Attendants, Trammel of Demise.
    middle_pair: Same with Trammel of Conflict.
    right_pair: Same with Trammel of Time.
  - phase: First Trammel dies → Called to Reckoning
    called_guardians_3: One player from each side summoned to centre. Move there.
    side_remaining_3: Cover your partner's work back on your side.
  - phase: Centre — destroy blights, gain Stolen Favor
    called_guardians_3: Kill arena-edge blights around Herald. Then shoot Herald's head spot. Get Stolen
      Favor.
    side_remaining_3: Continue add-clear, prep for plate bouncing.
  - phase: Reading conductors + bouncing charges
    called_guardians_3: Return to your side. Read the conductor's shape (triangle or circle). Call out
      to your partner.
    side_remaining_3: Bounce charges between plates. Collect the correct shape last.
  - phase: Lockdown + deposit
    all: Lock 3 conductors with correct shapes. Converge at vista chest. Dump resonance.
  - phase: Damage phase
    all: Arena edges glow. Burst-DPS the Herald.
  - phase: Loop / Final Stand
    all: Repeat until Herald reaches Final Stand. Timer drops to 30s + all Trammels spawn. Ignore Trammels;
      delete Herald.
  permutations:
