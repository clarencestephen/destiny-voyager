  plain_language_steps:
  - '1. Before the pull, split into three pairs: LEFT, MIDDLE, and RIGHT (sides are named as you LOOK
    at the Herald). Put your strongest/most mobile players on the trickier sides.'
  - 2. Shoot the blight in the CENTER of the arena. This spawns the Herald and starts the Final Shape
    Looming wipe timer.
  - 3. On each side, clear the Taken adds and kill your side's big gold-bar major (MIDDLE = large Phalanx,
    LEFT = Wizard, RIGHT = Ogre).
  - '4. The first major kill triggers Called to Reckoning: one player from each side is yanked to the
    CENTER. Call ''Called'' and go; your partner covers your side.'
  - 5. In the center, destroy all the blights that spawn around the arena (usually two at a time) to drop
    the shield over the Herald's head.
  - '6. A Called player shoots the Herald''s head: a blight pops, shoot the head again and the head opens,
    converting your buff to STOLEN FAVOR. Do NOT die in the center or it wipes the team.'
  - '7. Return to your side. Use Stolen Favor to READ your conductor''s shape: TRIANGLE means you need
    Pyramidal Resonance, CIRCLE/SPHERE means you need Spherical Resonance. Call it out clearly.'
  - 8. The partner bounces (ping-pongs) the plate charge to generate resonance; aim for three. Collect
    the CORRECT shape LAST, because the last shape you pick up is the one you deposit.
  - '9. Lock all three conductors: while the plate is active and the resonance is travelling, shoot the
    pillar with the correct shape, then step on the plate. It glows GOLD when correct. WRONG shape = instant
    wipe, so confirm first.'
  - 10. With all three locked, everyone converges and deposits resonance into the box at the very BACK
    of the arena (under the Witness's hands). Clear ALL your resonance so a leftover doesn't kill you.
    This extends the timer.
  - 11. The arena edges glow and the Herald is damageable. Burst him down.
  - 12. Repeat the loop. When the Herald reaches Final Stand he goes briefly immune, then you get about
    30 seconds to finish him. Ignore everything else and delete him.
