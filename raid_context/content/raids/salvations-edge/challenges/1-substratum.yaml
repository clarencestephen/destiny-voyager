encounter:
  order: 1
  slug: substratum
  name: Substratum
  abstract: 'First encounter. Two teams of three clear side rooms of Sol

    Divisive Vex + Dread. After two waves, find circuit plates +

    conductors and bounce charges between them while picking up

    Pyramidal Resonance. Lock down both conductors → deposit

    resonance in central chest → repeat 2 more times.

    '
  master_challenge:
    name: Scenic Route
    requirement: 'Only kill the Overload Minotaur on the LONGER of the two paths

      (the one with the Overload spawn in the 4th room, not the 3rd).

      Read which path is yours by checking the majors in the first

      rooms: Hobgoblins = your path will kill, Attendants = ignore.

      Master adds no Champion spawns beyond the existing path

      Minotaurs.

      '
    enforced_on: Master only
differs_from_base: 'Adds the ''Scenic Route'' constraint on top of the normal encounter: Only kill the
  Overload Minotaur on the LONGER of the two paths

  (the one with the Overload spawn in the 4th room, not the 3rd).

  Read which path is yours by checking the majors in the first

  rooms: Hobgoblins = your path will kill, Attendants = ignore.

  Master adds no Champion spawns beyond the existing path

  Minotaurs. On Master, every encounter''s challenge is active simultaneously, plus Champions, surges/threat,
  and Adept loot.'
