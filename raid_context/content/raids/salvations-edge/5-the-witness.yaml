    - 'Damage phase: feet on the ground, move diagonally against each telegraph, jump only on the ground
      slam. When the chest glows WHITE and the Witness pulls back, squeeze a couple shots then get OFF
      the plate before the slam.'
    - Repeat until Final Stand; dump supers + heavy in the one short window.
