  boss_strategies:
  - name: Standard 4 Add-Clear / 2 Runners (split-side arena hold)
    summary: 'The most-recommended normal split: 4 players clear adds (two per side of the V-shaped arena),
      2 dedicated Runners do the entire read-collect-break-cleanse loop on the hands and chest glyphs.
      Lowest-chaos setup for a typical 6-stack.'
    steps:
    - Pre-pull, assign 2 Runners and 4 Add-clear. Put two add-clear on the Light side and two on the Darkness
      side of the V arena.
    - 'Approach the Witness platform to start. Three hands open: SKY hand (triangle floor traps / Pyramidal),
      FLOOR hand (circular ''bees'' mortar / Spherical), SIDE hand (horizontal laser / Hexahedral-square).'
    - 'Runner step 1: pick a hand, dip into its telegraphed attack zone and shoot the wrist ARMBAND. It
      lights one of two colors (never its own): GREEN = you need Pyramidal/triangle, YELLOW(orange) =
      Spherical/circle, RED = Hexahedral/square.'
    - 'Runner step 2: go stand in the DIFFERENT hand''s attack zone whose shape matches the color until
      you hear the loud drone (~2-3s) to pick up that resonance. For the sky-triangle zone, stand just
      inside a corner, never the center (center one-shots).'
    - 'Runner step 3: return to the first hand, dip into its telegraph again and shoot the armband. The
      hand explodes and you gain Glyphbreaker.'
    - Carry Glyphbreaker to the central plate and shoot a chest glyph; this breaks a glyph AND cleanses
      resonance from everyone standing on/near the plate.
    - Runners alternate which hand types they break (don't break the same hand repeatedly or the Witness
      spawns extra hands) and try to break two glyphs at nearly the same time to limit Subjugator spawns
      to one or two.
    - Add-clear hold both sides, kill Screebs/Weavers and especially Subjugators (they bow on spawn =
      free big damage), and keep Runners safe. Anyone who accidentally grabs essence drops to the plate
      when a glyph breaks to cleanse.
    - On 'The Witness tests you' (gold-glowing hand / high-pitch scream), the Runner who last broke a
      hand calls the shape; team draws it, then everyone jumps when the Witness's eyes flash and it pushes
      its hands forward (ground wave).
    - On the 5th glyph, whole team pre-converges to the central plate. 6th glyph breaks -> plate rises
      -> damage phase.
    - 'Damage phase: keep feet on the ground, move diagonally against each telegraph (usually right-then-left
      or left-then-right), jump only on the glowing-eyes ground slam. When the Witness''s chest glows
      WHITE and it pulls back, squeeze a couple shots then get OFF the plate before the slam.'
    - Repeat until Final Stand; dump supers + heavy in the short window.
    best_for: Most normal 6-player teams, first clears, and teams whose add-clear is shaky — minimizes
