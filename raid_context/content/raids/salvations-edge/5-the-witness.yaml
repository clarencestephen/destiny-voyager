    damage_phase: ''
  learner_path:
  - '1st clear: add-clear. Learn the rhythm of hand attacks + spike tests.'
  - '2nd: glyphbreaker-side (Wrathful Disarray is the easiest beam to dodge).'
  - '3rd: glyphbreaker-sky or glyphbreaker-floor.'
  plain_language_steps:
  - '1. Pre-pull, assign 3 Glyphbreakers and 3 Add-clear. Give each Glyphbreaker a permanent hand: one
    owns the SKY hand, one the FLOOR hand, one the SIDE hand.'
  - '2. Approach the Witness''s platform to start the encounter. The Final Shape Looming timer begins
    and the Witness opens its three hand attacks: Resonant Outburst (sky, triangle floor AoE), Resonant
    Seekers (floor, circle swarm), and Wrathful Disarray (side, horizontal beam).'
  - '3. Each Glyphbreaker reads their hand''s armband colour: green needs Pyramidal, yellow needs Spherical,
    red needs Hexahedral. Call it out so the team knows what to gather.'
  - '4. Critical rule: a hand''s armband never matches the resonance it spawns itself. To break a hand
    you must collect resonance by standing in a DIFFERENT hand''s attack zone for about 2 seconds, never
    the one in front of you.'
  - 5. With the matching resonance, return to your hand's attack zone and shoot its armband. The hand
    explodes and you gain the Glyphbreaker buff.
  - 6. Take that buff to the central organic platform and shoot one of the Witness's six chest glyphs.
    This cleanses your resonance and removes a glyph. Cleanse before your resonance timer kills you.
  - 7. Add-clear players hold the arena against the Scorn the whole time and keep Glyphbreakers alive
    while they stand in attack zones collecting resonance.
  - 8. When a Spike test triggers ('The Witness tests you...' appears), read the LAST destroyed hand's
    shape and destroy the pyramid spikes in the matching pattern (triangle, circle, or square). On failure,
    jump to avoid the ground-energy wave.
  - 9. Repeat the read-collect-break-cleanse loop across multiple rotations until five glyphs are broken.
    The whole team should pre-converge to the central platform.
  - 10. When the sixth glyph breaks, the central organic platform rises and the Witness's heart opens.
    Burst-DPS while constantly moving to dodge Resonant Outburst and Wrathful Disarray; use the directional
    callouts and jump on cue.
  - 11. When the Witness slams the central plate to end the phase, get off the plate immediately or you
    die.
  - 12. Repeat until Final Stand. There is only one tight DPS window left, so dump supers and heavies
    the moment it opens, or wipe.
  defense:
    incoming_damage:
      adds:
      - Scorn faction forces deal Arc and physical damage throughout the arena
      - Subjugators (Dread) appear on Master per the Coordinated Efforts pairing
      boss:
      - 'The Witness hand attacks: Resonant Outburst (triangular floor AoE), Resonant Seekers (circular
        swarm), Wrathful Disarray (horizontal beam), plus the Spike-test ground-energy wave'
    champions: []
    recommended_defensive_mods:
      elemental:
      - Resist Arc from Scorn; keep high Health so Wrathful Disarray's beam and the Resonant Outburst
        don't one-shot Glyphbreakers standing in zones
      concussive:
      - Concussive Dampener helps survive the Witness's combined beam and ground-energy attacks during
        DPS and the Spike-test wave
  damage:
    surges:
    - DPS phase opens once all 6 chest glyphs are broken and the central plate rises. The Witness's element
      is not specified, so match your Surge to your strongest burst weapon.
    burst_windows: Damage window opens when the 6th glyph breaks and the central organic platform rises;
      you get roughly three hand-attack pairs before the Witness slams the plate. Final Stand is one last
      tight window.
    recommended_dps:
    - 'Burst-heavy: Two-Tailed Fox, Sleeper, Apex Predator, or a rocket-and-sword swap'
    - Pre-save supers and heavy ammo for the Final Stand single window
    - 'Still Hunt (exotic Solar sniper) + Celestial Nighthawk — the top-recommended DPS option. Nighthawk
      supercharges both the Golden Gun super and Still Hunt''s Nighthawk shot for big single-hit damage
      while letting you keep moving to dodge the plate attacks. Cross-confirmed: Shadow Destiny calls
      it ''very clearly the top damage option''; pairs with Hunter Golden Gun. Pre-save the super + special
      ammo for Final Stand.'
    - Triple Tap / Fourth Times the Charm heavy sniper + Rockets — sustained burst that works on any class
      and frees a super slot. Shadow Destiny recommends a 4TTC sniper alongside rockets; the authored
      YAML lists generic burst-heavies (Two-Tailed Fox, Sleeper, Apex Predator, or a rocket-and-sword
      swap). Good for teams without Still Hunt.
    - 'Titan: Twilight Arsenal super + sniper/rockets — Shadow Destiny''s recommended Titan setup; Twilight
      Arsenal axes for burst plus a triple-tap/4TTC sniper and rockets for the rest of the window. Banner
      Shield is also called out as the best damage-phase shot-caller because it tanks everything except
      the ground slam.'
    - 'Warlock: Song of Flame (radiance) + same sniper/rocket burst — Shadow Destiny notes Well isn''t
      really needed here, so radiance/Song of Flame is favored for bonus damage resistance and ability
      uptime; pair with the sniper-and-rocket burst.'
    - Divinity (exotic Trace Rifle) on one player — confirmed by Shadow Destiny for opening a large crit
      cage, good ammo economy, and add-clear utility; have one teammate run it to boost the whole team's
      DPS into the chest. A weaken via Deterministic Chaos was also used effectively by True Vanguard
      during Final Stand.
