  learner_path:
  - '1st clear: add-clear. Learn the rhythm of hand attacks + spike tests.'
  - '2nd: glyphbreaker-side (Wrathful Disarray is the easiest beam to dodge).'
  - '3rd: glyphbreaker-sky or glyphbreaker-floor.'
  plain_language_steps:
  - '1. Before pulling, split the 6 players. The two most-used setups are: 2 Runners + 4 add-clear (lowest
    chaos), or 3 Glyphbreakers (one per hand) + 3 add-clear (faster). Add-clear takes a side of the arena
    each.'
  - '2. Approach the Witness''s platform to start. The Final Shape timer begins and the Witness opens
    its three hands: SKY = triangle floor traps (Pyramidal), FLOOR = circular ''bees'' swarm (Spherical),
    SIDE = horizontal beam (Hexahedral/square).'
  - '3. A Runner dips into a hand''s attack zone and shoots its wrist ARMBAND to read the color: GREEN
    = need triangle, YELLOW/orange = need circle, RED = need square. Call the color out loud.'
  - '4. Critical rule: a hand''s armband never matches its own shape. Go stand in a DIFFERENT hand''s
    zone (the one whose shape matches the color you read) for about 2-3 seconds until you hear the loud
    drone — that gives you the resonance.'
  - 5. Carry the resonance back to the first hand, dip into its telegraph again, and shoot the armband.
    The hand explodes and you gain the Glyphbreaker buff.
  - 6. Take Glyphbreaker to the central plate and shoot one of the Witness's six chest glyphs. The glyph
    disappears and your resonance is cleansed. Cleanse BEFORE the resonance timer kills you — holding
    it too long is a one-shot.
  - 7. Add-clear players hold both sides of the arena the whole time, kill the Scorn and the Subjugators
    (which bow on spawn = free damage), and keep the Runners alive while they stand in zones.
  - 8. When 'The Witness tests you...' appears (gold-glowing hand / scream), the player who last broke
    a hand calls the shape; the team destroys the pyramid spikes in that matching pattern (triangle /
    circle / square). Then when the Witness's eyes flash and it pushes its hands forward, EVERYONE jumps
    to survive the ground wave.
  - 9. Repeat the read-collect-break-cleanse loop. Vary which hands you break and break glyphs roughly
    two-at-a-time to limit extra spawns. On the 5th glyph, the whole team pre-converges to the central
    plate.
  - 10. When the 6th glyph breaks, the central plate rises and the Witness becomes vulnerable. Burst it
    down while moving to dodge the floor AoE and beam; jump on the ground-slam tell.
  - 11. The Witness ends the phase by slamming the central plate (chest glows white, pulls back) — get
    OFF the plate immediately or it kills/launches you.
  - 12. Repeat until Final Stand. There is only one last short window — dump all supers and heavy ammo
    (save Golden Gun / Celestial Nighthawk / Still Hunt for this) or you wipe.
  defense:
    incoming_damage:
