  role_breakdown:
  - role: Runner / Glyphbreaker A
    count: 1
    does: First of the two dedicated Runners (covers the sky and one other hand in the 2-Runner split,
      or owns the SKY hand in the 3-Glyphbreaker split). Dips into a hand's telegraph, shoots the armband
      to read its color, grabs the matching resonance from a DIFFERENT hand's zone (for the triangle/sky
      zone stand in a corner, never the center — center one-shots), returns to break the hand for Glyphbreaker,
      then shoots a chest glyph at the central plate to cleanse and remove a glyph. Mixes up which hands
      get broken and cleanses before the resonance timer kills them.
  - role: Runner / Glyphbreaker B
    count: 1
    does: Second Runner (covers floor and side in the 2-Runner split, or owns the FLOOR hand in the 3-Glyphbreaker
      split). Same read-collect-break-cleanse flow. Tries to break a chest glyph at nearly the same time
      as Runner A so only one or two Subjugators spawn instead of four. Often the one who last broke a
      hand, so calls the shape on the test.
  - role: Add-clear (Light side)
    count: 1
    does: Holds one side of the arena. Kills Scorn, Screebs and Weavers, and one-shots Subjugators during
      their spawn-in bow (free damage). Keeps Runners alive while they stand in attack zones. Drops to
      the plate to cleanse if they accidentally grab essence.
  - role: Add-clear (Darkness side)
    count: 1
    does: Mirror of the other add-clear on the opposite side. Suppresses Subjugators, clears Weavers/Screebs,
      and keeps the side clear so Runners aren't yanked or blasted while collecting resonance.
  - role: Add-clear / shot-caller (flex)
    count: 1
    does: Floating add-clear who doubles as the damage-phase shot-caller — calls the diagonal dodge direction
      and the jump on the ground-slam tell (eyes flash, hands push forward). A Banner Shield Titan works
      well here since it survives everything except the ground wave.
  - role: Add-clear / 6th player (or 3rd Glyphbreaker)
    count: 1
    does: In the 2-Runner / 4-add-clear split this is the 4th add-clear, reinforcing whichever side is
      heavier and helping suppress Subjugators. In the 3-Glyphbreaker split this player instead owns the
      SIDE hand (Wrathful Disarray beam — easiest to dodge, recommended learner Glyphbreaker role) and
      runs the full read-collect-break-cleanse loop.
  needs_clarification:
  - The Witness's damage-phase element is not specified in any source, so DPS Surge is recommended generically
    (match to your strongest burst weapon) rather than a confirmed element.
  - Exact resonance/essence timer duration and max stack count before death are not given numerically
    — sources only confirm it is a hard timer that one-shots and that you cleanse at a chest glyph.
  - Exact number of damage phases to reach Final Stand on regular difficulty isn't fixed in the sources
    (depends on DPS; teams report ~2-3 phases). The Aztecross run pushed for quick phases but the precise
    breakpoint isn't stated.
  - Whether the spike/shape test always matches the LAST destroyed hand vs the current attacking hand
    is described slightly differently across sources (authored YAML says last-destroyed hand; Aztecross
    only notes 'it does the thing the same way every time'). Treat 'shape of the most recent hand' as
    the working rule and confirm in-run.
  - Subjugator/Tormentor spawn rules tied to breaking the same hand repeatedly or spacing glyph breaks
    are described qualitatively (stagger ~two glyphs at a time) but exact spawn thresholds are not pinned
    down.
  - All DPS loadouts are current-meta only — a 6/9 sandbox change is coming, so exotics and burst weapons
    (Still Hunt, Celestial Nighthawk, Two-Tailed Fox, Divinity, Twilight Arsenal, etc.) must be re-verified
    for the new meta before a serious run.
  - Master/contest modifiers (e.g., the Dread Subjugator pairing) are only lightly referenced; this guide
    targets the REGULAR 6-player version, so Master-specific add composition should be verified separately.
