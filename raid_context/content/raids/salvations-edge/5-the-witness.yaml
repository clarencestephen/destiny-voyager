  boss_roles:
  - role: Glyphbreaker / Runner (sky hand)
    count: 1
    does: Owns the SKY hand (Resonant Outburst, triangle floor traps / Pyramidal). Dips into its telegraph,
      shoots the armband to read its color, grabs the matching resonance from a DIFFERENT hand's zone
      (corner of the triangle zone, never center), returns to break the sky hand for Glyphbreaker, then
      shoots a chest glyph at the central plate to cleanse and remove a glyph. Mixes up which hands get
      broken; cleanses before hitting 4 essence stacks.
  - role: Glyphbreaker / Runner (floor hand)
    count: 1
    does: Owns the FLOOR/ground 'tree' hand (Resonant Seekers, circular 'bees' mortar / Spherical). Same
      read-collect-break-cleanse flow. Tries to break a chest glyph at nearly the same time as the other
      Runner so only one or two Subjugators spawn instead of four. (In the 4-add-clear/2-Runner plan this
      and the sky role are the two Runners who cover all three hand types between them.)
  - role: Glyphbreaker / Runner (side hand)
    count: 1
    does: Owns the SIDE hand (Wrathful Disarray, horizontal laser / Hexahedral-square). Easiest beam to
      dodge, so it is the recommended first Runner role for a learner. Same flow; calls the shape on 'The
      Witness tests you' since the Runner who last broke a hand knows which shape to draw.
  - role: Add-clear / arena hold (Light side)
    count: 1
    does: Holds the Light-themed side of the V arena. Kills Scorn, Screebs and Weavers (a nasty combo)
      and one-shots Subjugators while they do their spawn-in bow (free damage). Keeps Runners alive and
      uncovers nothing they need to grab. Can drop to the plate to cleanse accidental essence when a glyph
      breaks.
  - role: Add-clear / arena hold (Darkness side)
    count: 1
    does: 'Mirror of the Light-side add-clear on the Darkness side. Same job: suppress Subjugators, keep
      the side clear so Runners aren''t yanked by Weavers or blasted by Screebs while standing in attack
      zones.'
  - role: Add-clear / shot-caller (flex)
    count: 1
    does: Floating add-clear who doubles as the damage-phase shot-caller, calling the diagonal dodge direction
      and the jump on the ground-slam tell (eyes flash, hands push forward). A Banner Shield Titan works
      well here because it survives everything except the ground wave. In the 3-Glyphbreaker plan this
      slot is folded into add-clear; in the 4/2 plan this is the 4th add-clear and primary caller.
  mechanics:
  - 'Arena and target: a wide circular/V-shaped arena. The Witness stands at the back wall with 6 GLYPHS
    arranged across its chest. A central organic plate in the middle rises during damage phase.'
  - 'Three HANDS are active at once, each a distinct attack you read by its motion: SKY hand = Resonant
    Outburst (triangle-shaped floor AoE traps), FLOOR/ground hand = Resonant Seekers (circular ''bees''
    swarm/mortar), SIDE hand = Wrathful Disarray (horizontal beam/laser). In the Aztecross run these are
    called out as ''walls,'' ''bombs,'' and ''pyramids'' by their on-screen color.'
  - 'Each hand has a glowing ARMBAND that lights one of two colors (never its own shape''s color): GREEN
    = need Pyramidal/triangle resonance, YELLOW(orange) = need Spherical/circle resonance, RED = need
    Hexahedral/square resonance.'
  - 'Same-color trap: a hand''s armband NEVER matches the resonance that hand itself spawns. The SKY hand
    (spawns Pyramidal/triangle) won''t show green; the FLOOR hand (spawns Spherical/circle) won''t show
    yellow; the SIDE hand (spawns Hexahedral/square) won''t show red. So to break a hand you must always
    grab resonance from a DIFFERENT hand''s zone.'
  - 'Collect resonance: stand in a hand''s telegraphed attack zone for about 2-3 seconds until you hear
    a loud drone, then you hold that resonance/essence. Carrying resonance has a timer that KILLS you
    if you don''t cleanse it (the Aztecross team repeatedly warns ''careful stasis, it will one-shot you'').'
  - 'Break a hand: with the matching resonance, return to the target hand''s attack zone and shoot its
    armband. The hand explodes and you gain the GLYPHBREAKER buff.'
  - 'Cleanse + remove a glyph: carry Glyphbreaker to the central plate and shoot one of the Witness''s
    6 chest glyphs. The glyph disappears AND your resonance is cleansed (also cleanses essence on anyone
    near the plate). All 6 glyphs must be broken.'
  - 'Spike/shape test (''The Witness tests you...'' / gold-glowing hand + high-pitch scream): pyramid
    spikes spawn and the team must destroy them in a pattern matching the LAST destroyed hand''s shape
    (triangle / circle / square). The Aztecross team notes ''it does the thing the same way every time.''
    On the follow-up ground-energy wave (Witness eyes flash, hands push forward) EVERYONE must jump or
    be killed — Aztecross repeatedly calls ''jump'' and ''everyone can dodge.'''
  - Breaking the same hand repeatedly, or breaking glyphs too far apart, spawns extra hands / extra Subjugators
    (Tormentor-like enemies). Stagger glyph breaks (roughly two at a time) to keep spawns down.
  - 'Damage phase: all 6 glyphs broken -> central plate rises -> Witness''s heart/chest opens and it becomes
    vulnerable. You get roughly three hand-attack pairs of DPS while constantly moving to dodge Resonant
    Outburst + Wrathful Disarray, then the Witness slams the central plate (chest glows white, pulls back)
    to end the phase — get OFF the plate or die.'
  - 'Final Stand: after enough damage phases the Witness goes briefly immune, then opens for ONE last
    tight DPS window. There is no second window — dump supers and heavy here (Aztecross saves Celestial
    Nighthawk / Still Hunt specifically for final). The story ''final mission'' that plays after is a
    cinematic encore, not part of the regular raid boss fight.'
