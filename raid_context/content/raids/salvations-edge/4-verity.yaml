  learner_path:
  - '1st clear: Outside (no time pressure, more logical work).'
  - '2nd: Inside, but ONLY after coaching on the ''don''t form your own shape'' rule.'
  - '3rd+: try the Selection Trick to pre-pin yourself into your strongest role.'
  plain_language_steps:
  - 1. SPLIT. One person interacts with a statue at the back of the room to start it. Three random players
    are pulled INSIDE into their own private rooms; the other three stay OUTSIDE in the main room. Everyone
    must know both jobs because the split is random.
  - 2. INSIDE - READ AND CALL. Look at the three statues in your room, each holding a flat shape (circle,
    triangle, or square). Read them left-to-right and call that out (e.g. 'triangle, circle, square')
    so the outside team can start. Note which statue is YOURS - that shape is the one you must never end
    up holding.
  - 3. INSIDE - KNOW YOUR TARGET. Your escape key is the 3D shape made from the TWO shapes your statue
    does NOT hold. (If your statue holds a triangle, you need circle + square = cylinder.)
  - '4. INSIDE - TRADE SHAPES. Kill the Splintered Curator Knights to drop shapes. Easiest method: first
    collect two copies of your OWN statue''s shape, then gift one of each to your two teammates (deposit
    onto THEIR statue, never your own). Then your teammates send you back the two shapes you actually
    need.'
  - 5. INSIDE - COMBINE AND LEAVE. When you hold the two shapes that are NOT your statue's shape, they
    fuse into your 3D key. Only build this final key AFTER you have finished sending everyone else what
    they need. Then walk out through the glass wall - but only once the outside statue for you shows the
    same 3D shape.
  - 6. OUTSIDE - LISTEN AND PLAN. Take the left-to-right call from inside. Each back statue must be made
    to hold the two shapes its inside statue does NOT hold. Plan all the swaps before touching anything.
  - 7. OUTSIDE - DISSECT. Kill the outside Knights for the three shapes. Put a shape into a statue to
    mark it to give that shape up; put another shape into a second statue, and the two statues swap. Keep
    swapping until every statue shows the correct 3D shape. Two players clear ads and stun Ogres while
    you work.
  - 8. GHOST PHASE 1. The Witness wipes the inside team on purpose. Dead players see an inverted room
    and can see one teammate in their correct spot - call it out by their look. Living players carry each
    ghost to the matching empty pedestal at the entrance. Wrong pedestal = instant death, so trust the
    dead players' calls.
  - 9. REGROUP AND FIGHT. After inside players walk back out and everyone reunites at the rally banner,
    kill the add wave including two Unstoppable Ogres (bring an anti-Unstoppable option). The Witness
    then wipes five players, leaving one, for a second ghost-placement sequence - take your time, you
    have about a minute.
  - 10. REPEAT. Do the full cycle three times. After the third successful round the chest spawns and you
    are finished. There is no boss.
