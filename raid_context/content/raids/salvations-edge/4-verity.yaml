encounter:
  order: 4
  slug: verity
  name: Verity
  difficulty: hard
  estimated_time: '30-60 min (first clears: 1-2 hours)'
  abstract: 'The infamous shape-puzzle encounter. Team splits into INSIDE (3

    trapped in alternate realm) and OUTSIDE (3 in main realm).

    Inside reads 2D shapes (their statue holds one) and passes

    shapes between Inside teammates to escape with a 3D KEY that

    does NOT contain their own shape. Outside swaps 3D shapes

    between Inside teammates'' statues so the final shapes match.

    One full round = both teams done correctly. 3 rounds = win.

    '
  setup: "WHAT YOU SEE\n- 6 STATUES of each player at the entrance — exact loadouts and\n  Ghosts. **This\
    \ is why teams must be visually distinct.**\n- 3 GLOWING STATUES deeper in the room (these are the\
    \ inside\n  statues that hold shapes).\n- A PROJECTOR SCREEN behind the glowing statues, fluxing between\n\
    \  2D shapes: circle, square, triangle.\n- **Imminent End** wipe timer (3:30).\n\nPLATFORM MECHANICS\n\
    - There is NO platform stepping in Verity. Movement is about\n  positioning for the Inside/Outside\
    \ split.\n- **Selection trick:** standing in the half of the room CLOSER\n  to the wall of shattered\
    \ glass before the encounter starts =\n  guaranteed Inside. The other 4 stand near the 6 statues;\
    \ one\n  gets randomly picked Inside.\n- Inside team: trapped in their own bubble realm. Each player\n\
    \  sees their own statue + 2 teammates' statues from inside.\n  They can ONLY interact with their\
    \ own realm's knights and\n  shapes.\n- Shapes you HOLD persist on your character until you deposit\n\
    \  them on another Guardian's statue (Inside) or swap them\n  between statues (Outside).\n- **Catatonic\
    \ Decimation freeze:** when one Inside team escapes,\n  the others are frozen. Outside team must retrieve\
    \ their\n  Ghosts and deposit on the correct frozen statue to revive.\n\nSTART STATE\n- Encounter\
    \ starts when 3 players interact with the glowing\n  statues. RNG (or selection-trick) decides Inside/Outside.\n"
  callouts:
  - when: Before pulling
    say: '''Confirm everyone has a distinct helmet/shader/cloak and a unique ghost shell.'''
    why: Both the ghost-revive phases require telling Guardians apart from their look; same-class same-shader
      teams cannot read who is on which pedestal.
  - when: Inside players just teleported in
    say: '''Inside order left-to-right: [shape], [shape], [shape]'' (e.g. ''triangle, circle, square'').'
    why: 'Both sources: the outside team cannot compute its dissection targets without the inside statues''
      shapes, and any inside player can make the call since all see the same order.'
  - when: Inside player sends a shape
    say: '''[Name], sending you a [shape].'''
    why: Inside players can only deposit onto teammates' statues; clear targeting prevents duplicate or
      missed handoffs, and the receiver knows an Ogre is about to spawn in their room to kill.
  - when: Inside player is ready to leave
    say: '''[Name] has [shape]+[shape], walking out'' - but only after sending everyone else what they
      need.'
    why: Building your final key before you've finished distributing forces messy re-trades; and you must
      confirm your outside statue matches before stepping through the glass.
  - when: Witness wipes the inside team (ghost phase)
    say: 'Dead players: ''[Name] (the [distinctive look]) is on pedestal [N].'''
    why: Only the dead can see teammates' correct spots in the inverted view; the living place ghosts
      off these calls, and a wrong pedestal instantly kills the placer.
  - when: Between rounds at the rally banner
    say: '''Two Unstoppable Ogres incoming - stun them.'''
    why: Both sources flag the two Unstoppable Ogres; without an anti-Unstoppable option they cannot be
      efficiently killed to progress the add wave.
  - when: After the third full round
    say: '''Third round done - chest is up, we''re clear.'''
    why: The encounter ends after three rotations with no boss; the chest spawning confirms completion.
  wipe_triggers:
  - Imminent End timer expires.
  - Inside player forms a 3D key containing their statue's shape → escape impossible → must die + respawn.
  - Outside player deposits a Ghost onto the WRONG Guardian's statue → instant death + cascading failure.
  - All Inside players Catatonically Decimated + no Outside survivor → wipe.
  damage_phase_triggers:
  - No boss DPS. Completion = 3 rounds of correct shape dissection + Catatonic revival.
  parallel_timeline:
  - phase: Pull
    all: Activate the 3 glowing statues. RNG (or selection-trick) splits Inside (3) and Outside (3).
  - phase: Inside team reads
    inside_team: Read your own statue + 2 teammate statues. Call out the order left-to-right.
    outside_team: Listen. Note the Inside shapes.
  - phase: Inside shape collection (round 1)
    inside_team: Kill Splintered Curator Knights to drop the projector-screen shape. Pick up shape. Deposit
      on an Inside teammate's statue (NEVER your own, NEVER already-served).
    outside_team: Kill 3 Knights on your side to access all 3 shapes. Begin dissection — swap shapes between
      Inside statues. Plan ahead.
  - phase: Inside escape with 3D key
    inside_team: Once you hold 2 shapes that are NOT your statue's shape, form a 3D key. Walk through
      the glass wall.
    outside_team: Continue dissection until Inside statues reflect the correct outside shape compositions.
  - phase: Catatonic Decimation freeze
    all: When Inside escapes, all but one player freezes. Three Ghosts appear on the Outside. Survivor
      + frozen-spectators coordinate Ghost-to-statue.
  - phase: Revival
    frozen_players: Spectate, guide survivor to correct statues.
    survivor: Pick up each Ghost, deposit on the correct statue. WRONG statue = death.
  - phase: Add wave between rounds
    all: Grim, Thrall, 2× Unstoppable Ogres. Anti-Unstoppable mandatory.
  - phase: Repeat rounds 2 + 3
    all: Same flow. After round 3 — lift to Witness encounter activates.
