  learner_path:
  - '1st clear: Outside (no time pressure, more logical work).'
  - '2nd: Inside, but ONLY after coaching on the ''don''t form your own shape'' rule.'
  - '3rd+: try the Selection Trick to pre-pin yourself into your strongest role.'
  plain_language_steps:
  - '1. SPLIT. Three players get trapped INSIDE solo Verity rooms; three stay OUTSIDE in the main realm.
    (Use the selection trick if you want to pick: standing against the shattered-glass wall before the
    pull guarantees Inside.)'
  - 2. INSIDE — OBSERVE. Look at the 2D shape YOUR statue is holding (circle, square, or triangle). That
    is the ONE shape you must NEVER give yourself. Then read the two shapes on your backboard. Call your
    statue's shape out loud, left-to-right, so Outside can plan.
  - 3. INSIDE — get your shapes. Kill the Splintered Curator Knights in your room to drop the projector's
    2D shapes. You are building a 3D escape KEY from the two shapes your statue is NOT holding.
  - '4. INSIDE — PAIR, then SHARE. Deposit any shape onto a TEAMMATE''S statue (never your own). Per the
    infographic: first PAIR mismatched backboard shapes to their statue, then once at least two of you
    have matching shapes, SHARE them around left-to-right so everyone ends up holding the two shapes their
    statue does NOT hold.'
  - '5. INSIDE — COMBINE and escape. When you hold the two shapes that are NOT your statue''s shape, they
    fuse into your 3D escape key. Walk out through the shattered-glass wall. WARNING: if your key ever
    contains your own statue''s shape you cannot escape and must die and respawn.'
  - 6. OUTSIDE — dissect. Kill the three outside Knights to access all three 3D shapes, then SWAP 3D shapes
    between the three inside statues so each statue's 3D composition matches what its inside player needs.
    Every swap touches TWO statues — plan the whole sequence before you move anything.
  - 7. FREEZE (Catatonic Decimation). The moment all Inside players escape, everyone but one survivor
    is frozen solid and drops a Ghost in the main realm.
  - 8. OUTSIDE — revive. The survivor picks up each Ghost and deposits it on the CORRECT frozen statue
    to revive that player. Depositing on the WRONG statue is instant death — let the frozen spectators
    call their own positions.
  - 9. RESET. Clear the add wave between rounds — Grim, Thrall, Dread Husks, and two Unstoppable Ogres
    (use Anti-Unstoppable). Killing Knights/Ogres respawns the Knights for the next round.
  - 10. REPEAT. Complete three correct rounds. After round 3 the lift to the Witness encounter activates.
  defense:
    incoming_damage:
      adds:
      - Taken / mixed — Splintered Curator Knights + Dread adds; no single damage element
      boss:
      - None — Verity has no boss and no DPS phase
    champions:
    - Unstoppable Ogre (Taken) -> Anti-Unstoppable (EoF artifact Unstoppable weapon mods). Two spawn outside
      per round; one can spawn in the inside room. Splintered Curator Knights are normal adds, not champions.
    recommended_defensive_mods:
      elemental:
      - No fixed element to resist (Taken adds) — invest Health/Class + self-healing (Heal Clip/Incandescent,
        Solar restoration, or Recuperation) rather than an elemental resist mod
      concussive:
      - Concussive Dampener — vs Unstoppable Ogre eye-beam splash and add explosions
  damage:
    surges:
    - None — Verity has no DPS phase, so no damage surge applies
    burst_windows: No boss damage window. Completion = 3 rounds of correct shape dissection + Catatonic-Decimation
      Ghost revival.
    recommended_dps:
    - Bring heavy/DPS only to clear the Unstoppable Ogres between rounds — not for a boss
