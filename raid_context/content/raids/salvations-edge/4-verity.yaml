  mechanics:
  - 'THE SPLIT: The encounter starts when players interact with one of the three statues at the far (back)
    end of the room. Three random fireteam members are teleported into their own private mirror-image
    rooms (the INSIDE team); the other three remain in the main room (the OUTSIDE team). At the entrance
    there are six statues (one per Guardian); at the back there are three statues that shift between Guardians,
    plus a back wall projecting rotating 2D shapes (circle, triangle, square).'
  - 'TWO 2D-SHAPE ALPHABET AND ONE 3D ALPHABET: There are three flat shapes - circle, triangle, square.
    When two shapes are fused on a statue they become a 3D solid. Two of the same: two circles = sphere,
    two triangles = pyramid/D4, two squares = cube. Two different: circle+triangle = cone, circle+square
    = cylinder, triangle+square = (triangular) prism. Reading 3D shapes back into their two component
    2D shapes is the core literacy the OUTSIDE team needs.'
  - 'INSIDE GOAL (escape key): Each inside player has their own statue holding ONE 2D shape. Inside players
    must end up holding the TWO shapes their own statue does NOT hold, which fuse into a 3D escape key.
    They must NEVER build a key that contains their own statue''s shape - that makes escape impossible.
    When all three inside statues are read left-to-right, that order is called out so OUTSIDE can work
    (both sources: call left-to-right, e.g. ''TCS'').'
  - 'INSIDE SHAPE TRADING: Knights named Splintered Curators spawn inside and drop 2D shapes (only the
    shapes currently projected on your back wall drop). Inside players cannot interact with anything but
    their own room. To move a shape to a teammate you deposit it onto that TEAMMATE''s statue (never your
    own). Both videos describe a ''collect-then-distribute'' method: first gather two copies of your OWN
    statue''s shape, then gift one of each of those to your two teammates, leaving you needing the two
    shapes you don''t have, which the teammates send back to you.'
  - 'INSIDE ADS: Gifting a shape to an inside player spawns an Ogre in that player''s room; you must kill
    the Ogre before more Knights (and thus shapes) will spawn. Flying Dread (zoomed ''zubat'') adds and
    additional Knight waves also appear and must be cleared.'
  - 'OUTSIDE GOAL (dissection): The three back statues each start holding a doubled 3D shape. The OUTSIDE
    team must make each statue hold the TWO shapes that its matching inside statue does NOT hold - i.e.
    the exact 3D shape that inside player needs to escape. Example (call TCS): left (triangle inside)
    must become circle+square = cylinder; middle (circle inside) must become triangle+square = prism;
    right (square inside) must become triangle+circle = cone.'
  - 'OUTSIDE DISSECTION MECHANIC (swap/subtract): Knights drop the three 2D shapes outside. Depositing
    a 2D shape into a statue primes that statue to give up (subtract) that shape - it glows. Priming a
    SECOND statue with another shape causes the two primed statues to swap those two shapes. So every
    dissection move affects two statues at once. Think of depositing a shape as ''subtract this shape
    from this statue.'''
  - 'GHOST / ''DROWN IN THE DRIP'' WIPE: At a scripted point after the first set of inside swaps, the
    Witness wipes the INSIDE team (intentional, by design). Their ghosts appear in the main room near
    the original six entrance statues; three of those pedestals go empty and glow. Dead players see an
    inverted/upside-down version of the room and can each see ONE other dead Guardian in their correct
    spot - they call that Guardian out by their distinctive look/ghost. The living outside players carry
    each ghost to the correct pedestal. Placing a ghost on the WRONG pedestal kills the placer. Correct
    placement revives that player back into their room to continue.'
  - 'SECOND ADD/GHOST PHASE: Once both teams'' shapes match and inside players walk back out through the
    glass wall, the timer pauses and everyone regroups at the rally banner. A wave of ads including two
    Unstoppable Ogres spawns; clear them. The Witness then performs a second intentional wipe, killing
    five and leaving one alive, triggering another ghost-placement sequence (timer ~1 minute) to revive
    everyone.'
  - 'WIN CONDITION: Complete this full cycle three times (three rotations of inside-escape + ghost revives).
    There is no boss and no DPS phase. After three successful rounds the chest appears and the path forward
    opens. Visual distinction between all six Guardians (unique helmets, shaders, cloaks, ghost shells)
    is effectively a mechanic because the ghost phase depends on telling Guardians apart.'
  strategies:
  - name: Standard 3 Inside / 3 Outside with single dedicated swapper
    summary: The split is random, so all six learn both jobs. Inside players use the collect-your-own-shape-then-distribute
      method; outside designates ONE person to do all statue swaps while the other two clear ads and stun
      Ogres. This is True Vanguard's explicitly recommended setup.
    steps:
    - 'Decide visual identity first: every Guardian wears distinct helmet/shader/cloak and a recognizable
      ghost shell so the ghost phase is readable.'
    - Start the encounter; accept the random 3/3 split.
    - 'Inside: immediately read statues left-to-right and call the order so outside can begin.'
    - 'Inside: collect two copies of your own statue''s shape, gift one of each to your two teammates
      (onto their statues), then take back the two shapes you need; kill the Ogre that spawns on each
