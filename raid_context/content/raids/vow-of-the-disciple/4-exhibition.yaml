  meta_loadout:
  - Raid-wide prep builds apply; Exhibition is a mechanics/survival gauntlet rather than a fixed DPS race,
    so the guides' survivability builds are the relevant ones.
  - Warlock — Void with Child of the Old Gods + Healing Rift + Feed the Void (Devour) for self-sustain;
    Nezarec's Sin or Osteo Striga + Necrotic Grips for add-clear during the swap/dunk cycles.
  - Titan — Heart of Inmost Light, Bastion overshields + Suppression grenades to survive the relay pressure;
    banner shield (Ursa Furiosa) available if the team needs to tank/protect a carrier.
  - Hunter — Void Nightstalker invis build (Stylish Executioner, Vanishing Step, Vortex grenades) to stay
    alive and pick up/back up swaps and dunks.
