# Schema v3 (atomic). v2 mechanics + Phase-2 verified additions. EoF stat names.
# Blank loadout fields = unverified (no guessing).
activity:
  slug: vow-of-the-disciple
  name: Vow of the Disciple
  activity_type: raid
  fireteam_size: 6
encounter:
  order: 4
  slug: exhibition
  name: Exhibition (relics race)
  difficulty: hard
  estimated_time: 20-30 min
  abstract: '4-room race against Terminal Resonance timer. Pick up Resonant

    Shard → enter room → kill Glyphkeepers → identify SHARED symbol

    → shoot door symbol → advance. Room 2 adds Aegis (VoG) for Pervading

    Darkness cleanse. Room 3 adds Taken Essence for blight

    cleanse. Disciple''s Hourglass Taken Knight = reset Terminal

    Resonance timer.

    '
  setup: "WHAT YOU SEE:\n- 4 rooms, each progressively harder.\n- Resonant Shard in initial small room.\n\
    - Glyphkeepers spawn pairs (one Chieftain, one Phalanx).\n- Shielded Disciple's Hourglass Knights\
    \ (require Shard laser to break shield).\n- Aegis relic in Room 2 (VoG-style sword shield).\n- Taken\
    \ Essence in Room 3 (blight cleanse).\n- 4 of 6 wall symbols around each locked door.\n\nPLATFORM\
    \ MECHANICS:\n- Pick up Resonant Shard = encounter starts. Terminal Resonance timer = wipe at 0.\n\
    - Per room:\n  • Kill 2 Glyphkeepers (left = Phalanx, right = Chieftain).\n  • Phalanx symbols (LEFT\
    \ column) visible only to RELIC HOLDER.\n  • Chieftain symbols (RIGHT column) visible only to NON-RELIC\
    \ HOLDERS.\n  • Identify SHARED symbol → shoot it on the door = door opens.\n- Disciple's Hourglass:\
    \ Shard-laser to drop shield → kill = reset Terminal Resonance.\n- Room 2 onward: deposit Shard at\
    \ deposit point, pickup Aegis + Shard (2 relic holders).\n  • Aegis cleanse on the team's Pervading\
    \ Darkness.\n  • Curbed Resonance debuff on Shard-depositor (30s no-relic-pickup).\n- Room 3: add\
    \ Taken Essence. Cleanse blights with grenade button.\n- Room 4: large abyss platforming + same mechanics.\
    \ Drop relic into abyss = back to start.\n- All 3 relics deposited in Room 4 = encounter ends.\n\n\
    START STATE: rally banner. Pick up Shard to start.\n"
  callouts:
  - when: Symbols read
    from: phalanx side
    to: team
    say: '"Left: [symbol1], [symbol2], [symbol3]"'
    why: Pair team identifies shared.
  - when: Shared symbol
    from: non-relic
    to: team
    say: '"SHARED: [symbol]"'
    why: Shoot door symbol.
  - when: Disciple's Hourglass spotted
    from: spotter
    to: team
    say: '"HOURGLASS — Shard laser!"'
    why: Reset Terminal Resonance.
  - when: Aegis cleanse
    from: aegis_holder
    to: team
    say: '"CLEANSING — stack!"'
    why: Team stack for Pervading Darkness clear.
  - when: Curbed Resonance
    from: self
    to: team
    say: '"CURBED 30s — Shard back to me later."'
    why: Avoids picking another relic.
  wipe_triggers:
  - Terminal Resonance timer = 0.
  - Pervading Darkness 10.
  - Falling into abyss in Room 4.
  - Drop relic into abyss = back to start.
  damage_phase_triggers:
  - All 3 relics deposited in Room 4 = encounter ends.
  parallel_timeline:
  - phase: Pull (Room 1)
    relic_holder: Pick Shard.
    team_l_3: Push left, kill Phalanx Glyphkeeper.
    team_r_3: Push right, kill Chieftain Glyphkeeper.
  - phase: Door symbol + advance
    all: Identify shared, shoot door, advance.
  - phase: Room 2 (Aegis added)
    aegis_holder: Pick Aegis after Shard deposit.
    shard_holder_new: Pick Shard, juggle roles.
  - phase: Room 3 (Essence added)
    essence_holder: Cleanse blights with grenade button.
  - phase: Room 4 (final)
    all: Same mechanics + abyss platforming. Deposit all 3 = done.
  permutations:
  - name: Standard 3 relics rotating
    learner_friendly: true
    summary: Pre-assigned relic holders. Pace by Terminal Resonance.
    roles:
    - id: shard_holder
      count: 1
      does: Carries Shard. Drops Hourglass.
      loadout:
