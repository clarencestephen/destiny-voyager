        weapons: Quick-kill primary for shield-broken Knights + Glyphkeepers; mobility-friendly loadout
        exotic_armor: ''
        armor_stats: &id001
        - Weapons
        - Class
        surges_mods: No DPS surge; prioritize mobility/uptime and add-clear mods
    - id: aegis_holder
      count: 1
      does: Pervading Darkness cleanse.
      loadout:
        subclass: Survivability subclass to hold position while cleansing the team
        weapons: Add-clear primary for between-cleanse fighting; flexible special
        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: No DPS surge; resist and add-clear mods
    - id: essence_holder
      count: 1
      does: Blight cleanse.
      loadout:
        subclass: Subclass with grenade uptime (Essence cleanse uses the grenade button)
        weapons: Add-clear primary + flexible special for room adds
        exotic_armor: ''
        armor_stats: &id003
        - Grenade
        - Class
        surges_mods: No DPS surge; grenade-uptime and resist mods
    - id: symbol_reader
      count: 3
      does: Glyphkeeper kills + symbol identification.
      loadout:
        subclass: Mobile subclass for fast Glyphkeeper kills and symbol reads
        weapons: Precision primary (hand cannon / pulse) for correct-Glyphkeeper kills + quick special
        exotic_armor: ''
        armor_stats: &id004
        - Weapons
        - Class
        surges_mods: No DPS surge; mobility/uptime and add-clear mods
  - name: 'Speed: 2-rooms-fast'
    learner_friendly: false
    summary: Skip cleanse on intermediate rooms. Push to Room 4 with stack tolerance.
  cheese: []
  common_mistakes:
  - Shard drop into abyss = back to start.
  - Curbed Resonance forgot = can't pick up Shard at deposit.
  - Slow Hourglass kills = timer death.
  rewards:
    guaranteed:
    - 1× raid weapon or armor
    hidden_chest: null
    potential_drops:
    - Submission (SMG, Kinetic)
    - Deliverance (fusion rifle, Stasis)
    - Resonant Fury armor — Chest + Legs (encounter-specific slots)
  images:
    overview: ''
    setup: ''
    callouts: ''
  learner_path:
  - '1st: symbol_reader.'
  - '2nd: shard_holder.'
  - '3rd: aegis or essence holder.'
  plain_language_steps:
  - 1. Place a rally banner. Pick up the Resonant Shard in the first small room to start the encounter
    and begin the Terminal Resonance timer — it wipes the team at 0.
  - '2. In each room, two Glyphkeepers spawn: a Phalanx on the LEFT and a Chieftain on the RIGHT. Push
    your side and kill the correct one.'
  - '3. Read the symbols: the LEFT (Phalanx) column is visible only to the Relic Holder; the RIGHT (Chieftain)
    column is visible only to non-relic holders. Compare the two columns to find the one SHARED symbol.'
  - 4. Shoot the shared symbol on the locked door to open it and advance to the next room.
  - 5. Whenever a shielded Disciple's Hourglass Taken Knight appears, hit it with the Shard's laser to
    drop its shield, then kill it to RESET the Terminal Resonance timer — this is how you buy time.
  - 6. From Room 2 onward, deposit the Shard at the deposit point and pick up the Aegis relic (VoG sword-shield).
    The depositor gets Curbed Resonance (30s no relic pickup), so call it out and hand the Shard back
    later.
  - 7. The Aegis holder cleanses the team's Pervading Darkness — call 'CLEANSING' and have the team stack
    in the bubble.
  - 8. In Room 3, add the Taken Essence relic; the Essence holder cleanses blights using the grenade button.
  - '9. Room 4 is a large abyss-platforming room with the same symbol mechanics. Be careful: falling in,
    or dropping a relic into the abyss, sends you back to the start.'
  - 10. Deposit all 3 relics in Room 4 to end the encounter.
  - 11. On Master, manage the Defenses Down challenge (each player kills at most one Taken Knight, 6 unique
    kills across 6 players) by choreographing the relic hand-offs.
  defense:
    incoming_damage:
      adds:
      - Taken (Disciple's Hourglass shielded Taken Knights, Taken Phalanx Glyphkeepers, blights in Room
        3)
      - Scorn (Scorn Chieftain Glyphkeepers)
      - Darkness (Pervading Darkness, cleansed by the Aegis)
      boss: []
    champions: []
    recommended_defensive_mods:
      elemental:
      - No fixed resist requirement; the Aegis cleanse and Essence blight-cleanse handle the Darkness/blight
        threats. On Master, general resist coverage helps survive the Knight-heavy rooms under timer pressure.
      - One Thermoshock Plating + one Void Resist Plating to cover mixed Taken/Scorn/Darkness damage during
        the relay.
      - Well of Tenacity + Elemental Time Dilation + Reaping Wellmaker for ~50% resist uptime; Better
        Already / Recuperation for orb-pickup healing.
      concussive:
      - Optional on Master — a Concussive Dampener can reduce heavy Taken/Scorn burst while a relic holder
        is locked out of fighting
  damage:
    surges:
    - No DPS phase — this is a timed mechanics race, so no DPS-phase surge applies
    burst_windows: No boss burst window; the time pressure is the Terminal Resonance timer, extended by
      killing shielded Disciple's Hourglass Knights.
    recommended_dps:
    - Fast single-target for shield-broken Hourglass Knights and Glyphkeepers (SMG, hand cannon, pulse
      rifle); prioritize speed and mobility over raw burst
    - No dedicated boss-DPS phase the guides target here; they recommend fast add-clear (Funnel Web SMG,
      blinding GL) plus a heavy/linear kept ready for any burst window.
