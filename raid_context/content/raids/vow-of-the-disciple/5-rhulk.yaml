  meta_loadout:
  - Final boss — apply the guides' heavy DPS loadouts. Builds are raid-wide but this is the primary damage
    encounter.
  - Warlock — Void Nova Bomb (Cataclysm tree for tracking) or Well of Radiance via Phoenix Protocol /
    Lunafaction Boots for team DPS support; Child of the Old Gods to weaken Rhulk, exotic Nezarec's Sin
    or Osteo Striga + Necrotic Grips for add-clear in the final stand.
  - Titan — Heart of Inmost Light Void build; Ward of Dawn / Ursa Furiosa banner shield for the 40% team
