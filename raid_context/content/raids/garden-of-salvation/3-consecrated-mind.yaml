  learner_path:
  - '1st: relay_team (mote collection less stressful).'
  - '2nd: boss_team.'
  plain_language_steps:
  - 1. Drop your rally banner. You are in the same diamond arena as the summon encounter, with the Consecrated
    Mind hovering in the center.
  - 2. Tether a Vex Lens to the initial Conflux to start the encounter, then split into two groups of
    three.
  - '3. Boss group: follow the Consecrated Mind as it moves to the four platforms (North, South, East,
    West).'
  - 4. One boss-group player steps into a Voltaic Charge on the platform and becomes Detained. The boss
    opens up, revealing six red eyes on its fins (two per fin across three fins).
  - 5. The Detained player can only see whether the INNER or OUTER circle of eyes is lit. They call it
    out, and the non-Detained players shoot that circle. Calling or shooting the wrong circle kills the
    Detained player.
  - '6. Relay group: defend the one relay lit by a light beam. A Major Minotaur spawns there and drops
    five Voltaic Motes per kill.'
  - 7. One player collects all five motes and banks them at that relay's Conflux. Keep clearing Minotaurs
    and banking.
  - 8. Bank 30 or more motes total. This draws the boss to the overloaded Conflux and exposes all six
    eyes at once.
  - 9. Shoot all six eyes to trigger the damage phase.
  - 10. During DPS, burst the Consecrated Mind hard, but keep your distance — standing too close when
    it retreats to center triggers a wipe attack.
  - 11. Keep collecting any Voltaic Overflow so it never explodes, and keep the Conflux free of Vex sacrifices.
  - 12. If the boss survives, it retreats and the cycle repeats — re-split and run the platform/relay
    loop again.
  defense:
    incoming_damage:
      adds:
      - Vex adds (Goblins, Harpies, Major Minotaurs) deal Arc and Void slap-rifle damage
      - Voltaic Overflow charges deal Arc damage and detonate if uncollected
      boss:
      - Arc
      - Void
    champions: []
    recommended_defensive_mods:
      elemental:
      - Arc and Void resist help against Vex slap-rifle fire, the boss's close-range wipe attack, and
        Voltaic detonations
      concussive:
      - Concussive Dampener helps mitigate the boss's area attacks and Vex slap-rifle volleys while chasing
        platforms
  damage:
    surges:
    - No single fixed DPS element is dictated; bring your highest-burst element. Pair Divinity (this raid's
      exotic trace rifle) to debuff and create a precision crit on the Mind, then burst that crit
    - Solar Surge
    burst_windows: After 30+ motes are banked and all six eyes are shot, you get roughly a 25-30 second
      burn on the Consecrated Mind's exposed core.
    recommended_dps:
    - Divinity to debuff and lock a precision crit
    - Heavy burst options such as Linear Fusion Rifles, Rocket Launchers, or precision Snipers (e.g. Whisper/Sleeper-style)
      into the crit
    - A Super-amp support like Well of Radiance under the Divinity-debuffed boss
    - Whisper of the Worm
    - Celestial Nighthawk Golden Gun
    - Izanagi's Burden
