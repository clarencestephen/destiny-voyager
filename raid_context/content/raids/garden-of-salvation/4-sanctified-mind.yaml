    - Helm of Righteousness (Helm)
    - Temptation's Mark (Class Item)
    - 'Note: **Divinity** (exotic trace rifle) comes from the quest ''What''s This, What''s This?'' (intra-raid
      puzzle), NOT the final-chest RNG pool.'
    - Omniscient Eye (sniper)
    - Zealot's Reward (fusion)
    - Garden armor (full set)
