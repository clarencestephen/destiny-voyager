  learner_path:
  - '1st: ground_support.'
  - '2nd: portal_team.'
  plain_language_steps:
  - 1. Drop your rally banner and tether to start the encounter. The Sanctified Mind sits in the center
    of a large arena.
  - '2. Note the two Confluxes (banks): a BLUE one on the left and a RED one on the right. Watch for Cyclopses
    on the pillars — they one-shot if you ignore them.'
  - 3. Split into three teams of two. The boss's LEFT SHOULDER opens the RED portal; its RIGHT KNEE opens
    the BLUE portal.
  - '4. Team A: have a teammate shoot the left shoulder to open the red portal, then jump in to reach
    the red (Tainted) zone.'
  - 5. In the zone, kill Vex (Goblins, Harpies, Minotaurs) to drop Voltaic Motes — 15 total per zone,
    with a cap of 10 per player, so split the pickup across the pair.
  - 6. When the in-zone team has 15, the ground team shoots the SAME body part again to teleport them
    back out.
  - 7. Team A banks the Tainted motes at the RED Conflux and gains Enlightenment. Never bank red motes
    at the blue bank — they are wasted.
  - '8. Run the same flow for blue: shoot the right knee, send a team into the blue zone, collect 15,
    teleport them out, and bank at the BLUE Conflux.'
  - 9. Throughout, ground players defend both Confluxes from sacrifices and keep killing the pillar Cyclopses.
  - 10. When both banks are full, the boss spawns a giant glowing CROSS in the arena and an Angelic appears.
  - 11. Kill the Angelic, then form a tether chain (matching the cross's color) from a bank to the cross,
    linking three to four players. This exposes the boss's core.
  - 12. Burst the core during the DPS phase. If the boss survives, the cycle repeats.
  defense:
    incoming_damage:
      adds:
      - Vex adds (Goblins, Harpies, Minotaurs, the Angelic Hydra) deal Arc and Void slap-rifle damage
      - Cyclopses fire Void eye-blasts that one-shot from the pillars
      boss:
      - Arc
      - Void
    champions: []
    recommended_defensive_mods:
      elemental:
      - Void resist is especially valuable against Cyclops eye-blasts; Arc and Void resist help against
        Vex slap-rifle fire and the boss
      concussive:
      - Concussive Dampener helps reduce Cyclops blast and Vex slap-rifle damage while defending the Confluxes
  damage:
    surges:
    - No single fixed DPS element is dictated; bring your highest-burst element. Pair Divinity to lock
      the boss's core so all burst weapons hit the same spot
    burst_windows: Once both banks are full, the Angelic is dead, and the color-matched tether chain links
      the bank to the cross, the boss's core becomes vulnerable for a burst window.
    recommended_dps:
    - Divinity to lock the core
    - Heavy burst options such as Linear Fusion Rifles, Rocket Launchers, or precision Snipers into the
      locked core
    - A Super-amp support like Well of Radiance placed on the Divinity-debuffed boss
    - Cold Comfort
    - Gjallarhorn
    - Apex Predator
    - The Hothead
    - Celestial Nighthawk Golden Gun
    - Izanagi's Burden
    - Wendigo
