    exotic_armor: ''
    armor_stats: *id001
    surges_mods: Match surge mods to your add-clear weapon element; no encounter-forced element.
  - role_id: center_clear
    subclass: ''
    weapons: Add-clear primary plus a hard-hitting special (shotgun or fusion) to break the central gate
      enemies quickly.
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: Match surge mods to your weapon element; ability-regen armor mods help sustained add-clear.
