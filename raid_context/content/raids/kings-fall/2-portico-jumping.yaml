  learner_path:
  - Follow + learn.
  plain_language_steps:
  - '1. This is the first jumping puzzle: swinging Hive platforms and a series of ships you ride across
    a gap.'
  - 2. Jump from one swinging platform to the next, leaping when each platform reaches the top (apex)
    of its swing.
  - 3. Ride the ships across in order to progress toward the end.
  - 4. At the end, two plates sit near a ship; one player stands on each plate.
  - 5. A third player rides the ship across while the two plates are held.
  - 6. The door opens when both plates are active and the ship arrives.
  - '7. For Hidden Chest 1: while the two plates are held and the ship is moving, the ship-rider jumps
    off to the LEFT before the shield wall onto a spike-like platform.'
  - 8. Walk up the small walkway and through the side door at the top to reach the chest; the plates must
    stay held while you climb.
  - 9. Be careful timing platform jumps, since falling means death and a long respawn.
