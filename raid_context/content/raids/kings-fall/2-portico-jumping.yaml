  name: Crux & Portico (Jumping Puzzle 1)
  difficulty: easy
  estimated_time: 5-10 min
  abstract: 'Swinging platforms + ship-jumping puzzle. Two plates + 1 ship at end.

    One person on each plate, one on ship. Door opens when plates active +

    ship arrives. Hidden Chest 1 (secret) accessible during this section.

    '
  setup: 'WHAT YOU SEE:

    - Swinging Hive platforms across a gap.

    - Series of ships you must jump to in order.

    - 2 plates near a ship.


    PLATFORM MECHANICS:

    - Jump from swinging platform to swinging platform when they hit apex.

    - Ride ships across.

    - 2 plates active + ship arriving = door opens.


    HIDDEN CHEST 1: While 2 plates are held + ship is moving, the 3rd

    player on the ship jumps off LEFT before the shield wall, onto a

    spike-like platform, climbs to a side door = chest. Need plates

    held while you climb.

    '
