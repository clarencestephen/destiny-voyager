  learner_path:
  - Follow + learn.
  plain_language_steps:
  - '1. This is the second jumping puzzle: a tall chamber with ledges and platforms leading upward.'
  - 2. Jump from platform to platform while dodging the wall pillars that periodically extend and push
    players off ledges.
  - 3. Do not stand too close to a wall when a pillar is about to fire, since the push means a fatal fall.
  - 4. Have the lead player call pillar timing so the team can take turns ascending safely.
  - '5. For the Exotic Chest: on entering the area, turn RIGHT and jump onto a side-pillar platform.'
  - 6. Continue upward to a large doorway, then loop around to reach the exotic chest; watch for a delayed
    pillar on the last jump.
  - 7. At the top, three plates must be stood on SIMULTANEOUSLY so the invisible platforms become permanent.
  - 8. With all three plates held, the door opens to the Threshold and the section is complete.
