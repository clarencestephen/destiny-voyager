    hidden_chest:
      location: 'EXOTIC CHEST (Transept): On entering, turn RIGHT. Jump onto a

        side-pillar platform. Continue upward. Find a large doorway,

        loop around to chest. Last jump has a delayed pillar — watch

        for it.

        '
      rewards:
      - Random exotic engram chance + raid loot
    potential_drops: []
  images:
    overview: ''
