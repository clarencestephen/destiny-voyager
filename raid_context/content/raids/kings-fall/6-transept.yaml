encounter:
  order: 6
  slug: transept
  name: Transept (Jumping Puzzle 2 + Exotic Chest)
  difficulty: medium
  estimated_time: 5-15 min
  abstract: 'Vertical jumping puzzle with wall-pillars that push you off ledges.

    End: 3 plates stood on simultaneously = invisible platforms become

    permanent → door opens to Threshold. Exotic Chest hidden in upper

    area.

    '
  setup: 'WHAT YOU SEE:

    - Tall chamber, ledges and platforms upward.

    - Wall pillars that periodically extend, pushing players off.

    - 3 plates at top.


    PLATFORM MECHANICS:

    - Jump platform → platform, dodging extending wall pillars.

    - 3 plates at top must be stood on SIMULTANEOUSLY → invisible platforms become permanent.


    EXOTIC CHEST: Turn RIGHT after entering area, jump onto a side pillar

    platform, continue up to a large doorway → loop around → exotic chest.

    '
  callouts: []
  wipe_triggers:
  - Wall pillar push = fall = death.
  damage_phase_triggers:
  - 3 plates simultaneously stood = door opens.
  parallel_timeline: []
  permutations:
  - name: Standard ascent
    learner_friendly: true
    summary: Take turns. Lead player calls pillar timing.
  cheese: []
