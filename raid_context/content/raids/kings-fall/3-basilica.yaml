    surges_mods: Match surge mods to your add-clear element; survivability and resist mods prioritized
      since the holder cannot leave the totem.
  - role_id: brand_claimer
    subclass: Any subclass with quick add-clear and mobility to chase the Wizard then Blightguard.
    weapons: Precision primary (scout / pulse / hand cannon) for the Wizard and Blightguard; a special
      for fast confirms.
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: Match surge mods to your weapon element; ability-regen mods for repeated kills.
  - role_id: center_clear
    subclass: Any subclass with strong single-target tools to suppress the Unstoppable Ogre.
    weapons: Anti-Unstoppable primary plus a hard-hitting heavy/special for the center Ogre and adds.
    exotic_armor: ''
    armor_stats: *id003
    surges_mods: Run Anti-Unstoppable (Unstoppable Ogre); match surges to your heavy element.
