    - Well / Banner in the Queenswalk DPS area.
  common_mistakes:
  - Letting the Taken Strength bar fill because nobody is collecting orbs — this is the primary wipe condition.
  - Hoarding orbs and reaching 10 stacks of Unstable Light, detonating and dying mid-rotation.
  - Failing to offload on an Accretion plate before the stack cap, or multiple players crowding the same
    plate and leaving orbs uncollected elsewhere.
  - Ignoring the Hobgoblin snipers and Phalanxes on the ledges, getting picked off or shield-bashed while
    focused on orbs.
  - Over-extending DPS past the stagger window and getting caught when Morgeth recovers and the orb pressure
    resumes.
  - Poor role assignment — not designating who covers which orbs/plates leads to dropped stacks and a
    runaway Strength bar.
