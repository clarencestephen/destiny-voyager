    - Set up Well / Banner Shield once the real Gahlran is found.
  common_mistakes:
  - Letting the Sorrow debuff hit max by ignoring marked enemies or not cycling onto plates, causing instant
    deaths.
  - Misreading or miscommunicating the symbols between the two rooms and shooting a fake Gahlran 'Deception'
    clone, wasting the window or triggering the wipe slam.
  - Dumping DPS into a projection before the real Gahlran's weak point is confirmed open.
  - Standing too close/in the open when Gahlran's Deception slam goes off instead of being positioned
    to survive it.
  - Both sub-teams collapsing to one room and letting the opposite room's add wave snowball Sorrow.
  - Bursting too slowly across the limited damage window and failing to reach the next phase before the
    puzzle resets.
