  slug: argos
  name: Argos, Planetary Core
  ingame_name: Argos, Planetary Core
  abstract: Argos, Planetary Core is the colossal Vex mind that anchors the Leviathan's Spire, fought
    in a tall multi-tiered arena split into a central platform and side rooms. The fireteam must survive
    its room-wide psionic discharge by standing on the correct safe plates, charge and bank Charges of
    Light to collapse its central-eye shield, then burst the exposed core during its open-eye damage window
    before it seals and resets. Success demands strict role assignment across the side rooms, fast add
    clears, and disciplined positioning during the wipe pulse.
  plain_language_steps:
  - 'Split the six players into roles: a group covering the central platform and runners assigned to the
    left and right side rooms where the relays and floor panels live.'
  - Clear the incoming Vex and Cabal/Psion adds quickly to generate and pick up Charges of Light from
    the enemies that drop them.
  - Carry Charges of Light to the relays and bank them to build the charge meter that will drop Argos's
    central-eye shield.
  - 'Watch for Argos''s room-wide psionic discharge: when the core winds up its wipe pulse, get every
    player onto the correct lit safe plates/panels (matching the called pattern) so nobody is caught in
    the open and instantly killed.'
  - Once the shield collapses and the central eye opens, push to the platform and burn the exposed core
    during the open-eye damage window.
  - When the eye closes and Argos re-shields, disengage, reset positioning, rebuild charges, and repeat
    the cycle until the core is destroyed.
  mechanics:
  - Central-eye shield that must be brought down by banking Charges of Light gathered from adds before
    any damage can be dealt to the core
  - Room-wide psionic discharge / wipe pulse — players must stand on the correct lit safe plates or panels
    to survive; being caught in the open is an instant kill
  - Relay and floor-panel puzzle split across the central platform and the left/right side rooms requiring
    coordinated role assignment
  - Open-eye DPS window — the core is only vulnerable while its central eye is exposed, then it seals
    and resets the cycle
  - Continuous add pressure (Vex plus Cabal Loyalist support and Psions) that both threatens the team
    and supplies the Charges of Light needed to progress
  defense:
    incoming_damage:
      adds: []
      boss:
