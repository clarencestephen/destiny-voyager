    recommended_dps:
    - High-damage Heavy weapons (Rocket Launchers / Linear Fusion Rifles) for the burst open-eye window
    - Precision-friendly options that can hit the exposed core reliably during the short vulnerability
      phase
    - Add-clear primaries/specials to keep Charge of Light generation flowing between damage cycles
  common_mistakes:
  - Standing on the wrong plate/panel or staying in the open during the psionic discharge and getting
    one-shot, which usually cascades into a wipe
  - Failing to assign and hold side-room roles, so relays and panels aren't covered and the shield never
    drops in time
  - Letting adds overwhelm the team, which both kills players and starves the team of the Charges of Light
    needed to break the shield
  - Wasting the short open-eye window by being out of position or out of Heavy ammo when the core becomes
    vulnerable
  - Tunneling on the core during DPS and ignoring the next incoming wipe pulse
