  common_mistakes:
  - Misreading the glyph/plate order, which botches the shield drop and triggers the room-wide wipe pulse.
  - Letting the Brand of the Initiate / Aura expire or fumbling the hand-off, leaving the team unprotected
    when the wipe mechanic fires.
  - Plate-holders stepping on or off their plate at the wrong time and breaking the activation sequence.
  - Ignoring add pressure (Knights and attending Wizards) so the team gets overwhelmed between damage
    windows.
  - Greeding damage too long and getting caught outside the Brand's protection when the wipe pulse goes
    off.
  - Failing to fully clear adds before starting a cycle, causing chaos during the plate sequence.
