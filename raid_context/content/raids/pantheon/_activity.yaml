  status: live-lineup-leak-authored-unverified
overview:
  abstract: 'Pantheon is a permanent raid-boss-rush activity: a sequence of bosses pulled from Destiny
    2''s raids, fought back-to-back with escalating difficulty. The 2026 relaunch ("Pantheon 2.0") brings
    a NEW roster of bosses (a "fresh slate," per Bungie) — NOT the four 2024 bosses — new rewards, and
    a new Title. The only boss Bungie has named so far is Calus (from the Leviathan raid), referenced
    as an armor-ornament source. The exact boss list, order, source raids, difficulty tiers, and per-boss
    modifiers remain officially unconfirmed as of 2026-06-10.'
  what_is_confirmed:
    permanence: Permanent activity (unlike the limited 2024 event).
    roster: A new slate of bosses spanning multiple raids; Bungie's only named example is Calus (Leviathan).
      Bosses drop armor-set ornaments from their ORIGINAL raid.
    structure_schedule_2026:
    - '2026-06-09: two separate activities launch, each with its own unique lineup of boss encounters.'
    - '2026-06-13 (first Saturday): a third activity unlocks — "the gauntlet" — every boss encounter in
      a single run.'
    - '2026-06-16 (Tuesday reset): weekly rotators begin — individual single-boss encounters for rewards.'
    difficulty:
    - 'Adventure difficulty: raised Power cap, infinite revives, looser mechanic timers, in exchange for
      a limited pool of lower-Tier rewards.'
    - Escalating difficulty across the run; named T1–T5 Pantheon tiers are NOT confirmed. ("T5" in the
      June-update marketing = gear Tier 5, a separate loot-system change, not a Pantheon difficulty ladder.)
    rewards:
    - New armor set per class (Tier-5 capable).
    - 'Reprised raid weapons with a unique Origin Trait + holofoil variants. New Pantheon weapons named:
      "Alone as a God", "Bane of Sorrow".'
    - Armor-set ornaments from each boss's original raid (e.g. Calus → original Leviathan ornaments).
    - Spoils-of-Conquest re-roll vendor, emblems, exotic cosmetics, and a NEW Title (name TBA — explicitly
      not "Godslayer").
  loadout_guidance: 'Until the lineup + modifiers are confirmed, treat Pantheon as a general endgame boss-DPS
    gauntlet: bring a strong, flexible damage loadout and survivability. Anti-Champion options are artifact-based
    this era. Do NOT pre-commit element-specific resist/surge mods to a fixed boss order — author per-boss
    recommendations only once each encounter is confirmed.'
