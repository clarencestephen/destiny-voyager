# pantheon — activity header. Pantheon 2.0 OFFICIALLY CONFIRMED via Bungie Update 9.7.0
# (Monument of Triumph, 2026-06-09). The earlier leak roster + source raids were EXACT;
# Bungie groups the 6 bosses into two named 3-boss activities + a full Gauntlet (06-13).
# Boss identity + source raid: verified. Per-boss MODIFIERS (champions/surges/shields): TBD.

activity:
  slug: pantheon
