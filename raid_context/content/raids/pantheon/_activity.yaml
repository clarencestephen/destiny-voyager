  status: live-confirmed-official
overview:
  abstract: Pantheon ("Pantheon 2.0") is a PERMANENT raid-boss-rush activity that launched with the 2026-06-09
    Monument of Triumph update (Update 9.7.0). The six confirmed bosses are reprised raid bosses fought
    back-to-back under escalating Power handicaps + modifiers. Bungie ships them as TWO named 3-boss activities
    (Calus Resplendent, Morgeth Surpassing) plus a full 6-boss Gauntlet that unlocks 2026-06-13. The roster
    + source raids are CONFIRMED; per-boss modifiers (champions/surges/shields) are not yet documented
    as of 2026-06-11.
  structure:
    Calus Resplendent:
    - Argos, Planetary Core
    - Gahlran, the Sorrow-Bearer
    - Emperor Calus
    Morgeth Surpassing:
    - The Warpriest
    - Consecrated Mind, Sol Inherent
    - Morgeth, the Spirekeeper
    The Gauntlet: All 6 bosses back-to-back; unlocks Saturday 2026-06-13 10 AM PT.
  schedule_2026:
  - '2026-06-09: Calus Resplendent + Morgeth Surpassing launch (Update 9.7.0).'
  - '2026-06-13 (Sat, 10 AM PT): The Gauntlet (all 6) unlocks.'
  - '2026-06-16 (Tue reset): weekly featured single-boss rotators begin (two bosses/week).'
  difficulty:
  - Escalating Power handicap per boss as you progress the gauntlet (boss is +N Power over the player).
  - Adventure-style accessibility (raised Power cap, revives) in exchange for lower-Tier rewards on the
    easier tier.
  - Per-boss champion/surge/shield modifiers NOT yet documented — gather from in-game / a future TWID.
  rewards:
  - 'Per boss: one Adept weapon (weekly, via the Bonus/Platinum timer) + Spoils of Conquest + Trophy of
    Bravery.'
  - 'Monument-of-Triumph loot overhaul: raid/dungeon weapons gain Tier parity, set bonuses, new perks;
    crafted raid weapons gain a Tier 1-5 path.'
  - Divine Weaponry quest (Arcite 99-40, Hall of Champions, after the Gauntlet) → a raid Exotic of choice.
  - 'Emblems: Atraks Dethroned / Exalted Beyond Oryx / Rhulk Subdued / Elevated Above Nezarec — NOTE:
    these are the ORIGINAL-Pantheon emblem names some guides still list; treat as unverified for 2.0.'
  - 'Godslayer title (10 triumphs: completion + Platinum-timer per boss).'
  loadout_guidance: 'Endgame boss-DPS gauntlet: bring strong, flexible burst DPS + survivability. Anti-Champion
    is artifact-based this era. Per-boss element-specific resist/surge recommendations are deferred until
    Bungie/TWID publishes the Pantheon-2.0 modifiers (expected 2026-06-16+).'
