# pantheon — activity header (authored from sourced facts, 2026-06-10).
# Pantheon 2.0 launched with the 2026-06-09 "Monument of Triumph" update.
# PROVENANCE / DISCIPLINE NOTE:
#  - The CONFIRMED facts below (permanence, schedule, Adventure difficulty,
#    rewards) come from Bungie (tier 1) — see overview.sources.
#  - The boss LINEUP (overview.lineup + the N-slug.yaml encounter files) was
#    authored at the user's explicit request from the UNVERIFIED community/leak
#    set. Bungie had NOT confirmed the roster, tiers, or per-boss modifiers as of
#    2026-06-10 (only Calus was hinted). Every encounter is tier-3 / _confidence:
#    low / verified:false. The boss MECHANICS are historical fact; the Pantheon-
#    2.0 INCLUSION and rescaling (champions/surges) are the unverified part —
#    which is why champions/surges were left empty rather than guessed.
#  - Third-party sites showing the 2024 lineup (Atraks/Oryx/Rhulk/Nezarec,
#    "Godslayer") are stale carryover and were NOT used.
#  - REPLACE this leak lineup with the official roster the moment Bungie reveals it.
activity:
