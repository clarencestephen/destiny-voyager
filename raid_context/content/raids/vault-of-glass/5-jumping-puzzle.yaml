  learner_path:
  - Just play.
  plain_language_steps:
  - 1. You arrive at a bottomless chamber with an initial platform near the entry.
  - 2. Stepping onto a platform spawns the next one and starts the current platform decaying, so keep
    moving forward.
  - 3. Cross platform to platform toward the narrow ledge on the far side, which leads to a recessed doorway.
  - 4. Take the jumps one at a time. Patience beats speed; do not jump before the next platform has actually
    appeared.
  - 5. Falling means death and a long respawn outside the Darkness Zone, so reset to a safe platform if
    unsure.
  - '6. Optional alternate route: from the edge, jump up and to the LEFT into a cave that has alternate
    platforms leading more directly to the far side.'
  - '7. Optional hidden chest: after crossing the chasm, look directly UP and to the RIGHT of the hallway
    just before Atheon''s chamber; the chest sits on a small ledge.'
  - 8. Reach the far ledge and proceed through the doorway toward Atheon's room.
