differs_from_base: 'Adds the ''Strangers in Time'' constraint on top of the normal encounter: The Wyvern
  and Minotaurs that spawn simultaneously must die

  within 5 seconds of each other. Forces coordinated cross-

  portal damage timing — the Mars and Venus teams have to

  sync their kills against the wave timer. On Master, every encounter''s challenge is active simultaneously,
