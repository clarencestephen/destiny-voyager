  meta_loadout:
  - 'Hunter: stay on Blade Barrage + Shards of Galanor (or swap to Golden Gun if preferred). Heavy: Anarchy.
    Energy: Cartesian Coordinate (fusion rifle) with Vorpal Weapon + Boss Spec (alternatives: Null Composure,
    or a shotgun). Primary doesn''t matter unless hot-swapping a shotgun — just need something to shoot
    Oracles, something for the boss, and Anarchy to debuff. Switch chest mods back to Grenade Launcher
    + Grenade Launcher Reserves; Concussive Dampener is great here for splash-damage resistance.'
  - 'Titan: Thundercrash with Cuirass of the Falling Star, same weapons. Alternate bubble Titan (top-tree
    Sentinel, Helm of Saint-14) — run a magnetic grenade so it sticks to the boss.'
  - 'Warlock: Well of Radiance (with Lunafaction Boots to extend shotgun range) if you''re the only Warlock;
    or a damaging super such as Chaos Reach (middle-tree Arc) with Geomag Stabilizers if you have multiple
    Warlocks. Same weapons as Hunter.'
