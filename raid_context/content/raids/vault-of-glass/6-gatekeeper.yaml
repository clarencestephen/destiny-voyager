  meta_loadout:
  - 'All classes: switch back to the Ikelos SMG for add-clear and the Overload, debuff with Anarchy (or
    run a Legendary grenade launcher with Witherhoard if you lack Anarchy), and finish with whatever you''ve
    got. Blade Barrage kept on Hunter (doesn''t really matter — use whatever''s comfortable). This setup
    works well for holding the portals open on the outside; same strategy if going inside (still ad-clearing).'
  - If a portal diver struggles with the Praetorian, bring a grenade launcher with blinding grenades to
    slow it before the relic holder gets in.
  - 'Titan: Thundercrash with Cuirass of the Falling Star (or bubble Titan with Helm of Saint-14, magnetic
    grenade). Warlock: well or a damaging super, same weapons.'
