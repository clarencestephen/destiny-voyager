      spec for add-clear
  - role_id: relic_diver
    subclass: Survivable, mobile subclass for entering the portal and surviving the inner Gatekeeper
    weapons: Burst special/heavy to drop the inner Gatekeeper Hydra fast; lightweight since the Aegis
      is the key tool once grabbed
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: Prioritize survivability; remember the Aegis cleanse (grenade) clears the inside-portal
      Void blindness
  - role_id: add_diver
    subclass: Any subclass with strong add-clear and burst to support the relic diver inside the portal
    weapons: Burst special/heavy for the inner Gatekeeper, plus a precision primary for adds and Praetorians
    exotic_armor: ''
    armor_stats: *id003
    surges_mods: Match heavy to the weekly surge on Master; carry an anti-Champion verb on Master
