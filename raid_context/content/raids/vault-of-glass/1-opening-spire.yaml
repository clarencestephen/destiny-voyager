  - role_id: floater
    subclass: Any mobile subclass with strong ability uptime for chasing Praetorians
    weapons: Burst special or heavy (sniper, GL, or rocket) to delete Praetorians, plus a precision primary
      for Hobgoblins/Cyclops
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: No surge needed; prioritize anti-major/anti-Praetorian burst and ammo economy
