  meta_loadout:
  - 'Hunter: Blade Barrage (middle-tree Solar) with Shards of Galanor exotic; incendiary grenade. Door-opening/complexes
    weapons: Chroma Rush (auto rifle, with Subsistence), an Ikelos SMG (with Subsistence, used as the
    Overload weapon), heavy Anarchy (or a Legendary grenade launcher with Witherhoard if you lack Anarchy).'
  - 'Hunter armor mods (kept most of the raid): Reactive Pulse + Ashes to Assets (artifact); Overload
    SMG + Charged Up on arms; Taking Charge + Grenade Launcher Reserves + Concussive Dampener (or Sniper
    Damage Resistance vs Hobgoblins) on chest; Global Reach on legs; Breach and Clear on cloak (for Anarchy
    / Legendary GL / Witherhoard to debuff).'
  - 'Titan: Thundercrash (Code of the Missile) with Cuirass of the Falling Star exotic; pulse grenade.
    Same weapons per phase as Hunter; optional Crown-Splitter sword for add-clearing phases (run Lucent
    Blade if so). Alternate: bubble Titan on top-tree Sentinel with Helm of Saint-14.'
  - 'Warlock: well or a damaging super depending on how many Warlocks are in the group. Same weapons per
    phase as Hunter. Solo Warlock typically runs Well of Radiance with Lunafaction Boots; multiple Warlocks
    can run Chaos Reach (middle-tree Arc) with Geomag Stabilizers, or Boots of the Assembler / Phoenix
    Protocol for add-clear phases.'
