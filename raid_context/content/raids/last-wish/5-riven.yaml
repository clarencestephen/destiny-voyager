activity:
  slug: last-wish
  name: Last Wish
  activity_type: raid
  fireteam_size: 6
encounter:
  order: 5
  slug: riven
  name: Riven of a Thousand Voices (final boss)
  difficulty: hard
  estimated_time: 30-50 min
  abstract: 'Most communication-heavy boss in Destiny. Split into 2 rooms (Crystal

    + Tree). Riven appears in one, Eye of Riven in other. Stagger Riven

    via tentacle attack or fire attack → 2 of her 10 eyes glow → call

    to other team. Other team shoots called eyes when Riven swaps rooms.

    6 eyes total over phase 1. Then skydive DPS on her chest sores +

    Axion Darts. Final stand = Ascendant Plane race + chest blight inside

    her mouth. POST-KILL: Heart of Riven Fate''s Chosen escape run.


    MOST GROUPS use the WALL-HUG CHEESE that skips eyes entirely.

    '
  setup: 'WHAT YOU SEE:

    - Riven, a massive Ahamkara dragon, in a vast chamber.

    - 2 side rooms: Crystal (blue) + Tree.

    - Lens at the back of each room (jump up + look through).

    - Riven''s body has 10 eyes around it.

    - Heart of Riven (post-kill): in her mouth.


    PLATFORM MECHANICS (legitimate):

    - Split 3/3 into Crystal + Tree rooms.

    - Riven appears in one, Eye of Riven in the other.

    - Riven''s tentacle attack: bait melee range, dodge, hit her until staggered.

    - Riven''s fire attack: wait for end → mouth glows → shoot mouth = stagger.

    - 2 of 10 eyes glow on stagger → call to other room.

    - Other room (with Eye): kill Eye → Essence → use lens to ID symbol on a column → cleanse symbol via
    grenade-button at matching spot.

    - Riven swaps rooms after stagger. New room has DPS window + must shoot CALLED eyes.

    - Repeat for room 2 (now Riven in opposite room).

    - Both groups go upper room (starting room) for joint phase.

    - 3 staggers in upper room = 6 eyes total → shoot all 6 → Creeping Darkness debuff (10 stacks death)
    → starting plates.

    - SKYDIVE DPS: floating down past Riven. Shoot her chest sores. Axion Darts harass.

    - If insufficient damage, cycle repeats.

    - Final stand: teleported to Ascendant Plane → race to top while taking environmental damage → grab
    Taken Strength orb → return.

    - Riven''s final attack: shoot her glowing mouth → kill.

    - Climb into her mouth → shoot blight inside her body → done.


    PLATFORM MECHANICS (cheese — most-used method):

    - All 6 in upper crystal room. Watch for shadow.

    - If shadow crosses → Riven not coming first → leave room.

    - Hug purple crystal wall → "Joining Allies" teleport back to initial.

    - Race back to OTHER room before Riven arrives.

    - Gather upper-left where Riven''s limb rests on arrival.

    - Drop Well + hammer limb with meta DPS.

    - Skip past eye-shooting entirely.


    POST-KILL: Heart of Riven Fate''s Chosen escape (see below).

    '
  callouts:
  - when: Riven appearing
    from: spotter
    to: team
    say: '"RIVEN [Crystal/Tree] room."'
    why: Identifies which team gets Riven.
  - when: Stagger achieved
    from: stagger team
    to: team
    say: '"EYES: [eye N1], [eye N2]"'
    why: Other room shoots called eyes when Riven swaps.
  - when: Riven swapping rooms
    from: any
    to: team
    say: '"SWAP — shoot eyes [N1, N2]."'
    why: Damage + correct-eye shot.
  - when: Lens symbol ID
    from: lens_user
    to: team
    say: '"Symbol [name] — position [direction]."'
    why: Cleansing direction for Essence runner.
  - when: Skydive DPS
    from: any
    to: team
    say: '"SORES — shoot darts!"'
    why: Coordinate sore-vs-dart prioritization.
  - when: Final stand — Ascendant
    from: any
    to: team
    say: '"RACE TOP — burst Phalanxes!"'
    why: Don't pause.
  wipe_triggers:
  - Wrong eye shot = wipe.
  - Creeping Darkness 10 stacks = death.
  - Skydive without damage to break HP segment = restart.
  - 'Final blight inside Riven''s body: health depletes, no time to wait.'
  damage_phase_triggers:
  - Skydive past Riven = unlimited DPS window (must break HP segment).
  - Final stand inside Riven's body.
  parallel_timeline:
  - phase: Pull
    all: Step starting plates → skydive down to rooms.
  - phase: Phase 1 — 2 rooms (legitimate)
    crystal_team_3: Engage whatever (Riven OR Eye) is there.
    tree_team_3: Same on other side.
  - phase: Stagger + eye calls
    riven_team: Stagger Riven → call eyes.
    eye_team: Kill Eye → cleanse symbol via lens.
  - phase: Swap
    all: Wait for Riven to swap rooms. Shoot called eyes.
  - phase: Upper room joint (3 staggers)
    all: Gather, kill Goblins/Ogres, stagger 3× = 6 eyes.
  - phase: Skydive DPS
    all: Shoot chest sores + Axion Darts.
  - phase: Final stand — Ascendant
    all: Race top, grab Strength orb.
  - phase: Riven mouth shot + blight
    all: Climb mouth, shoot blight inside body.
  permutations:
  - name: Legitimate 3/3 split
    learner_friendly: true
    summary: True intended encounter. 3-room rotation, eye calls, lens cleanse.
    roles:
    - id: stagger_dps
      count: 3
      does: 'Per room: stagger Riven, call eyes.'
      loadout:
        subclass: Any (no element enforced); a survivable build for tentacle/fire baiting
        weapons: Add-clear primary plus a burst heavy for the eye-DPS windows
        exotic_armor: ''
        armor_stats: &id001
        - Health
        - Weapons
        surges_mods: Match surge mods to heavy element; Health for boss melee, Weapons (Mobility) for
          repositioning
    - id: essence_runner
      count: 3
      does: 'Per room: kill Eye, cleanse via lens.'
      loadout:
        subclass: Any add-clearing subclass; mobility helps reach the lens and cleanse spot
        weapons: Strong add-clear primary to kill Eye of Riven Captains for Essence
        exotic_armor: ''
        armor_stats: &id002
        - Weapons
        - Health
        surges_mods: Weapons (Mobility) for lens jumps and cleanse travel; Health for survivability
  - name: Wall-hug cheese (most common)
    learner_friendly: true
    summary: 'All 6 in upper crystal room. Watch shadow → leave or stay.

      Hug purple wall → teleport back via ''Joining Allies''. Race

      to other room. Hammer limb with Well + meta DPS.

      '
    best_for: All practical clears.
    roles:
    - id: cheese_dps
      count: 6
      does: All 6 hammer limb in upper-left during cheese.
      loadout:
        subclass: A subclass built around a high-burst damage Super and Well support for the limb hammer
        weapons: Highest-burst meta heavy (Linear Fusion or Rocket Launcher) for the limb burst
        exotic_armor: ''
        armor_stats: &id003
        - Super
        - Weapons
        surges_mods: Match weapon surge mods to your heavy element; Super (Intellect) and Weapons (Mobility)
          for repeated burst and the race-back movement
  cheese:
  - title: Wall-hug method
    detail: 'The standard. See PLATFORM MECHANICS (cheese) above. Has

      minor luck element (shadow crossing). Once Riven arrives at

      the limb, stack Well + sustained DPS for ~5-10s burst per

      cycle. Skips eye-coordination entirely.

      '
  common_mistakes:
  - 'Cheese: wrong shadow read → wasted cycle.'
  - 'Legitimate: wrong eye shot = full wipe.'
  - 'Skydive: not shooting Axion Darts = chest sores blocked.'
  - 'Ascendant race: stopping to fight Phalanxes = environmental damage death.'
  rewards:
    guaranteed:
    - 1× raid weapon or armor
    - Final boss chest (Heart of Riven escape)
    hidden_chest: null
    potential_drops:
    - '**One Thousand Voices** (exotic fusion rifle, Solar) — RNG drop from Riven chest. Can re-roll with
      Spoils of Conquest.'
    - Any Legendary weapon from the Last Wish pool (Chattering Bone, The Supremacy, Transfiguration, Apex
      Predator, Age-Old Bond, Nation of Beasts, Techeun Force, Tyranny of Heaven).
    - Any Great Hunt armor piece.
