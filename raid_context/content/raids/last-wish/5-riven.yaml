    overview: ''
    setup: ''
    callouts: ''
    damage_phase: ''
  learner_path:
  - '1st: cheese_dps (the way 95% of groups run it).'
  - '2nd: legitimate stagger_dps.'
  - '3rd: lens_user / essence_runner.'
  plain_language_steps:
  - '1. Step on the starting plates to skydive down. The fireteam splits 3/3 into two side rooms: Crystal
    (blue) and Tree. This is the most communication-heavy fight in the raid.'
  - 2. Riven, a massive Ahamkara dragon, appears in one room while an Eye of Riven appears in the other.
    Spotters call which room has Riven.
  - '3. The Riven team staggers her: bait her tentacle attack, dodge, and hit her until staggered, or
    wait out her fire attack and shoot her glowing mouth to stagger.'
  - 4. On a stagger, 2 of her 10 eyes glow. Call those eye numbers (1-10) to the other room so they know
    which eyes to shoot.
  - 5. The Eye team kills their Eye of Riven, grabs Essence, looks through the lens to identify a symbol
    on a column, and cleanses it with the grenade button at the matching spot.
  - 6. When Riven swaps rooms, the receiving team gets a DPS window and must shoot ONLY the called eyes.
    Shooting a wrong eye wipes the team.
  - '7. Both groups then meet in the upper starting room for the joint phase: kill the adds and stagger
    her 3 times for 6 eyes total. Shooting all 6 applies Creeping Darkness (10 stacks kills you).'
  - '8. Skydive DPS: float down past Riven, shoot the sores on her chest, and clear the Axion Darts that
    otherwise block your shots.'
  - '9. If you do not break the HP segment, the cycle repeats. Otherwise you proceed to the final stand
    in the Ascendant Plane: race to the top through environmental damage and grab a Taken Strength orb
    without stopping to fight Phalanxes.'
  - '10. Shoot Riven''s glowing mouth on her final attack, climb into her mouth, and shoot the blight
    inside her body to finish. Note: most groups instead use the wall-hug CHEESE, hugging the purple crystal
    wall to get a ''Joining Allies'' teleport, racing to the other room, and hammering her limb with a
    stacked Well plus meta DPS to skip the eyes entirely.'
  defense:
    incoming_damage:
      adds:
      - Taken (Eye of Riven Captains, Taken Goblins and Ogres in the joint phase, Phalanxes during the
        Ascendant Plane race, Axion Darts during skydive)
      boss:
      - Taken (Riven's tentacle melee and fire attack); Creeping Darkness stacking debuff that kills at
        10 stacks; Ascendant Plane environmental damage
    champions: []
    recommended_defensive_mods:
      elemental:
      - No enforced burn (no Master). Survivability matters most during Creeping Darkness and the Ascendant
        race; no specific element resist required.
      concussive:
      - Not specifically called for; the threats are wrong-eye wipes, Creeping Darkness, and the environmental
        race rather than knockback.
  damage:
    surges:
    - No fixed DPS-phase element enforced. Burst element is free; the cheese leans on a stacked Well plus
      the highest-burst meta heavy.
    burst_windows: Skydive past Riven is an effectively unlimited window but you must break an HP segment;
      in the wall-hug cheese, roughly a 5-10 second limb-hammer burst per cycle once she arrives.
    recommended_dps:
    - Highest-burst meta heavy (Linear Fusion or Rocket Launcher) for the limb/skydive
    - Well of Radiance stacked on the DPS spot
    - Cuirass-style one-and-done damage supers for the limb cheese
    - Whisper of the Worm
    - a shotgun (unspecified)
    - Nation of Beasts (hand cannon, god roll)
    - a good pulse rifle
    - Chattering Bone (pulse rifle)
    - Bygones (pulse rifle)
    - The Supremacy (sniper)
    - Sleeper Simulant
