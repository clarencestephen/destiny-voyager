  meta_loadout:
  - Primarily uses your Super for this encounter; bring one long-range and one close-range weapon
  - 'Recommended: a good pulse rifle + Legend of Acrius shotgun + Sleeper Simulant'
  - You can swap the pulse for Bygones
  - Avoid bringing too much long range (e.g. Whisper of the Worm or a sniper) since she flinches a lot
  - 'Alternate (no Sleeper): Legend of Acrius shotgun for DPS, can run multiple shotguns; you mainly need
    shotgun ammo plus your Super'
