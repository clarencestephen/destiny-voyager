  - role_id: support
    subclass: Any add-clearing subclass; suppression helps stop Might plate slams inside the Heart
    weapons: Strong add-clear primary to kill Mights of Riven and ambient Taken along the route
    exotic_armor: ''
    armor_stats: *id002
    surges_mods: Weapons (Mobility) to stay in the carrier's aura; Health for survivability while clearing
