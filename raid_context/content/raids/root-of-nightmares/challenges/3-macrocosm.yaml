  name: Macrocosm
  abstract: 'Fight Zo''aurc by aligning planets. Three phases: (1) swap

    mismatched planets between paired triangular platforms; (2) move

    correct-coloured planets to 3 central plates; (3) damage Zo''aurc

    by touching the plate matching his shield aura. Loop until dead.

    '
  master_challenge:
    name: Cosmic Equilibrium
    requirement: 'Every Dark-aura planet must end up on the LEFT side, every

      Light-aura planet on the RIGHT (or whatever side convention

      the team locked at pull). No mixed-polarity sides — pure

      separation by the end of the encounter.

      '
    enforced_on: Master only
differs_from_base: 'Adds the ''Cosmic Equilibrium'' constraint on top of the normal encounter: Every Dark-aura
