  learner_path:
  - '1st clear: floater. Lowest mechanic load.'
  - '2nd: refuge-maker. Practice reading shoulder-break tattoos.'
  - '3rd: light-runner or dark-runner.'
  - '4th+: hunted (the chest-aggro specialist).'
  plain_language_steps:
  - '1. Before pulling, lock roles and side conventions out loud: 1 Hunted (chest-breaker), a Light runner
    on one side, a Dark runner on the other, two Refuge-makers (one per side), and a Floater. Decide which
    side is Light and which is Dark - side mixing is a wipe. The encounter starts only when someone approaches
    Nezarec''s sarcophagus.'
  - 2. The arena is split into two halves by Nezarec's central raised platform. One side has Nodes of
    Splendor (white), the other has Nodes of Decay (dark).
  - 3. The Hunted walks into Nezarec's view and breaks his chest weak point to pull aggro onto themselves,
    calling Aggroed - chest broken.
  - 4. The Light runner builds a Field of Light chain on their side (shoot active white node, follow trail,
    link inactive white node, refresh). The Dark runner builds a Flux of Darkness chain on the other side
    the same way.
  - 5. The Floater clears adds - Colossi, War Beasts, and Legionaries - throughout.
  - 6. When Nezarec begins his Overwhelming Energy windup (his back glows white), refuge-makers pre-position
    by an INACTIVE node on their side and runners pause to refresh a buff that can convert to a refuge.
  - 7. The Hunted (or designated shoulder-breaker) breaks BOTH of Nezarec's shoulders only AFTER the windup
    begins. A tattoo then appears on his back. Breaking shoulders too early hides the tattoo.
  - '8. Read the tattoo colour and remember it is ALWAYS opposite: a LIGHT tattoo means Overwhelming Light
    is coming, so make a DARKNESS''s Refuge; a DARK tattoo means make a LIGHT''s Refuge.'
  - 9. To make a refuge, a refuge-maker holds the OPPOSITE buff and shoots an INACTIVE node (Darkness's
    Refuge = hold Field of Light, shoot inactive Node of Decay; Light's Refuge = hold Flux of Darkness,
    shoot inactive Node of Splendor). A bubble spawns at your feet - stand in it to survive the wipe pulse.
  - 10. If Nezarec's Hatred targets a player (a psionic blast appears under their feet), they call it
    and move; the Hunted re-breaks the chest to pull aggro back.
  - 11. When BOTH chains complete, an orange beam fires from the sarcophagus and Nezarec becomes vulnerable
    for about 15 seconds. Everyone collapses to the final seed spot of the last-completed side and burns
    him - do NOT stand on the central platform, he teleport-slams there.
  - 12. After the window he re-immunes with a suppression slam; return to start positions and loop. During
    Final Stand he turns black with Resonant energy - race his timer to finish.
  defense:
    incoming_damage:
      adds:
      - Cabal Legionaries deal Solar damage
      - War Beasts deal close-range physical/melee damage
      - Cabal Colossi deal Solar (slug-rifle) damage
      boss:
      - 'Nezarec, Final God of Pain: Overwhelming Light / Overwhelming Darkness wipe pulses (Light and
        Dark paracausal), Nezarec''s Hatred psionic blast under a targeted player, and a suppression teleport-slam'
    champions:
    - Barrier Colossus -> Anti-Barrier (artifact mod or intrinsic weapon perk; mandatory this encounter)
    recommended_defensive_mods:
      elemental:
      - Solar resist helps against Legionaries and the Colossi slug rifles
      - There is no single resist that blocks Overwhelming Light/Darkness - the refuge bubble is the only
        protection from the wipe pulse
      - Light's Refuge / Darkness's Refuge auras (created by carrying the opposite buff into a node) are
        the only way to survive Nezarec's Overwhelming/wipe attack — match the Refuge to his broken-shoulder
        color (dark shoulder = Darkness's Refuge, light shoulder = Light's Refuge).
      - Resist mods matched to incoming damage; well of Radiance provides the bulk of phase survivability.
      concussive:
      - Concussive Dampener can soften Nezarec's Hatred psionic blast and clustered add fire while runners
        and refuge-makers work
  damage:
    surges:
    - No fixed elemental surge requirement - damage opens via the orange-beam vulnerability after both
      chains complete, not by weapon element
    - 'There IS a DPS phase: Nezarec is vulnerable for roughly 15 seconds after both Light and Dark chains
      finish'
    - 'Master: Surge + Overcharge each grant 25% to matching element/archetype, not stacking with one
      another; artifact anti-champion adds 25% regardless.'
    - Swap to three matching surge-mod boots (heavy or Izanagi kinetic element) immediately before cracking
      his chest for the damage phase.
    burst_windows: Roughly 15 seconds of vulnerability per cycle after both chains complete; stack on
      the last-completed side's final seed spot and burst hard before he re-immunes.
    recommended_dps:
    - 'Burst heavy: linear fusion rifles, Sleeper Simulant, rockets, or a sword swap'
    - Exotic heavy with high single-target burst for the short window
    - Izanagi's Burden + Auto-Loading Holster Legendary Rocket as the premier burst combo for the chest-stun
      damage windows.
    - Gjallarhorn on at least one player to buff the whole team's legendary rockets.
    - Legendary aggressive/adaptive rockets (Hothead, Bump in the Night, Season's Vengeance) with Explosive
      Light / Lasting Impression for the other five.
    - Cataclysmic / linear fusions (Bait and Switch, Four Times the Charm) and Sleeper Simulant for precision
      boss DPS.
    - Divinity on one Guardian to lock crits on the moving Nezarec; Lumina to over-buff a teammate's damage
      (35% vs Well's 25%) if struggling on DPS.
    - Hunter Star Eater Blade Barrage / Warlock Needlestorm supers for extra damage; keep heavy in reserve
      for Final Stand.
