  learner_path:
  - '1st clear: floater in Standard. No Planetary Insight pressure.'
  - '2nd: swapper in 2-Caller. Learn the swap timing without callouts.'
  - '3rd+: corner-caller in Standard.'
  plain_language_steps:
  - '1. Before pulling, assign the 4 triangular platforms: upper-left, upper-right, lower-left, lower-right,
    each with a designated corner-caller, plus floaters in the middle. The pair structure is strict -
    upper-left coordinates with upper-right ONLY, lower-left with lower-right ONLY.'
  - 2. The encounter starts when two Solar-shielded Centurions spawn near Zo'aurc, Explicator of Planets.
    Floaters burn both Centurions to trigger the rest of the encounter.
  - 3. A Terrestrial Lieutenant (Cabal Colossus) spawns on each of the 4 triangular platforms. Each corner-caller
    kills their Lieutenant to gain Planetary Insight and Planetary Affinity (these buffs travel with you
    for about 30 seconds).
  - '4. Phase 1 - side alignment: with Planetary Insight you can read planet colours on your platform.
    Identify mismatched planets and call them to your pair partner specifically by POSITION (e.g. third
    from front, Light). Do not say just the colour.'
  - 5. To swap a planet, interact with the orb on the floor beneath it - this starts a Planetary Shift
    timer. BOTH halves of a mutual swap must interact within their Planetary Shift windows, or the planet
    returns to its original spot.
  - 6. Once all side swaps are done, respawning Lieutenants must be re-killed for fresh Planetary Insight,
    and the 3 central plates reveal themselves.
  - '7. Phase 2 - central alignment: read which colour each central plate needs (e.g. left = Light, middle
    = Dark, right = Light) and move the correct-coloured planets onto the matching plates. A wrong-coloured
    planet causes a planetary collision wipe.'
  - 8. When both side and central alignments are complete, Zo'aurc drops to the lower level wearing a
    Light or Dark aura. Call the aura colour.
  - 9. To damage Zo'aurc, TOUCH the plate matching his aura once (left = Light, etc.) to gain the matching
    buff. You only need to touch it once - then move freely and shoot him.
  - 10. Mid-damage, Zo'aurc winds up a flame-twister telegraph and flips his aura. Switch to the opposite
    plate to keep damage flowing.
  - 11. After the damage window he re-immunes; return to your corners and re-kill the respawning Lieutenants
    to loop the mechanic.
  - 12. Repeat until Final Stand, then race his planet-collision timer with continuous matched-plate damage
    to finish him.
  defense:
    incoming_damage:
      adds:
      - Solar-shielded Centurions deal Solar damage at the start
      - Psions deal Arc/Void damage and are everywhere; bubble Aspirants split if shot at range
      - Terrestrial Lieutenants (Cabal Colossus) deal Solar (slug-rifle) damage on the platforms
      boss:
      - 'Zo''aurc, Explicator of Planets: planetary-collision/alignment wipe pressure plus a flame-twister
        aura-flip telegraph during damage'
    champions: []
    recommended_defensive_mods:
      elemental:
      - Solar resist helps against the opening Solar-shielded Centurions and the Terrestrial Lieutenant
        slug rifles
      - Run resist mods matched to incoming damage; rally with a 3x reserves chest matching heavy element,
        then swap back to resist chest for the fight.
      concussive:
      - Concussive Dampener can soften clustered Cabal and Lieutenant AoE on the triangular platforms
        where space is tight
  damage:
    surges:
    - No fixed elemental surge requirement - damage is gated by touching the plate matching Zo'aurc's
      Light or Dark aura, not by a weapon element
    - 'There IS a DPS phase: Zo''aurc becomes damageable after both alignments complete and he drops with
      an aura'
    - 'Master: Surge and Overcharge give 25% to the matching element/archetype (they do not stack with
      each other); seasonal artifact gives 25% anti-champion regardless.'
    - Swap on boots with three matching surge mods (to your heavy or Izanagi's kinetic) right before the
      Zo'Aurc damage phase.
    burst_windows: Short windows (roughly 10-15 seconds per plate before the aura flips); burst Zo'aurc,
      reposition for the flip to the opposite plate, then burst again.
    recommended_dps:
    - 'Burst heavy: linear fusion rifles, Sleeper Simulant, Two-Tailed Fox with heavy ammo'
    - Sword-swap or rocket burst for the short matched-plate windows
    - 'Izanagi''s Burden + Auto-Loading Holster Legendary Rocket (aggressive/adaptive frame) is the best
      burst combo: shoot Honed Edge, stow, pull rocket.'
    - 'Legendary Rockets for the team: Hothead, Season''s Vengeance, Bump in the Night with Explosive
      Light / Lasting Impression / Frenzy.'
    - Gjallarhorn on at least one Guardian to buff all the team's rockets (no exceptions per Mactics).
    - Linear Fusion option (Cataclysmic with Bait and Switch / Four Times the Charm, or Storm Chaser,
      Taipan) for the boss.
    - Divinity on one player to guarantee crits on the moving/awkward-crit boss; Wither Hord for endurance/multi-phase
      damage and to charge Starfire grenades in the background.
    - Hunter Blade Barrage (Star Eater) and Warlock Needlestorm out-damage Titan Thundercrash for the
      super DPS.
