  meta_loadout:
  - 'Warlock: Solar Starfire Protocol Dawnblade with Well of Radiance for the damage phase; Fusion grenade
    + Touch of Flame, ashes fragment for boss encounters. Bring two Warlocks so Wells last the whole DPS
    phase.'
  - 'Hunter: Solar Star Eater Scales with Blade Barrage super (Knock ''Em Down + On Your Mark) is a top
    DPS super; Void Nightstalker tether (Gyrfalcon) for debuff/orbs if not needed for damage.'
  - 'Titan: Arc Striker with Thundercrash; Heart of Inmost Light until DPS, then swap to Cuirass of the
    Falling Star to pop super, then swap back. Touch of Thunder + Knockout, pulse grenades.'
  - 'Overgear subclass shortlist: Hunter Nightstalker/Threadrunner, Titan Sunbreaker/Berserker, Warlock
    Dawnblade/Shadebinder. Bosses have small health pools so any weapon works, even on Master.'
