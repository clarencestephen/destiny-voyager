  learner_path:
  - '1st: add_clear.'
  - '2nd: scanner.'
  - '3rd: operator.'
  plain_language_steps:
  - '1. Drop the rally banner. Split the team 3 and 3: three players go to the LIGHT (white-lit) room
    and three to the DARK (dimmed) room.'
  - 2. In one room a player takes the Operator augment (red) from a terminal, then shoots a red-glowing
    wall panel to drop into the basement.
  - 3. A Hacker Vandal spawns and drops the Scanner augment (yellow). Have a player grab it and stay upstairs.
  - 4. The upstairs Scanner looks down through the plexiglass column bottoms into the basement and finds
    the ONE panel glowing yellow, then calls its position and side.
  - '5. The basement Operator shoots that yellow panel. You need 4 total panel hits: 2 on the dark side
    and 2 on the light side.'
  - 6. Move the Scanner augment between the dark and light sides using the Augment Terminals. Only one
    augment fits per terminal, so coordinate transfers.
  - 7. Watch the Operator's 1-minute timer. If the Operator overstays, the Crypt fires a kill, so swap
    out before it expires.
  - 8. When a Sentinel Servitor spawns, burn it immediately. It disables the terminals and stalls augment
    transfers.
  - 9. After 4 panels are shot, the damage phase opens. Indicator lights on the basement pillar show which
    fuse (left, middle, or right) and which side to shoot.
  - 10. The Scanner calls the correct fuse, and the upstairs teams shoot that fuse cylinder. A wrong fuse
    wipes the team.
  - 11. Repeat the panel-then-fuse cycle until all 6 fuses are shot, which ends the encounter.
