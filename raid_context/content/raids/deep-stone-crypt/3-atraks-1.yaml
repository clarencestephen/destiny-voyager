        duplicates
      concussive:
      - Concussive Dampener optional; low priority since damage is mostly direct-fire, not large area-of-effect
  damage:
    surges:
    - Sword DPS with The Lament is the recommended primary damage; pair with a damage surge matching your
      chosen sword's element (Lament is Arc), and stack the same surge across the team for the duplicate
      kills
    burst_windows: Burst window opens each phase once the Scanner marks the correct yellow duplicate;
      converge and kill it fast before the Replication timer pressures the room.
    recommended_dps:
    - Heavy sword (The Lament) for tight single-target burst
    - Aggressive-frame sniper (Whisper) for cross-room duplicate kills when sword approach is unsafe
