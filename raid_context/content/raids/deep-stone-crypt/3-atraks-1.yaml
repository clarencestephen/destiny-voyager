  learner_path:
  - '1st: sword_user.'
  - '2nd: scanner.'
  - '3rd: operator.'
  plain_language_steps:
  - '1. Drop the rally banner, then touch the purple orb near the space pods to start the fight. Split
    3 and 3: three stay in the Laboratory and three take the space pods up to the Orbital Station.'
  - 2. Each team destroys 3 Sentinel Servitors (6 total) to begin the damage phase. Call each Sentinel
    down as it dies.
  - 3. When 6 Sentinels are down, Atraks-1 begins Extinction Protocol. The Scanner in that room finds
    the one duplicate glowing yellow and calls its position.
  - 4. The sword users (Lament recommended) converge on the correct duplicate and kill it. Whisper can
    also snipe some duplicates from across the room if the Scanner calls fast.
  - 5. Killing the correct duplicate drops a purple Atraks-1 Replication orb with a 45-second timer. Call
    it out immediately.
  - 6. A carrier takes the Replication orb to an airlock. The Operator shoots the red panel to open that
    airlock, the carrier walks in, and the door closes to eject the orb into space.
  - 7. Do not stand in the airlock too long when the door closes, or you get ejected into space and die.
    Step out as soon as the orb is in.
  - 8. If the timer is running low, the Operator can shoot the orb overhead to reset it back to 45 seconds.
  - 9. Damage phases alternate between Orbital and Lab. Juggle the Scanner and Operator augments between
    sides through the terminals so each room is covered.
  - 10. Run 4 damage phases total, ejecting a Replication orb each time, until the final stand begins.
  - 11. For the final stand, bring all 6 players to the Orbital Station. All 8 duplicates spawn at once.
    Burst the correct sequence to finish Atraks-1.
  defense:
