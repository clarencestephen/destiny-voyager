  learner_path:
  - '1st: carrier.'
  - '2nd: operator or scanner.'
  - '3rd: suppressor (most complex routing).'
  plain_language_steps:
  - '1. Drop the rally banner, then approach the Taniks wreckage to start. Distribute augments: one Operator,
    one Scanner, one Suppressor, with three carriers/floaters.'
  - 2. Taniks flies between 3 areas (spawn, blue, orange). Track and call his location each time so the
    team converges.
  - 3. At the area Taniks is in, his booster jets become vulnerable. Shoot them to drop 2 to 4 nuclear
    cores. Collecting enough cores stops his Turbulent Detonation wipe.
  - 4. Watch for Turbulent Barrage (purple light columns from above). It previews the Turbulent Detonation
    wipe, so do not stand in the columns and make sure cores get collected in time.
  - 5. Taniks detains players in spheres. The Operator shoots a detained player's sphere to free them;
    the detained player calls their direction.
  - 6. The Scanner identifies which 2 deposit bins glow yellow this cycle (2 per area, 6 total) and calls
    them.
  - 7. The Suppressor walks through all 3 drones in an area to charge, then shoots Taniks (he glows blue)
    to stun him. A good pace is to let Taniks encase players twice, then stun on the third opportunity.
  - 8. While Taniks is stunned, carriers deposit cores into the correct yellow bins. Manage Radiation
    (10 stacks = death) by passing cores, and never use a wrong bin or you die.
  - 9. After 4 cores are deposited correctly, the Shock Field appears. Position between the 2 spheres
    inside the field.
  - '10. DPS Taniks from inside the field: too close to the spheres takes Arc damage, and too far from
    center means rotating-debris death. If pushed out of the field, re-enter carefully.'
  - 11. Repeat the cycle through 3 damage phases until enrage.
  - 12. In the final stand, Taniks teleports between spawn, blue, and orange. Track every teleport and
    kill him fast, because 5 teleports without a kill is an instant team death.
  defense:
    incoming_damage:
      adds:
      - Kinetic/ballistic damage from ambient Fallen House of Salvation adds across the 3 areas
      boss:
      - Arc damage from Taniks's Shock Field spheres when standing too close
      - Physical/collision damage from rotating debris when too far from the field center
      - Wipe-level area damage from Turbulent Barrage columns and the Turbulent Detonation attack
    champions: []
    recommended_defensive_mods:
      elemental:
      - Arc resistance helps survive the Shock Field sphere proximity damage during DPS
      concussive:
      - Concussive Dampener optional; primary threats are the Arc field and scripted wipe attacks rather
        than typical add area blasts
  damage:
    surges:
    - DPS happens inside the Shock Field after 4 cores are deposited. Match your damage surge to your
      chosen burst weapon; with Eyes of Tomorrow or other Solar rockets, run Solar surge and stack it
      team-wide for the speed strategy
    burst_windows: Burst window opens when the Shock Field appears after 4 correct deposits; stand between
      the spheres and unload until the field times out or Taniks resists, aiming for 1-3 phases.
    recommended_dps:
    - Exotic rocket launcher (Eyes of Tomorrow) paired with a healing/Well support for the speed kill
    - Heavy burst options (linear fusion or rockets) plus a damage-buff support like Well of Radiance
      for sustained field DPS
