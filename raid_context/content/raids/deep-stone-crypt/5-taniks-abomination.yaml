      loadout:
        subclass: Survivable subclass with mobility to relay deposit-bin calls across areas
        weapons: Precision primary for self-defense; heavy burst weapon for the Shock Field DPS phase
        exotic_armor: ''
        armor_stats: &id002
        - Health
        - Class
        surges_mods: Run Enhanced Scanner augment mod; add a damage surge matching your heavy for the
          field phase.
    - id: suppressor
      count: 1
      does: Drone routing + stun.
      loadout:
        subclass: Survivable subclass to hold drone routes and land the stun shot on Taniks
        weapons: Reliable primary to land the blue-glow stun shot; heavy burst weapon for the Shock Field
          DPS phase
        exotic_armor: ''
        armor_stats: &id003
        - Health
        - Class
        surges_mods: Run Enhanced Suppressor augment mod; add a damage surge matching your heavy for the
          field phase.
    - id: carrier
      count: 3
      does: Cores + boosters + deposits.
      loadout:
        subclass: Mobile, self-sustaining subclass to manage Radiation, shoot boosters, and deposit cores
        weapons: Add-clear primary plus a heavy burst weapon (Eyes of Tomorrow or linear) for the Shock
          Field DPS phase
        exotic_armor: ''
        armor_stats: &id004
        - Health
        - Class
        surges_mods: Damage surge matching your heavy (Solar for Eyes of Tomorrow); survivability and
          Arc-resist mods for the field phase.
  - name: 'Speed: Eyes of Tomorrow DPS'
    learner_friendly: false
    summary: Multiple Eyes of Tomorrow + Well = 1-2 phase Taniks. Spawn-side DPS.
  cheese: []
  common_mistakes:
  - Wrong bin deposit.
  - Suppressor stunning too fast → augment deactivation cascade.
  - Standing in Turbulent Barrage columns = damage.
  - 'Final stand: not tracking teleports = 5-teleport instant death.'
  rewards:
    guaranteed:
    - 1× raid weapon or armor
    - Final boss chest
    hidden_chest: null
    potential_drops:
    - '**Eyes of Tomorrow** (exotic rocket launcher, Solar) — RNG drop from final chest.'
    - Bequest (adaptive sword, Arc)
    - Commemoration (adaptive machine gun, Void)
    - Legacy's Oath armor — Helm + Chest + Legs (encounter-specific slots)
