    callouts: ''
    damage_phase: ''
  learner_path:
  - '1st: chalice_runner OR sword_user with sherpa guidance.'
  - '2nd: sword_user.'
  - '3rd: oversoul_dunker.'
  plain_language_steps:
  - 1. Rally outside, then have all six players 'kiss the crystal' (touch it) to start. Green barriers
    seal the team in after about 5 seconds and Crota, Son of Oryx spawns in front of the chamber — stand
    behind the crystal.
  - 2. Split Left and Right (3 and 3) and clear adds, including the 4 boomer Knights in the two towers
    (2 each).
  - 3. After the boomer Knights, 2 Ogres and a Swordbearer Knight spawn in the middle. Kill the Swordbearer
    to drop a sword (45-second pickup window).
  - 4. An Enlightened player picks up the sword. Cycle the Chalice in the safe 'circles of light' — the
    Presence of Crota debuff blocks normal healing and normal Chalice swaps, so only swap inside a safe
    circle.
  - 5. Repeat the cycle (Knights respawn) to collect 3 swords per damage phase (or 2 swords plus a Tractor
    Cannon hit).
  - 6. To break Crota's shield, hit him with Tractor Cannon for a damage amp, then have the sword users
    swing — simultaneously for the challenge, or one-by-one normally.
  - 7. When the shield breaks, the DPS window opens. Stack on Well of Radiance (bring multiple Wells —
    Crota destroys a single Well fast) and burn him.
  - 8. At DPS start a large green Oversoul orb appears with a roughly 20-second timer. An Enlightened
    player must destroy it before it expires or the team wipes — time the destruction for about 3-4 seconds
    left to maximize damage.
  - 9. Destroying the Oversoul ENDS the DPS phase, so coordinate the timing. If you don't break the shield,
    reset the sword cycle and try again.
  - '10. At around 30% HP Crota enters his final stand: he stands up, is briefly immune, then the shield
    drops and the Oversoul returns with another 20-second timer. Destroying it extends DPS by about 10
    seconds.'
  - 11. Push burst damage through the final stand to defeat Crota.
  defense:
    incoming_damage:
      adds:
      - Boomer Hive Knights fire Solar boomer blasts
      - Hive Ogres fire Void eye-beams
      - Swordbearer Knight deals melee/Solar
      boss:
      - Crota deals heavy melee/Knight sword swings (physical/kinetic) — high Health stat helps survive
      - Oversoul is a timed wipe orb rather than an elemental projectile
    champions:
    - 'Master only: Unstoppable Ogre -> Anti-Unstoppable'
    - 'Master only: Barrier Knight -> Anti-Barrier'
    - 'Master only: Overload Wizard -> Anti-Overload'
    recommended_defensive_mods:
      elemental:
      - Solar resist for boomer Knight fire
      - Void resist for Ogre eye-beams
      concussive:
      - Concussive Dampener helps against Ogre eye-beam and boomer Knight knockback that can push players
        into the chamber pit
  damage:
    surges:
    - Match the DPS surge to your team's burst element. Crota is shield-broken by sword swings (amplified
      by Tractor Cannon), so pick the element your heavy/Well burst loadout uses and run matching surge
      mods.
    - Match leg surge mods to the element of your heavy weapon — at least 2, preferably 3 (e.g. Solar
      heavy -> Solar surges). The source prescribes matching the heavy element rather than a single fixed
      surge element (KackisHD).
    burst_windows: DPS opens after the sword shield-break and lasts until the ~20s Oversoul timer is destroyed;
      destroying the Oversoul ends DPS, so burst hard inside Well and drop the Oversoul at ~3-4s left.
    recommended_dps:
    - Tractor Cannon (exotic shotgun) to apply the shield-break damage amp
    - Hive swords (encounter-dropped) for the shield break
    - Heavy burst (rocket launcher such as Gjallarhorn, or linear fusion rifle) for the DPS window
    - Well of Radiance support — bring multiple Wells for sustain
    - 'The Lament (exotic sword): block first to start the chainsaw, then 3-4 light attacks followed by
      1 heavy, repeat — outputs a tremendous amount of damage; easiest one-phase option for the five non-debuffer
      players (KackisHD). Mactics'' Lament combo: hold block, 2 swings, heavy attack, then 2 unblocked
      light attacks (hold a movement key to re-enter block faster) to keep Loose Blades recharging.'
    - 'Legend of Acrius (exotic shotgun, with Exotic Catalyst for Trench Barrel + extra reserves): melee
      then shoot-shoot-shoot for the +50% Trench Barrel window; reload-one-then-shoot rhythm — Kackis
      found this even easier than Lament for a consistent one-phase (KackisHD).'
    - Fallen Guillotine (legendary sword) with Relentless Strikes + Whirlwind Blade for a one-phase if
      you lack Lament; can hot-swap to Conditional Finality (with a Stasis loader mod) for a quick double-shot
      of extra damage (KackisHD).
    - 'Rockets for a safe two-phase from the upper ledge: Cold Comfort (God roll, bait-and-switch), Apex
      Predator, or Hot Head, combined with a Gjallarhorn and a Divinity for the ranged debuff (KackisHD).'
    - 'Gjallarhorn (exotic rocket): Mactics calls it a must-have — one player minimum must bring it to
      buff the fireteam''s rocket damage by roughly 24% when others use rockets (Mactics).'
    - 'Apex Predator: Mactics'' favorite legendary rocket — Bait and Switch + Reconstruction + Impact
      Casing + Quick Launch + Boss Spec, Velocity Masterwork (avoid Handling Masterwork as it pulls the
      rocket out too early on Izanagi''s swaps) (Mactics).'
    - 'Izanagi''s Burden (kinetic sniper, exotic): high-damage option for bursting Crota, paired with
      an auto-loading / Reconstruction rocket so you cancel the reload and cycle Izanagi''s -> rocket
      for Bait and Switch (Mactics).'
    - Thunderlord (exotic machine gun, with Catalyst required) for a stress-free two-phase from the upper
      ledge after Rally with reserves, with one player on Divinity for the crit bubble (KackisHD).
    - Tractor Cannon (exotic shotgun) as the team weaken debuffer, re-applied to Crota throughout DPS
      (KackisHD / Mactics).
    - 'Burning Maul super: hitting Crota makes him kneel again (chain-kneel), but you do poor damage as
      the Burning Maul wielder; Gathering Storm can also make Crota kneel repeatedly (KackisHD).'
