  meta_loadout:
  - 'General Crota DPS leg armor: at least 2 and preferably 3 surge mods matching the element of your
    heavy weapon (e.g. Solar heavy -> 3 Solar surge mods); accept dropping to ~90 Grenade instead of 100
    to fit them (KackisHD).'
  - 'Rally with reserves: keep a separate chest piece with triple Reserve mods matching your heavy element,
    rally the flag with it on for max heavy, then swap to your normal (damage-resistance) chest — you
    keep the maxed reserves (KackisHD).'
  - 'Buff/support: stand in a Well of Radiance (or substitute Banner Shield / Weapons of Light); Mactics
    recommends a minimum of one Well of Radiance in the fireteam — Sunbracers for more personal damage,
    or Lunafaction Boots to empower the team''s reload during DPS (Mactics / KackisHD).'
  - 'Debuff role: one player on Tractor Cannon re-applying Weakened to Crota every ~5 seconds (it lasts
    ~7s), and meanwhile doing damage with an auto-loading fusion (e.g. Riptide) between Tractor shots;
    Divinity is the alternate ranged debuff (KackisHD).'
  - 'Jolt role: an Arc Hunter using Gathering Storm to stick Crota and apply Jolt for big extra damage;
    boost it with Star-Eater Scales by collecting orbs before firing the super (KackisHD).'
  - 'Arc Hunter (Mactics general-purpose / DPS swap): Gathering Storm super, Gambler''s Dodge, Combination
    Blow, Pulse Grenade, Lethal Current + Flow State; fragments Feedback/Resistance/Shock/Magnitude. Run
    Assassin''s Cowl for general use and hot-swap to Star-Eater Scales just before DPS (collect orbs)
    (Mactics).'
  - 'Void Hunter (Mactics): Deadfall or Moebius Quiver tether, Gambler''s Dodge, Vortex Grenade, Trapper''s
    Ambush, Vanishing Step; fragments Obscurity/Starvation/Persistence/Harvest. Run Omnioculus general-purpose
    and hot-swap to Orpheus Rig right before DPS for three Moebius Quiver shots (Gyrfalcon''s Hauberk
    is an equivalent option, swapping Vanishing Step for Stylish Executioner) (Mactics).'
  - 'Solar Hunter (Mactics): Blade Barrage super, Gambler''s Dodge, Knife Trick, Trip Mine Grenade, On
    Your Mark + Knock ''Em Down; fragments Torches/Solace/Singeing/Benevolence/Ashes. Run Young Ahamkara''s
    Spine general-purpose and hot-swap to Star-Eater Scales for the DPS phase (Mactics).'
  - 'Strand Warlock (Mactics): Needlestorm super, Healing Rift, Threadling Grenade, Weaver''s Call + Weavewalk;
    fragments Evolution/Fury/Generation; exotic Swarmers boots; pairs with Quicksilver Storm and Monte
    Carlo (Mactics).'
  - 'Solar Warlock (Mactics): Well of Radiance super, Healing Rift, Incinerator Snap, Solar Grenade, Heat
    Rises + Touch of Flame; fragments Torches/Benevolence/Ashes/Solace; exotic Sunbracers (or Lunafaction
    Boots to empower the team''s reload during DPS) (Mactics).'
  - 'Arc Titan (Mactics): Thundercrash super, Thruster, Thunderclap (or Seismic Strike/shoulder charge),
    Pulse Grenade, Knockout + Touch of Thunder; fragments Sparks of Resistance/Shock/Amplitude/Magnitude.
    Run Heart of Inmost Light during add-clear and hot-swap to Cuirass of the Falling Star right when
    you enter DPS (Mactics).'
  - 'Strand Titan (Mactics, if swords damage the boss): Bladefury super, Rally Barricade, grapple/Shackle
    grenade, Banner of War + Flechette Storm; fragments Warding/Theory/Generation/Transmutation; exotic
    Synthoceps to juice melee + sword damage (Mactics).'
  - 'Solar Titan (Mactics, ultra-survival add-clear): Hammer of Sol or Burning Maul super, Rally Barricade,
    Throwing Hammer, Healing Grenade, Roaring Flames + Sol Invictus; fragments Torches/Solace/Ashes/Benevolence;
    exotic Synthoceps (Mactics).'
