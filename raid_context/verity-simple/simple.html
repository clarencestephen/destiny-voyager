<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Outfit';src:url('fonts/Outfit-Bold.ttf');font-weight:700}
@font-face{font-family:'WorkSans';src:url('fonts/WorkSans-Bold.ttf');font-weight:700}
*{margin:0;padding:0}body{background:#0a0b10}
</style></head><body><svg width="1500" height="2300" viewBox="0 0 1500 2300" xmlns="http://www.w3.org/2000/svg"><rect width="1500" height="2300" fill="#0a0b10"/><text x="750.0" y="130" font-family="Outfit" font-weight="700" font-size="116" fill="#ffffff" text-anchor="middle" letter-spacing="6">VERITY</text><text x="750.0" y="196" font-family="Outfit" font-weight="700" font-size="44" fill="#ffb43f" text-anchor="middle" letter-spacing="1">INSIDE ROOM — MAKE YOUR ESCAPE KEY</text><text x="750.0" y="248" font-family="WorkSans" font-weight="700" font-size="32" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">Your key is the 2 shapes your statue is NOT holding. Here's how you get them:</text><rect x="80" y="284" width="1340" height="150" rx="14" fill="#14161f" stroke="#ffb43f" stroke-width="3"/><text x="112" y="330" font-family="Outfit" font-weight="700" font-size="30" fill="#ffb43f" text-anchor="start" letter-spacing="2">WHAT'S GOING ON</text><text x="112" y="374" font-family="WorkSans" font-weight="700" font-size="30" fill="#ffffff" text-anchor="start" letter-spacing="0">There are 3 of you inside, each at a statue. You pass shapes between the statues so</text><text x="112" y="410" font-family="WorkSans" font-weight="700" font-size="30" fill="#ffffff" text-anchor="start" letter-spacing="0">each statue ends up with the 2 shapes it is NOT holding. Do these 4 steps in order.</text><rect x="80" y="450" width="1340" height="360" rx="16" fill="#14161f" stroke="#36d3ff" stroke-width="4"/><rect x="80" y="450" width="20" height="360" fill="#36d3ff"/><circle cx="170" cy="528" r="46" fill="#36d3ff"/><text x="170" y="546" font-family="Outfit" font-weight="700" font-size="58" fill="#0a0b10" text-anchor="middle" letter-spacing="0">1</text><text x="250" y="546" font-family="Outfit" font-weight="700" font-size="50" fill="#36d3ff" text-anchor="start" letter-spacing="1">STEP 1 — OBSERVE</text><text x="112" y="620" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Look at YOUR statue — it holds exactly 1 shape.</text><text x="112" y="672" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Look at YOUR backboard — it shows 2 shapes.</text><text x="112" y="724" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Remember both. The Knights you fight carry the 2 shapes on your backboard.</text><rect x="80" y="824" width="1340" height="360" rx="16" fill="#14161f" stroke="#ffd23f" stroke-width="4"/><rect x="80" y="824" width="20" height="360" fill="#ffd23f"/><circle cx="170" cy="902" r="46" fill="#ffd23f"/><text x="170" y="920" font-family="Outfit" font-weight="700" font-size="58" fill="#0a0b10" text-anchor="middle" letter-spacing="0">2</text><text x="250" y="920" font-family="Outfit" font-weight="700" font-size="50" fill="#ffd23f" text-anchor="start" letter-spacing="1">STEP 2 — PAIR</text><text x="112" y="994" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">GOAL: make your backboard show TWO of your statue's own shape.</text><text x="112" y="1046" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">If a backboard shape is WRONG, give that shape to the statue that DOES hold it</text><text x="112" y="1098" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">(that's its 'matching' statue — deposit the shape there). Never deposit on your own.</text><rect x="80" y="1198" width="1340" height="360" rx="16" fill="#14161f" stroke="#ff5f9e" stroke-width="4"/><rect x="80" y="1198" width="20" height="360" fill="#ff5f9e"/><circle cx="170" cy="1276" r="46" fill="#ff5f9e"/><text x="170" y="1294" font-family="Outfit" font-weight="700" font-size="58" fill="#0a0b10" text-anchor="middle" letter-spacing="0">3</text><text x="250" y="1294" font-family="Outfit" font-weight="700" font-size="50" fill="#ff5f9e" text-anchor="start" letter-spacing="1">STEP 3 — SHARE</text><text x="112" y="1368" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">GOAL: once at least 2 of you have a matched pair (two-of-your-own-shape),</text><text x="112" y="1420" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">give your shapes to the OTHER statues — the ones that don't match that shape.</text><text x="112" y="1472" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Do it LEFT to RIGHT so nobody doubles up.</text><rect x="80" y="1572" width="1340" height="360" rx="16" fill="#14161f" stroke="#46e08a" stroke-width="4"/><rect x="80" y="1572" width="20" height="360" fill="#46e08a"/><circle cx="170" cy="1650" r="46" fill="#46e08a"/><text x="170" y="1668" font-family="Outfit" font-weight="700" font-size="58" fill="#0a0b10" text-anchor="middle" letter-spacing="0">4</text><text x="250" y="1668" font-family="Outfit" font-weight="700" font-size="50" fill="#46e08a" text-anchor="start" letter-spacing="1">STEP 4 — COMBINE</text><text x="112" y="1742" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Kill BOTH Knights, then pick up your 2 shapes — that becomes your escape KEY.</text><text x="112" y="1794" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">Walk out through the glass wall.</text><text x="112" y="1846" font-family="WorkSans" font-weight="700" font-size="33" fill="#ffffff" text-anchor="start" letter-spacing="0">(Killing the Knights spawns an Unstoppable Ogre — be ready for it.)</text><rect x="80" y="1954" width="1340" height="180" rx="14" fill="#2a0f17" stroke="#ff5f9e" stroke-width="3"/><text x="112" y="2004" font-family="Outfit" font-weight="700" font-size="32" fill="#ff5f9e" text-anchor="start" letter-spacing="1">IF YOU MESS UP</text><text x="112" y="2052" font-family="WorkSans" font-weight="700" font-size="30" fill="#ffffff" text-anchor="start" letter-spacing="0">Wrong shape? Dump BOTH shapes on any OTHER statue, then redo your pair.</text><text x="112" y="2094" font-family="WorkSans" font-weight="700" font-size="30" fill="#ffffff" text-anchor="start" letter-spacing="0">Outside team: zoom your camera to call the statue on the glowing pedestal.</text><text x="750.0" y="2266" font-family="WorkSans" font-weight="700" font-size="25" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">FearlessNurseJo's Observe / Pair / Share / Combine method — directions kept intact, said plainly.</text></svg></body></html>
