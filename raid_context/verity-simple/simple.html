ff" stroke="#ffffff" stroke-width="6"/><text x="700" y="1156" font-family="Outfit" font-weight="700" font-size="36" fill="#36d3ff" text-anchor="middle" letter-spacing="0">CIRCLE</text><text x="880" y="1051.0" font-family="Outfit" font-weight="700" font-size="90" fill="#ffffff" text-anchor="middle" letter-spacing="0">+</text><polygon points="1040,943.0 1125,1096 955,1096" fill="#ff5f9e" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/><text x="1040" y="1156" font-family="Outfit" font-weight="700" font-size="36" fill="#ff5f9e" text-anchor="middle" letter-spacing="0">TRIANGLE</text><text x="1300" y="1025.0" font-family="WorkSans" font-weight="700" font-size="26" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">makes a</text><text x="1300" y="1061.0" font-family="Outfit" font-weight="700" font-size="30" fill="#ffb43f" text-anchor="middle" letter-spacing="0">CONE</text><text x="1300" y="1093.0" font-family="WorkSans" font-weight="700" font-size="21" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">(ignore the word)</text><rect x="80" y="1204" width="1320" height="330" rx="16" fill="#14161f" stroke="#ff5f9e" stroke-width="4"/><rect x="80" y="1204" width="22" height="330" rx="0" fill="#ff5f9e"/><text x="150" y="1262" font-family="WorkSans" font-weight="700" font-size="30" fill="#aeb4c2" text-anchor="start" letter-spacing="1">IF YOUR STATUE HOLDS</text><polygon points="250,1297.0 338,1456 162,1456" fill="#ff5f9e" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/><text x="250" y="1508" font-family="Outfit" font-weight="700" font-size="40" fill="#ff5f9e" text-anchor="middle" letter-spacing="1">TRIANGLE</text><text x="430" y="1387.0" font-family="Outfit" font-weight="700" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="0">&#8594;</text><text x="560" y="1262" font-family="Outfit" font-weight="700" font-size="32" fill="#ffffff" text-anchor="start" letter-spacing="1">GRAB THESE 2:</text><circle cx="700" cy="1387.0" r="92" fill="#36d3ff" stroke="#ffffff" stroke-width="6"/><text x="700" y="1508" font-family="Outfit" font-weight="700" font-size="36" fill="#36d3ff" text-anchor="middle" letter-spacing="0">CIRCLE</text><text x="880" y="1403.0" font-family="Outfit" font-weight="700" font-size="90" fill="#ffffff" text-anchor="middle" letter-spacing="0">+</text><rect x="948" y="1295.0" width="184" height="184" rx="6" fill="#ffd23f" stroke="#ffffff" stroke-width="6"/><text x="1040" y="1508" font-family="Outfit" font-weight="700" font-size="36" fill="#ffd23f" text-anchor="middle" letter-spacing="0">SQUARE</text><text x="1300" y="1377.0" font-family="WorkSans" font-weight="700" font-size="26" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">makes a</text><text x="1300" y="1413.0" font-family="Outfit" font-weight="700" font-size="30" fill="#ffb43f" text-anchor="middle" letter-spacing="0">CYLINDER</text><text x="1300" y="1445.0" font-family="WorkSans" font-weight="700" font-size="21" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">(ignore the word)</text><text x="80" y="1572" font-family="Outfit" font-weight="700" font-size="40" fill="#ffffff" text-anchor="start" letter-spacing="2">HOW TO DO IT</text><circle cx="112" cy="1616" r="26" fill="#ffb43f"/><text x="112" y="1626" font-family="Outfit" font-weight="700" font-size="34" fill="#1a1206" text-anchor="middle" letter-spacing="0">1</text><text x="160" y="1628" font-family="WorkSans" font-weight="700" font-size="36" fill="#ffffff" text-anchor="start" letter-spacing="0">KILL the 2 glowing Knights in your room.</text><circle cx="112" cy="1686" r="26" fill="#ffb43f"/><text x="112" y="1696" font-family="Outfit" font-weight="700" font-size="34" fill="#1a1206" text-anchor="middle" letter-spacing="0">2</text><text x="160" y="1698" font-family="WorkSans" font-weight="700" font-size="36" fill="#ffffff" text-anchor="start" letter-spacing="0">PICK UP the 2 shapes — the ones your statue does NOT have.</text><circle cx="112" cy="1756" r="26" fill="#ffb43f"/><text x="112" y="1766" font-family="Outfit" font-weight="700" font-size="34" fill="#1a1206" text-anchor="middle" letter-spacing="0">3</text><text x="160" y="1768" font-family="WorkSans" font-weight="700" font-size="36" fill="#ffffff" text-anchor="start" letter-spacing="0">They turn into your KEY automatically.</text><circle cx="112" cy="1826" r="26" fill="#ffb43f"/><text x="112" y="1836" font-family="Outfit" font-weight="700" font-size="34" fill="#1a1206" text-anchor="middle" letter-spacing="0">4</text><text x="160" y="1838" font-family="WorkSans" font-weight="700" font-size="36" fill="#ffffff" text-anchor="start" letter-spacing="0">WALK into the glass wall to escape.</text><rect x="80" y="1932" width="1320" height="150" rx="14" fill="#2a0f17" stroke="#ff5f9e" stroke-width="3"/><text x="112" y="1982" font-family="Outfit" font-weight="700" font-size="34" fill="#ff5f9e" text-anchor="start" letter-spacing="1">NEVER DO THIS</text><text x="112" y="2028" font-family="WorkSans" font-weight="700" font-size="32" fill="#ffffff" text-anchor="start" letter-spacing="0">&#10006;  Put a shape on YOUR OWN statue.</text><text x="112" y="2066" font-family="WorkSans" font-weight="700" font-size="32" fill="#ffffff" text-anchor="start" letter-spacing="0">&#10006;  Hold 3 shapes. Only ever carry 2.</text><text x="740.0" y="2156" font-family="WorkSans" font-weight="700" font-size="26" fill="#aeb4c2" text-anchor="middle" letter-spacing="0">Verity made simple  ·  after FearlessNurseJo's card</text></svg></body></html>
